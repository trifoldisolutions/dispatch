  .file-tree-delete:focus-visible {
    opacity: 1;
    pointer-events: auto;
  }
  .file-tree-delete svg { width: 14px; height: 14px; display: block; }
  .file-tree-delete:hover { color: var(--danger); background: var(--panel); }
  .file-tree-badge {
    flex: none;
    width: 14px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
  }
  .file-tree-message {
    padding: 4px 4px;
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
  }
  .file-tree-message.error { color: var(--danger); font-style: normal; }
  /* A content match's lines under its file (see buildFileTreeSnippets). */
  .file-tree-snippets { display: flex; flex-direction: column; gap: 1px; padding: 0 4px 4px; }
  .file-tree-snippet {
    min-width: 0;
    display: flex;
    gap: 8px;
    font-size: 12px;
    line-height: 1.5;
    white-space: nowrap;
  }
  .file-tree-snippet-line {
    flex: none;
    min-width: 3ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
  }
  .file-tree-snippet-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--text-dim);
  }
  .file-tree-snippet-text .filter-match { color: var(--text); }
  .file-tree-snippet-more { padding-left: calc(3ch + 8px); font-size: 12px; font-style: italic; color: var(--text-dim); }
  /* Mirrors VS Code's git decoration colors: amber for modified/renamed,
     green for new (added/untracked), red for conflicts, dimmed for ignored.
     Applied to the row so both its icon and label pick up the color. */
  .file-tree-row.git-modified .file-tree-icon,
  .file-tree-row.git-modified .file-tree-label,
  .file-tree-row.git-modified .file-tree-badge,
  .file-tree-row.git-renamed .file-tree-icon,
  .file-tree-row.git-renamed .file-tree-label,
  .file-tree-row.git-renamed .file-tree-badge {
    color: #b45309;
  }
  .file-tree-row.git-added .file-tree-icon,
  .file-tree-row.git-added .file-tree-label,
  .file-tree-row.git-added .file-tree-badge,
  .file-tree-row.git-untracked .file-tree-icon,
  .file-tree-row.git-untracked .file-tree-label,
  .file-tree-row.git-untracked .file-tree-badge {
    color: var(--ok);
  }
  .file-tree-row.git-conflicted .file-tree-icon,
  .file-tree-row.git-conflicted .file-tree-label,
  .file-tree-row.git-conflicted .file-tree-badge,
  .file-tree-row.git-deleted .file-tree-icon,
  .file-tree-row.git-deleted .file-tree-label,
  .file-tree-row.git-deleted .file-tree-badge {
    color: var(--danger);
  }
  .file-tree-row.git-ignored .file-tree-icon,
  .file-tree-row.git-ignored .file-tree-label,
  .file-tree-row.git-ignored .file-tree-badge {
    color: var(--text-dim);
    opacity: 0.55;
  }

  .confirm-overlay { z-index: 60; }
  .confirm-panel {
    max-width: 420px;
    gap: 16px;
  }
  .confirm-message {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-line;
  }
  .confirm-hint {
    margin: -8px 0 0;
    font-size: 12px;
    color: var(--text-dim);
  }
  .confirm-hint strong { color: var(--text); font-weight: 600; }
  .confirm-input {
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    width: 100%;
  }
  .confirm-input:focus { outline: none; border-color: var(--accent); }
  .confirm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .confirm-btn {
    padding: 9px 16px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  .confirm-btn.danger { border-color: var(--danger); background: var(--danger); }
  .confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div id="status" class="toast" role="status" aria-live="polite">
  <span class="toast-icon"></span>
  <span class="toast-text"></span>
  <button type="button" class="toast-close" aria-label="Dismiss">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
  </button>
</div>
<div class="toolbar">
  <div class="toolbar-left">
    <a id="all-projects-link" class="all-projects-link" href="/" data-route hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg><span id="all-projects-label">All projects</span>
    </a>
    <a id="self-project-link" class="all-projects-link self-project-link" href="/dispatch" data-route title="Dispatch's own page: its files, tasks, journal and history">
      <span>Dispatch</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6" /></svg>
    </a>
    <div id="stats" class="stats"></div>
    <button id="refresh-btn" class="refresh-btn" type="button" aria-label="Refresh" title="Refresh">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12a8 8 0 0 1 14.5-4.5" /><path d="M18 3v4.5h-4.5" />
        <path d="M20 12a8 8 0 0 1-14.5 4.5" /><path d="M6 21v-4.5h4.5" />
      </svg>
    </button>
  </div>
  <div id="toolbar-right" class="toolbar-right">
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>

        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="filter-slot"></div>
  </div>
</div>
<main id="dashboard-view" class="layout">
  <div id="categories" class="categories-col"></div>
  <aside class="raw-col">
    <div id="create-project"></div>
    <details open>
      <summary>
        <span class="raw-json-label">
          <svg class="details-chevron" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Raw JSON
        </span>
        <button id="copy-json-btn" class="refresh-btn copy-json-btn" type="button" title="Copy JSON" aria-label="Copy JSON">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
          </svg>
        </button>
      </summary>
      <pre id="raw" class="json-tree"></pre>
    </details>
  </aside>
</main>

<div id="project-view" class="project-view" hidden></div>

<div id="confirm-overlay" class="modal-overlay confirm-overlay" hidden>
  <div id="confirm-panel" class="modal-panel-inner confirm-panel" role="alertdialog" aria-modal="true"></div>
</div>

<div id="new-folders-overlay" class="modal-overlay" hidden>
  <div id="new-folders-panel"></div>
</div>

<script>
const CATEGORIES = ["fire", "breeze", "cold"];
const CATEGORY_LIMITS = { fire: 2, breeze: 4 }; // cold is unlimited
const CATEGORY_ICONS = { fire: "🔥", breeze: "🍃", cold: "❄️", unassigned: "📥" };
const BASE_PORT = 3001;
// mynaui:spinner — https://icon-sets.iconify.design/mynaui/spinner/ (MIT), with a
// self-contained rotate animation added since the source icon is static.

function iconForFileName(name) {
  const dot = name.lastIndexOf(".");
  const ext = dot >= 0 ? name.slice(dot + 1).toLowerCase() : "";
  for (const category in FILE_ICON_EXTENSIONS) {
    if (FILE_ICON_EXTENSIONS[category].includes(ext)) return FILE_ICON_BY_CATEGORY[category];
  }
  return ICON_FILE;
}

  if (

    openAssignDropdown === null &&

    openUnassignedCardMenu === null &&
    !createCategoryDropdownOpen &&
    !filterDropdownOpen &&
    openTagsDropdownFor === null &&

});

// Plain left clicks on in-app links (marked data-route: the cards, "All
// projects", ...) switch pages without a reload; Ctrl/Shift/middle
// clicks fall through to the browser, which opens the same address in a new
// tab or window the way any website link would.
document.addEventListener("click", (e) => {
  const link = e.target.closest("a[data-route]");
  if (!link || e.defaultPrevented || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  navigate(link.getAttribute("href"));
});

window.addEventListener("popstate", applyRoute);

// A portaled menu (a tags dropdown, see buildTagsDropdown) is position:
// fixed, so it doesn't follow its toggle when the page or a panel's list
// scrolls — reposition it in place instead. Captured, since scroll events
// don't bubble; scrolling the menu's own option list is left alone.
document.addEventListener(
  "scroll",
  (e) => {
    if (openTagsDropdownFor === null) return;
    if (e.target instanceof Element && e.target.closest(".portal-menu")) return;
    const menu = document.querySelector(".portal-menu");
    const toggle = findOpenTagsToggle();
    if (menu && toggle) positionPortalMenu(toggle, menu);
  },
  true
);

// Clicking outside a confirm/prompt dialog always cancels it (never
// confirms) — the safe default for what's usually a destructive action.
document.getElementById("confirm-overlay").addEventListener("click", (e) => {

});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && activeDialog !== null) {
    resolveDialog(false);
    return;
  }
  if (e.key === "Escape" && newFoldersModalOpen) {
    closeNewFoldersModal();
    return;
  }
  if (
    e.key === "Escape" &&
    (openCategoryDropdown !== null ||
      openAssignDropdown !== null ||
      openCardMenu !== null ||
      openUnassignedCardMenu !== null ||
      createCategoryDropdownOpen ||
      filterDropdownOpen ||
      openTagsDropdownFor !== null ||
      journalCalendarOpen ||
      taskCalendarOpen ||
      taskDueCalendarOpen ||
      portSwitchOpen)
  ) {
    openCategoryDropdown = null;
    openAssignDropdown = null;
    openCardMenu = null;
    openUnassignedCardMenu = null;
    createCategoryDropdownOpen = false;
    filterDropdownOpen = false;
    openTagsDropdownFor = null;
    closeJournalCalendar();
    closeTaskCalendar();
    taskDueCalendarOpen = false;
    portSwitchOpen = false;
    render();
    return;
  }
  // Escape on a project page heads back to the dashboard, and on a section's
  // page back to its project's — except while typing, where it belongs to
  // the field (clearing a search, abandoning a task edit) rather than to the
  // page, and while an edit is open, which it abandons first.
  if (e.key === "Escape" && currentProjectName !== null && !e.target.closest("input, textarea, select")) {
    if (editingKey) {
      editingKey = null;
      createForm = { category: null, port: null, name: "", description: "", url: "" };
      render();
    } else if (editingTaskId !== null && editingTaskProject !== null) {
      cancelTaskEdit(editingTaskProject);
      render();
    } else {
      navigate(currentProjectSection !== null ? projectPath(currentProjectName) : "/");
    }
  }
});

    setStatus("error", `Copy failed: ${err.message}`);
  }
});

const statusIconEl = statusEl.querySelector(".toast-icon");
const statusTextEl = statusEl.querySelector(".toast-text");
const statusCloseEl = statusEl.querySelector(".toast-close");
let statusHideTimer = null;

statusCloseEl.addEventListener("click", () => {
  clearTimeout(statusHideTimer);
  statusEl.classList.remove("show");
});

// setStatus() is only ever called for a real state change (an actual
// save in progress, completed, or failed) — a plain page load never calls
// it, so the toast has no "first load" case to special-case and can always
// play its entrance/exit animations.
function setStatus(kind, message) {
  clearTimeout(statusHideTimer);
  const icons = { saving: ICON_SPINNER, saved: ICON_CHECK, error: ICON_WARNING };
  const labels = { saving: "Saving…", saved: "All changes saved", error: message || "Save failed" };
  statusIconEl.innerHTML = icons[kind] || "";
  statusTextEl.textContent = labels[kind] || "";
  statusEl.className = "toast " + kind;
  requestAnimationFrame(() => statusEl.classList.add("show"));
  // Errors get much longer on screen than a "saved" confirmation — the
  // message is often the whole reason the save failed (e.g. a specific
  // validation error), not just a checkmark to glance at. The close
  // button covers dismissing it sooner.
  const hideAfter = { saved: 2200, error: 8000 }[kind];
  if (hideAfter) {
    statusHideTimer = setTimeout(() => statusEl.classList.remove("show"), hideAfter);
  }
}

// What the registry keeps of a project besides its port. Its live site
// (`url`) is only written when it has one.
function toRegistryEntry(e) {
  const out = { name: e.name, description: e.description };
  if (e.url) out.url = e.url;
  return out;
}

function toRegistry(list) {
  const out = { fire: {}, breeze: {}, cold: {}, unassigned: [] };
  for (const e of list) {
    out[e.category][e.port] = toRegistryEntry(e);
  }
  out.unassigned = unassigned.map(toRegistryEntry);
  return out;
}

function fromRegistry(data) {
  const list = [];
  for (const category of CATEGORIES) {
    const bucket = data[category] || {};
    for (const [port, entry] of Object.entries(bucket)) {
      list.push({ port, category, name: entry.name, description: entry.description, url: entry.url || "" });
    }
  }
  return list;
}

// --- Raw JSON panel: a collapsible, syntax-highlighted tree, built directly
// from the registry object rather than re-parsing JSON.stringify's text.
// collapsedJsonPaths mirrors collapsedSections' convention (only collapsed
// paths are tracked, so the tree defaults to fully expanded and survives
// re-renders — each toggle click just re-runs render()).
const JSON_TOGGLE_CHEVRON =
  '<svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">' +
  '<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function jsonSpan(text, cls) {
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = text;
  return span;
}

function jsonValueSpan(value) {
  if (value === null) return jsonSpan("null", "json-null");
  if (typeof value === "string") return jsonSpan(JSON.stringify(value), "json-string");
  if (typeof value === "number") return jsonSpan(String(value), "json-number");
  if (typeof value === "boolean") return jsonSpan(String(value), "json-boolean");
  return jsonSpan(String(value), "json-punct");
}

function jsonSpacer() {
  const span = document.createElement("span");
  span.className = "json-toggle-spacer";
  return span;
}

// One row: a fixed-width gutter cell (a toggle button or a same-width blank
// spacer) followed by a content cell indented for `depth`. Because the
// gutter is never itself indented, every arrow in the whole tree lines up
// in the same column regardless of how deeply its node is nested — only
// the content (key/brackets/value) shifts right with depth.
function buildJsonLine(gutterEl, depth, contentNodes) {
  const line = document.createElement("div");
  line.className = "json-line";
  line.appendChild(gutterEl);
  const content = document.createElement("span");
  content.className = "json-content";
  content.style.paddingLeft = `${depth * 18}px`;
  contentNodes.forEach((n) => content.appendChild(n));
  line.appendChild(content);
  return line;
}

// Builds one collapsible node (a container div holding one or more line
// divs) for `value` at `path`/`depth`. `key` is the property name to render
// before it (undefined for array items and the document root); `isLast`
// controls the trailing comma.
function buildJsonNode(value, key, path, isLast, depth) {
  const node = document.createElement("div");
  node.className = "json-node";
  const isContainer = value !== null && typeof value === "object";

  if (!isContainer) {
    const contentNodes = [];
    if (key !== undefined) {
      contentNodes.push(jsonSpan(`"${key}"`, "json-key"));
      contentNodes.push(jsonSpan(": ", "json-punct"));
    }
    contentNodes.push(jsonValueSpan(value));
    contentNodes.push(jsonSpan(isLast ? "" : ",", "json-punct"));
    node.appendChild(buildJsonLine(jsonSpacer(), depth, contentNodes));
    return node;
  }

  const isArray = Array.isArray(value);
  const entries = isArray ? value.map((v, i) => [i, v]) : Object.entries(value);
  const collapsed = collapsedJsonPaths.has(path);
  const closeBracket = (isArray ? "]" : "}") + (isLast ? "" : ",");

  const openContent = [];
  if (key !== undefined) {
    openContent.push(jsonSpan(`"${key}"`, "json-key"));
    openContent.push(jsonSpan(": ", "json-punct"));
  }
  openContent.push(jsonSpan(isArray ? "[" : "{", "json-punct"));

  let gutter;
  if (entries.length > 0) {
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "json-toggle" + (collapsed ? " collapsed" : "");
    toggle.setAttribute("aria-label", collapsed ? "Expand" : "Collapse");
    toggle.innerHTML = JSON_TOGGLE_CHEVRON;
    toggle.addEventListener("click", () => {
      if (collapsed) collapsedJsonPaths.delete(path);
      else collapsedJsonPaths.add(path);
      render();
    });
    gutter = toggle;
  } else {
    gutter = jsonSpacer();
  }

  if (entries.length === 0) {
    openContent.push(jsonSpan(closeBracket, "json-punct"));
    node.appendChild(buildJsonLine(gutter, depth, openContent));
    return node;
  }

  if (collapsed) {
    const noun = isArray ? "item" : "key";
    openContent.push(
      jsonSpan(`${entries.length} ${noun}${entries.length === 1 ? "" : "s"}`, "json-collapsed-summary")
    );
    openContent.push(jsonSpan(closeBracket, "json-punct"));
    node.appendChild(buildJsonLine(gutter, depth, openContent));
    return node;
  }

  node.appendChild(buildJsonLine(gutter, depth, openContent));

  const children = document.createElement("div");
  children.className = "json-children";
  entries.forEach(([k, v], idx) => {
    const childPath = path ? `${path}.${k}` : String(k);
    children.appendChild(buildJsonNode(v, isArray ? undefined : k, childPath, idx === entries.length - 1, depth + 1));
  });
  node.appendChild(children);

  node.appendChild(buildJsonLine(jsonSpacer(), depth, [jsonSpan(closeBracket, "json-punct")]));

  return node;
}

function renderRawJson(registry) {
  rawEl.innerHTML = "";
  rawEl.appendChild(buildJsonNode(registry, undefined, "", true, 0));
}

async function load() {
  const res = await fetch("/api/registry");
  const data = await res.json();
  entries = fromRegistry(data);
  unassigned = (data.unassigned || []).map((e) => ({ name: e.name, description: e.description || "", url: e.url || "" }));
  try {
    const runRes = await fetch("/api/running-projects");
    projectRunStatus = runRes.ok ? await runRes.json() : {};
  } catch {
    projectRunStatus = {};
  }
  registryLoaded = true;
  render();
  refreshPortLiveStatus();
  refreshNewFolders();
}

async function refreshNewFolders() {
  const folders = await fetchProjectFolders();
  const claimed = new Set([...entries.map((e) => e.name), ...unassigned.map((e) => e.name)]);
  newFolders = folders.filter((f) => !claimed.has(f) && !SUGGESTION_EXCLUDED_FOLDERS.has(f));
  newFoldersSelected = new Set(newFolders);
  newFoldersModalOpen = newFolders.length > 0;
  render();
}

function closeNewFoldersModal() {
  newFoldersModalOpen = false;
  render();
}

// Selected folders are simply dropped straight into "unassigned" — the
// existing bucket for tracked-but-not-yet-configured projects — rather than
// forcing a port/category pick per folder up front.
async function addSelectedNewFolders() {
  const names = newFolders.filter((n) => newFoldersSelected.has(n));
  if (names.length === 0) return;
  const panel = document.querySelector("#new-folders-panel .modal-panel-inner");
  panel.classList.add("busy");
  for (const name of names) unassigned.push({ name, description: "" });
  const ok = await persist();
  if (!ok) {
    unassigned.splice(unassigned.length - names.length, names.length);
    panel.classList.remove("busy");
    return;
  }
  newFolders = newFolders.filter((n) => !newFoldersSelected.has(n));
  newFoldersSelected.clear();
  newFoldersModalOpen = newFolders.length > 0;
  render();
}

async function deleteNewFolder(name) {
  const confirmed = await customPrompt(
    `This permanently deletes the "${name}" folder and everything in it. This can't be undone.`,
    name
  );
  if (!confirmed) return;
  const panel = document.querySelector("#new-folders-panel .modal-panel-inner");
  if (panel) panel.classList.add("busy");
  try {
    await deleteProjectFolder(name);
  } catch (err) {
    if (panel) panel.classList.remove("busy");
    setStatus("error", err.message);
    return;
  }
  newFolders = newFolders.filter((n) => n !== name);
  newFoldersSelected.delete(name);
  newFoldersModalOpen = newFolders.length > 0;
  render();
}

function buildNewFoldersPanel() {
  const panel = document.createElement("div");
  panel.className = "modal-panel-inner";

  const topRow = document.createElement("div");
  topRow.className = "modal-top-row";
  const heading = document.createElement("h2");
  heading.className = "modal-title";
  heading.textContent = "New folders found";
  const closeBtn = document.createElement("button");
  closeBtn.type = "button";
  closeBtn.className = "modal-close";
  closeBtn.setAttribute("aria-label", "Close");
  closeBtn.title = "Close";
  closeBtn.innerHTML = ICON_DELETE;
  closeBtn.addEventListener("click", closeNewFoldersModal);
  topRow.appendChild(heading);
  topRow.appendChild(closeBtn);
  panel.appendChild(topRow);

  const subtitle = document.createElement("p");
  subtitle.className = "new-folders-subtitle";
  subtitle.textContent = "These folders exist on disk but aren't tracked yet. Select which ones to add as unassigned projects, or delete a folder you don't need.";
  panel.appendChild(subtitle);

  const list = document.createElement("div");
  list.className = "new-folders-list";
  if (newFolders.length === 0) {
    const empty = document.createElement("div");
    empty.className = "new-folders-empty";
    empty.textContent = "Nothing left — all caught up.";
    list.appendChild(empty);
  }
  for (const name of newFolders) {
    const row = document.createElement("div");
    row.className = "new-folders-row";

    const label = document.createElement("label");
    label.className = "new-folders-row-label";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = newFoldersSelected.has(name);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) newFoldersSelected.add(name);
      else newFoldersSelected.delete(name);
      addBtn.disabled = newFoldersSelected.size === 0;
    });
    const nameSpan = document.createElement("span");
    nameSpan.className = "new-folders-row-name";
    nameSpan.textContent = name;
    label.appendChild(decorateCheckbox(checkbox));
    label.appendChild(nameSpan);
    row.appendChild(label);

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "new-folders-row-delete";
    deleteBtn.setAttribute("aria-label", `Delete ${name}`);
    deleteBtn.title = `Delete "${name}" folder`;
    deleteBtn.innerHTML = ICON_DELETE;
    deleteBtn.addEventListener("click", () => deleteNewFolder(name));
    row.appendChild(deleteBtn);

    list.appendChild(row);
  }
  panel.appendChild(list);

  const actions = document.createElement("div");
  actions.className = "add-form-actions";
  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "cancel-btn";
  cancelBtn.textContent = "Not now";
  cancelBtn.addEventListener("click", closeNewFoldersModal);
  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "create-btn";
  addBtn.textContent = "Add selected";
  addBtn.disabled = newFoldersSelected.size === 0;
  addBtn.addEventListener("click", addSelectedNewFolders);
  actions.appendChild(cancelBtn);
  actions.appendChild(addBtn);
  panel.appendChild(actions);

  return panel;
}

async function persist() {
  setStatus("saving");
  const registry = toRegistry(entries);
  renderRawJson(registry);
  try {
    const res = await fetch("/api/registry", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(registry),
    });
    const body = await res.json();
    if (!res.ok) {
      setStatus("error", body.error);
      return false;
    }
    setStatus("saved");
    return true;
  } catch (err) {
    setStatus("error", err.message);
    return false;
  }
}

function portConflict(candidatePort, selfIndex) {
  return entries.some((e, i) => i !== selfIndex && e.port === candidatePort);
}

}

function formatTimestamp(iso) {
  return new Date(iso).toLocaleString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
  });
}

// Registry state only tracks which port a project is *supposed* to use, not
// whether something is actually listening there right now.
async function fetchPortStatus(ports) {
  const unique = [...new Set(ports.filter((p) => p !== undefined && p !== null).map(String))];
  if (unique.length === 0) return {};
  try {
    const res = await fetch(`/api/port-status?ports=${unique.join(",")}`);
    if (!res.ok) return {};
    return await res.json();
  } catch {
    return {};
  }
}

// A project's title only links out to its localhost page while that port is
// actually live — no href at all otherwise, so it's inert, unstyled text.
function applyNameLinkState(link, live) {
  if (live) {
    link.href = `http://localhost:${link.dataset.port}`;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.title = `Open http://localhost:${link.dataset.port}`;
  } else {
    link.removeAttribute("href");
    link.removeAttribute("target");
    link.removeAttribute("rel");
    link.title = "";
  }
}

// Background liveness polling for the green dots and clickable titles on
// card names — patches existing elements directly instead of a full
// render() so it never disrupts in-progress typing, open dropdowns, or
// drag state.
async function refreshPortLiveStatus() {
  const ports = entries.map((e) => e.port);
  if (ports.length === 0) return;
  portLiveStatus = await fetchPortStatus(ports);
  renderStats();
  document.querySelectorAll(".live-dot[data-port]").forEach((dot) => {
    const live = !!portLiveStatus[dot.dataset.port];
    dot.classList.toggle("live", live);
    dot.title = live ? "Something is actively listening on this port" : "Nothing detected listening on this port";
  });
  document.querySelectorAll(".card-name-text[data-port]").forEach((link) => {
    applyNameLinkState(link, !!portLiveStatus[link.dataset.port]);
  });
  // Run buttons fall back to portLiveStatus for projects we didn't spawn
  // ourselves (see applyRunButtonState's "external" branch), so a change
  // here can flip them too.
  document.querySelectorAll(".run-btn[data-project]").forEach((btn) => {
    if (btn.dataset.busy) return;
    applyRunButtonState(btn, projectRunStatus[btn.dataset.project]);
  });
}

// Background polling for the Run/Stop button state — picks up crashes (e.g.
// nodemon exiting from a syntax error) that happen after the initial start
// request already returned. Patches existing buttons directly rather than a
// full render() so it doesn't disrupt in-progress typing or open dropdowns;
// skips a button that's mid-click so it doesn't clobber that click's own
// optimistic state.
async function refreshProjectRunStatus() {
  try {
    const res = await fetch("/api/running-projects");
    projectRunStatus = res.ok ? await res.json() : {};
  } catch {
    projectRunStatus = {};
  }
  document.querySelectorAll(".run-btn[data-project]").forEach((btn) => {
    if (btn.dataset.busy) return;
    applyRunButtonState(btn, projectRunStatus[btn.dataset.project]);
  });
}

async function openProjectFolder(name) {
  const res = await fetch(`/api/projects/${encodeURIComponent(name)}/open-explorer`, { method: "POST" });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || "Failed to open File Explorer");
  return body;
}

// Re-finds a card by project name after a render() has replaced the DOM out
// from under a stale element reference (e.g. an async action that started
// before a menu-close re-render finished).
function findCardByProjectName(name) {
  return document.querySelector(`.card[data-project="${CSS.escape(name)}"]`);
}

// Warns (with a cancelable confirm) if any of the given ports currently have
// something actually listening on them, since the registry change alone
// won't stop or move a running dev server off its old port.
async function confirmPortsFree(ports) {
  const status = await fetchPortStatus(ports);
  const live = [...new Set(ports.map(String))].filter((p) => status[p]);
  if (live.length === 0) return true;
  const noun = live.length > 1 ? "Ports" : "Port";
  const verb = live.length > 1 ? "have" : "has";
  return customConfirm(
    `${noun} ${live.join(", ")} ${verb} something actively listening right now (a running dev server?). ` +
      `Changing the registry won't stop or move it — you'll need to restart that project on its new port yourself. Continue anyway?`
  );
}

function categoryCount(category) {
  return entries.filter((e) => e.category === category).length;
}

// The ports nobody holds: every open slot of a capped category, plus each
// port of the unlimited one, between its start and its last taken port,
// that a project left behind — the same ports the Switch menu calls Free.
// Past that last port they never run out, so those aren't counted.
function countFreePorts(list) {
  let free = 0;
  for (const cat of CATEGORIES) {
    const range = categoryPortRange(cat);
    const taken = new Set(list.filter((e) => e.category === cat).map((e) => Number(e.port)));
    const last = range.end !== Infinity ? range.end : Math.max(range.start - 1, ...taken);
    for (let port = range.start; port <= last; port++) if (!taken.has(port)) free++;
  }
  return free;
}

function capitalize(text) {
  return text.charAt(0).toUpperCase() + text.slice(1);
}

// "Open ports in Fire and Breeze, plus unused ones between Cold's projects".
const FREE_PORTS_HINT = (() => {
  const capped = CATEGORIES.filter((c) => CATEGORY_LIMITS[c] !== undefined).map(capitalize);
  const unlimited = CATEGORIES.filter((c) => CATEGORY_LIMITS[c] === undefined).map(capitalize);
  return `Open ports in ${capped.join(" and ")}` + (unlimited.length ? `, plus unused ones between ${unlimited.join(" and ")}'s projects` : "");
})();

function renderStatsText(activePorts, freePorts, totalProjects) {
  const plural = (n) => (n === 1 ? "" : "s");
  statsEl.innerHTML =
    `<strong>${activePorts}</strong> active port${plural(activePorts)}` +
    ` <span class="stats-sep">·</span> <span title="${FREE_PORTS_HINT}"><strong>${freePorts}</strong> free port${plural(freePorts)}</span>` +
    ` <span class="stats-sep">·</span> <strong>${totalProjects}</strong> total project${plural(totalProjects)}`;
}

// Header stats always reflect the full registry, independent of the filter
// dropdown's current selection — the filter narrows what's shown below, not
// what's counted here. Uses this tab's in-memory state, so it's accurate
// immediately after a local edit, before the next refreshStats() poll lands.
function renderStats() {
  const activePorts = entries.filter((e) => portLiveStatus[String(e.port)]).length;
  const totalProjects = entries.length + unassigned.length;
  renderStatsText(activePorts, countFreePorts(entries), totalProjects);
}

// Polls the registry independently of the main entries/unassigned state so
// the header stays live across tabs (or direct registry edits) without ever
// triggering a full render() — which would cost focus/cursor position in an
// open form, an in-progress drag, or an open dropdown elsewhere on the page.
async function refreshStats() {
  try {
    const res = await fetch("/api/registry");
    if (!res.ok) return;
    const data = await res.json();
    const freshEntries = fromRegistry(data);
    const freshUnassignedCount = (data.unassigned || []).length;
    const liveStatus = await fetchPortStatus(freshEntries.map((e) => e.port));
    const activePorts = freshEntries.filter((e) => liveStatus[String(e.port)]).length;
    renderStatsText(activePorts, countFreePorts(freshEntries), freshEntries.length + freshUnassignedCount);
  } catch {
    // Leave the last-known stats in place — a transient fetch failure
    // shouldn't blank out or otherwise disrupt the header.
  }
}

function isCategoryFull(category) {
  const limit = CATEGORY_LIMITS[category];
  return limit !== undefined && categoryCount(category) >= limit;
}

// Same as isCategoryFull, but doesn't count the entry currently being
// edited against its own category's limit.
function isCategoryFullExcluding(category, excludePort) {
  const limit = CATEGORY_LIMITS[category];
  if (limit === undefined) return false;
  const count = entries.filter((e) => e.category === category && e.port !== excludePort).length;
  return count >= limit;
}

// Ports belong to their category, not to a project: each category owns a
// contiguous block sized to its limit, in CATEGORIES order. Cold is last and
// unlimited, so its block just keeps growing.
function categoryPortRange(category) {
  let start = BASE_PORT;
  for (const cat of CATEGORIES) {
    const limit = CATEGORY_LIMITS[cat];
    const end = limit !== undefined ? start + limit - 1 : Infinity;
    if (cat === category) return { start, end };
    start = end + 1;
  }
}

function formatPortRange(range) {
  return `${range.start}–${range.end === Infinity ? "∞" : range.end}`;
}

// A port's category is whichever category's block it falls in, so a project's
// category always follows its port.
function categoryForPort(port) {
  return CATEGORIES.find((cat) => {
    const range = categoryPortRange(cat);
    return port >= range.start && port <= range.end;
  });
}

// Which projects have to slide over when a project (`moving`, or null when
// it's coming from unassigned) is dropped onto `targetPort`. The dragged
// project takes that port; whoever holds it and the projects lined up
// directly behind it each move one port along, until an open port (the
// dragged project's vacated one counts) absorbs the last of them. Moving down
// within its own category is the one exception: it closes up the gap it left,
// so the projects in between move back toward it instead. A project pushed
// over a category boundary changes category along with its port. Returns
// { entry, port } for each project that moves — not the dragged one.
function planPortShifts(moving, targetPort) {
  const occupied = new Map();
  for (const e of entries) if (e !== moving) occupied.set(Number(e.port), e);
  const closingGap = moving && Number(moving.port) < targetPort && moving.category === categoryForPort(targetPort);
  const step = closingGap ? -1 : 1;
  const shifts = [];
  for (let p = targetPort; occupied.has(p); p += step) {
    shifts.push({ entry: occupied.get(p), port: p + step });
  }
  return shifts;
}

function nextFreePortInCategory(category, selfIndex) {
  const range = categoryPortRange(category);
  let candidate = range.start;
  while (candidate <= range.end && portConflict(String(candidate), selfIndex)) {
    candidate++;
  }
  return candidate <= range.end ? String(candidate) : null;
}

function buildCollapseButton(key) {
  const collapsed = collapsedSections.has(key);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "collapse-btn";
  btn.setAttribute("aria-label", collapsed ? "Expand" : "Collapse");
  btn.title = collapsed ? "Expand" : "Collapse";
  btn.innerHTML =
    `<svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">` +
    `<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  btn.addEventListener("click", () => {
    if (collapsed) collapsedSections.delete(key);
    else collapsedSections.add(key);
    render();
  });
  return btn;
}

// Collapsing never fully hides a section — the first grid row (however many
// cards actually fit on it at the current width) always stays visible.
function collapseGridToFirstRow(grid) {
  const items = [...grid.children];
  if (items.length === 0) return;
  const firstTop = items[0].offsetTop;
  for (const el of items) {
    if (el.offsetTop !== firstTop) el.classList.add("row-hidden");
  }
}

function gridHasMultipleRows(grid) {
  const items = [...grid.children];
  if (items.length === 0) return false;
  const firstTop = items[0].offsetTop;
  return items.some((el) => el.offsetTop !== firstTop);
}

// Call once a section's grid is actually laid out in the document: disables
// the collapse toggle when there's nothing to collapse (everything already
// fits on one row), and applies the collapse otherwise.
function finalizeSectionCollapse(section, grid, collapseBtn, key) {
  if (!gridHasMultipleRows(grid)) {
    collapseBtn.disabled = true;
    collapseBtn.title = "Nothing to collapse";
    collapsedSections.delete(key);
    section.classList.remove("collapsed");
    return;
  }
  if (collapsedSections.has(key)) collapseGridToFirstRow(grid);
}

// Whether an entry survives the "Active ports only" toggle in the filter
// dropdown — unaffected by which category checkboxes are on.
function passesActiveFilter(entry) {
  return !filterActiveOnly || !!portLiveStatus[String(entry.port)];
}

function passesSearchFilter(entry) {
  if (!searchQuery) return true;
  return (
    entry.name.toLowerCase().includes(searchQuery) ||
    (entry.description || "").toLowerCase().includes(searchQuery)
  );
}

function render() {
  // Portaled dropdown menus (see buildTagsDropdown) live on <body>, outside
  // whatever gets torn down/rebuilt below — clear any leftover one here so
  // a still-open dropdown can create a fresh one, and a closed one doesn't
  // linger.
  document.querySelectorAll(".portal-menu").forEach((el) => el.remove());
  entries.sort((a, b) => Number(a.port) - Number(b.port));
  renderRawJson(toRegistry(entries));
  renderStats();

  const onProjectPage = currentProjectName !== null;
  dashboardViewEl.hidden = onProjectPage;
  projectViewEl.hidden = !onProjectPage;
  toolbarRightEl.hidden = onProjectPage; // search + filter only apply to the dashboard's cards
  allProjectsLinkEl.hidden = !onProjectPage;
  selfProjectLinkEl.hidden = onProjectPage;
  // A section's page leads back to its project's page rather than all the
  // way out to the dashboard.
  const section = onProjectPage ? findProjectSection(currentProjectSection) : null;
  allProjectsLinkEl.href = section ? projectPath(currentProjectName) : "/";
  allProjectsLabelEl.textContent = section ? currentProjectName : "All projects";
  allProjectsLinkEl.title = section ? `Back to ${currentProjectName}` : "";
  document.title = !onProjectPage
    ? DEFAULT_TITLE
    : section
    ? `${section.title} · ${currentProjectName} — ${DEFAULT_TITLE}`
    : `${currentProjectName} — ${DEFAULT_TITLE}`;
  if (onProjectPage) renderProjectPage();
  else renderDashboard();

  const newFoldersOverlay = document.getElementById("new-folders-overlay");
  const newFoldersPanel = document.getElementById("new-folders-panel");
  if (newFoldersModalOpen) {
    newFoldersOverlay.hidden = false;
    newFoldersPanel.innerHTML = "";
    newFoldersPanel.appendChild(buildNewFoldersPanel());
  } else {
    newFoldersOverlay.hidden = true;
  }

  updateBodyScrollLock();
  positionOpenDropdowns();
}

function renderDashboard() {
  projectViewEl.innerHTML = "";
  delete projectViewEl.dataset.project;
  rootEl.innerHTML = "";

  for (const category of CATEGORIES) {
    if (!filterCategories.has(category)) continue;

    const cardsInCategory = entries
      .map((e, i) => [e, i])
      .filter(([e]) => e.category === category && passesActiveFilter(e) && passesSearchFilter(e));
    // A search hides categories it has no matches in.
    if (searchQuery && cardsInCategory.length === 0) continue;

    const collapsed = collapsedSections.has(category);
    const section = document.createElement("div");
    section.className = "category" + (collapsed ? " collapsed" : "");
    section.dataset.cat = category;

    const limit = CATEGORY_LIMITS[category];
    const count = categoryCount(category);
    const header = document.createElement("div");
    header.className = "category-header";
    const title = document.createElement("span");
    title.innerHTML = `${CATEGORY_ICONS[category]} ${category} <span class="category-count">(${count}${limit !== undefined ? "/" + limit : ""})</span>`;
    header.appendChild(title);
    const collapseBtn = buildCollapseButton(category);
    header.appendChild(collapseBtn);
    section.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "card-grid";

    {
      const usedPortNums = cardsInCategory.map(([e]) => Number(e.port));
      const usedPorts = new Set(usedPortNums);
      const range = categoryPortRange(category);
      // Capped categories show every reserved slot up to the limit; the
      // uncapped one (cold) shows gaps below its current highest port plus
      // one trailing slot past it — ghost slots are the only drop targets, so
      // without that trailing one a gap-free cold has nowhere to drop a card.
      const upperBound =
        limit !== undefined ? range.end : usedPortNums.length ? Math.max(...usedPortNums) + 1 : range.start;

      const slots = cardsInCategory.map(([entry, index]) => ({
        port: Number(entry.port),
        node: buildCard(entry, index),
      }));
      // Ghost ("available") slots represent nothing running, so they don't
      // belong in an active-ports-only or search-filtered view.
      if (!filterActiveOnly && !searchQuery) {
        for (let p = range.start; p <= upperBound; p++) {
          if (!usedPorts.has(p)) {
            slots.push({ port: p, node: buildGhostCard(p) });
          }
        }
      }
      slots.sort((a, b) => a.port - b.port);
      if (slots.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = filterActiveOnly ? "No active projects in this category" : "No projects in this category";
        grid.appendChild(empty);
      } else {
        for (const slot of slots) {
          grid.appendChild(slot.node);
        }
      }
    }

    section.appendChild(grid);
    rootEl.appendChild(section);
    finalizeSectionCollapse(section, grid, collapseBtn, category);
  }

  // Unassigned projects have no port, so they never match "Active ports only".
  const visibleUnassigned = unassigned
    .map((e, i) => [e, i])
    .filter(([e]) => passesSearchFilter(e));
  if (filterCategories.has("unassigned") && !filterActiveOnly && !(searchQuery && visibleUnassigned.length === 0)) {
    const collapsed = collapsedSections.has("unassigned");
    const section = document.createElement("div");
    section.className = "category" + (collapsed ? " collapsed" : "");
    section.dataset.cat = "unassigned";

    const header = document.createElement("div");
    header.className = "category-header";
    const title = document.createElement("span");
    title.innerHTML = `📥 Unassigned <span class="category-count">(${unassigned.length})</span>`;
    header.appendChild(title);
    const collapseBtn = buildCollapseButton("unassigned");
    header.appendChild(collapseBtn);
    section.appendChild(header);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    if (visibleUnassigned.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No unassigned projects";
      grid.appendChild(empty);
    } else {
      visibleUnassigned.forEach(([entry, index]) => {
        grid.appendChild(buildUnassignedCard(entry, index));
      });
    }

    section.appendChild(grid);
    rootEl.appendChild(section);
    finalizeSectionCollapse(section, grid, collapseBtn, "unassigned");
  }

  if (searchQuery && rootEl.children.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "No projects match your search";
    rootEl.appendChild(empty);
  }

  const createSlot = document.getElementById("create-project");
  createSlot.innerHTML = "";
  createSlot.appendChild(buildCreateProjectForm());

  const filterSlot = document.getElementById("filter-slot");
  filterSlot.innerHTML = "";
  filterSlot.appendChild(buildFilterDropdown());
}

// Every dropdown menu is built the same way regardless of which one it is
// (category switcher, kebab menu, filter, assign, ...): absolutely
// positioned below its toggle, anchored left. That default can crop against
// the viewport for a card near the bottom or right edge — a card in the
// last grid row, or one opened from inside a dialog. Rather than teach each
// build function about its own position, this
// runs once after every render() and flips whichever open menus actually
// don't fit, based on their real measured size.
function positionOpenDropdowns() {
  // Portaled menus (see buildTagsDropdown) position themselves via
  // positionPortalMenu instead — .parentElement here would be <body>, not
  // a meaningful anchor to measure against.
  document.querySelectorAll(".dropdown-menu:not(.portal-menu)").forEach((menu) => {
    menu.classList.remove("drop-up", "align-right");
    menu.style.maxHeight = "";
    menu.style.overflowY = "";
    const wrap = menu.parentElement;
    if (!wrap) return;
    const wrapRect = wrap.getBoundingClientRect();
    const menuRect = menu.getBoundingClientRect();

    const place = placeDropdown(wrapRect, menuRect, dropdownBounds(wrap));
    if (place.above) menu.classList.add("drop-up");
    if (place.alignRight) menu.classList.add("align-right");
    if (place.maxHeight !== null) {
      menu.style.maxHeight = `${place.maxHeight}px`;
      menu.style.overflowY = "auto";
    }
  });
}

// The gap between a menu and its toggle (matches .dropdown-menu's
// `top: calc(100% + 4px)`), and how far a menu keeps from the edge of
// whatever box it has to stay inside.
const DROPDOWN_GAP = 4;
const DROPDOWN_EDGE_INSET = 8;
// Below this, a height-capped menu would be a sliver too small to use —
// better to let it poke out of its popup than shrink it further.
const DROPDOWN_MIN_HEIGHT = 120;

// The box an open menu has to stay inside: the dialog it was opened from
// (new folders, confirm, ...) when there is one, clipped to the viewport
// either way. A menu inside a popup that only checked the viewport could
// hang past the popup's bottom edge (or, for a nested menu, stretch the
// popup's own scroll area) even with plenty of room left on screen.
// A menu opened inside a project panel (the Journal calendar, the Tasks
// tags menus) keeps within the panel's sides too, so it never hangs out over
// the page beside it — but not its top and bottom, which would squeeze a
// tall menu into a scrolling box in a short panel.
function dropdownBounds(anchorEl) {
  const bounds = {
    top: DROPDOWN_EDGE_INSET,
    left: DROPDOWN_EDGE_INSET,
    bottom: window.innerHeight - DROPDOWN_EDGE_INSET,
    right: window.innerWidth - DROPDOWN_EDGE_INSET,
  };
  const popup = anchorEl.closest(".modal-panel-inner");
  if (popup) {
    const r = popup.getBoundingClientRect();
    bounds.top = Math.max(bounds.top, r.top + DROPDOWN_EDGE_INSET);
    bounds.left = Math.max(bounds.left, r.left + DROPDOWN_EDGE_INSET);
    bounds.bottom = Math.min(bounds.bottom, r.bottom - DROPDOWN_EDGE_INSET);
    bounds.right = Math.min(bounds.right, r.right - DROPDOWN_EDGE_INSET);
  }
  const panel = anchorEl.closest(".project-panel");
  if (panel) {
    const r = panel.getBoundingClientRect();
    bounds.left = Math.max(bounds.left, r.left + DROPDOWN_EDGE_INSET);
    bounds.right = Math.min(bounds.right, r.right - DROPDOWN_EDGE_INSET);
  }
  return bounds;
}

// Shared placement decision for both nested and portaled menus: below the
// toggle if it fits, otherwise above if that fits, otherwise whichever side
// has more room with the menu's height capped to it (so it scrolls
// internally instead of spilling out). Horizontally it stays left-aligned
// with the toggle unless that would cross the right edge.
function placeDropdown(anchorRect, menuRect, bounds) {
  const spaceBelow = bounds.bottom - anchorRect.bottom - DROPDOWN_GAP;
  const spaceAbove = anchorRect.top - bounds.top - DROPDOWN_GAP;
  let above = false;
  let maxHeight = null;
  if (menuRect.height > spaceBelow) {
    if (menuRect.height <= spaceAbove) {
      above = true;
    } else {
      above = spaceAbove > spaceBelow;
      maxHeight = Math.max(DROPDOWN_MIN_HEIGHT, Math.floor(above ? spaceAbove : spaceBelow));
    }
  }
  const alignRight = anchorRect.left + menuRect.width > bounds.right;
  return { above, alignRight, maxHeight };
}

function buildGhostCard(port) {
  const div = document.createElement("div");
  div.className = "ghost-card";
  div.innerHTML = `<span class="ghost-port">${port}</span><span class="ghost-label">available</span>`;

  div.addEventListener("dragover", (e) => {
    if (!dragSource) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    div.classList.add("drop-target");
  });
  div.addEventListener("dragleave", () => {
    div.classList.remove("drop-target");
  });
  div.addEventListener("drop", (e) => {
    e.preventDefault();
    div.classList.remove("drop-target");
    handlePortDrop(port, div);
  });

  return div;
}

// Moves whatever card is being dragged onto `port` — either an open slot, or
// the port of another project, in which case planPortShifts() slides that
// project (and the ones lined up behind it) over to make room. Same
// underlying move as a category switch or manual port edit, just aimed at an
// exact destination instead of "next free".
async function handlePortDrop(port, targetEl) {
  const source = dragSource;
  dragSource = null;
  if (!source) return;

  const moving = source.list === "entries" ? entries[source.index] : null;
  const incoming = source.list === "unassigned" ? unassigned[source.index] : null;
  if (!moving && !incoming) return;
  if (moving && Number(moving.port) === port) return; // dropped back onto its own port

  const shifts = planPortShifts(moving, port);
  const moves = moving ? [{ entry: moving, port }, ...shifts] : shifts;
  const touchedPorts = [port, ...moves.map((m) => m.entry.port), ...moves.map((m) => m.port)];
  if (!(await confirmPortsFree(touchedPorts))) return;

  // Remember where everything was so a failed save can put it all back.
  const previous = moves.map(({ entry }) => ({ entry, port: entry.port, category: entry.category }));
  let added = null;
  if (incoming) {
    unassigned.splice(source.index, 1);
    added = {
      port: String(port),
      category: categoryForPort(port),
      name: incoming.name,
      description: incoming.description,
      url: incoming.url,
    };
    entries.push(added);
  }
  for (const { entry, port: newPort } of moves) {
    entry.port = String(newPort);
    entry.category = categoryForPort(newPort);
  }

  markCardSaving(targetEl);
  const ok = await persist();
  if (!ok) {
    for (const { entry, port: oldPort, category } of previous) {
      entry.port = oldPort;
      entry.category = category;
    }
    if (added) {
      entries.splice(entries.indexOf(added), 1);
      unassigned.splice(source.index, 0, incoming);
    }
  }
  render();
}

async function unassignEntry(entry, index, cardEl) {
  const status = await fetchPortStatus([entry.port]);
  const liveWarning = status[String(entry.port)]
    ? ` Port ${entry.port} currently has something actively listening on it (a running dev server?) — ejecting it here won't stop that.`
    : "";
  const confirmed = await customConfirm(
    `Eject "${entry.name}" from port ${entry.port}? The project moves to Unassigned and the port becomes available again.${liveWarning}`
  );
  if (!confirmed) return;

  openCategoryDropdown = null;
  const removed = entries.splice(index, 1)[0];
  unassigned.push({ name: removed.name, description: removed.description, url: removed.url });
  markCardSaving(cardEl);
  const ok = await persist();
  if (!ok) {
    unassigned.pop();
    entries.splice(index, 0, removed);
  }
  render();
}

// Permanently deletes a project: removes it from the registry, then deletes
// its folder from disk. Requires typing the project's exact name to guard
// against a stray click, since — unlike Eject — this can't be undone
// from the UI once the folder is gone.
async function deleteProject(entry, source, index, cardEl) {
  if (source === "entries" && ["starting", "running"].includes((projectRunStatus[entry.name] || {}).status)) {
    if (cardEl) showCardError(cardEl, "Stop the project before deleting it");
    return;
  }

  const confirmed = await customPrompt(
    `This permanently deletes the "${entry.name}" folder and everything in it. This can't be undone.`,
    entry.name
  );
  if (!confirmed) return;

  const list = source === "entries" ? entries : unassigned;
  const removed = list.splice(index, 1)[0];
  markCardSaving(cardEl);
  const ok = await persist();
  if (!ok) {
    list.splice(index, 0, removed);
    render();
    return;
  }

  try {
    await deleteProjectFolder(entry.name);
  } catch (err) {
    setStatus("error", `Removed "${entry.name}" from the dashboard, but couldn't delete its folder: ${err.message}`);
  }
  render();
}

function startEditEntry(entry, source) {
  editingKey =
    source === "entries" ? { list: "entries", port: entry.port } : { list: "unassigned", name: entry.name };
  createForm = {
    category: source === "entries" ? entry.category : null,
    port: source === "entries" ? entry.port : null,
    name: entry.name,
    description: entry.description || "",
    url: entry.url || "",
  };

// Reflects a project's current run state onto its Run/Stop button: idle
// ("Run"), starting (spinner, disabled), running ("Stop", flagging a
// tailwind-watcher-only failure via .warn), or crashed (back to "Run" but
// marked so the last failure reason is visible on hover). "Running" covers
// both a process we spawned ourselves and one we didn't (e.g. started from a
// VS Code terminal) but that the live-status poll confirms is actually
// listening on the port — either way Stop is offered; for the latter, the
// server falls back to killing whatever OS process holds that port.
function applyRunButtonState(btn, info) {
  const status = info && info.status;
  const liveFallback = !status && !!portLiveStatus[btn.dataset.port];
  btn.classList.remove("running", "crashed", "starting", "warn");
  btn.disabled = false;

  if (status === "starting") {
    btn.classList.add("starting");
    btn.disabled = true;
    btn.innerHTML = `${ICON_SPINNER} <span class="btn-label">Starting…</span>`;
    btn.title = "Starting…";
    return;
  }

  if (status === "running" || liveFallback) {
    btn.classList.add("running");
    if (info && info.twError) {
      btn.classList.add("warn");
      btn.title = `Running — tailwind watcher failed: ${info.twError}`;
    } else if (liveFallback) {
      btn.title = `Stop ${btn.dataset.project} — started outside this dashboard, so this only frees the port; a lingering npm/nodemon shell may remain`;
    } else {
      btn.title = `Stop ${btn.dataset.project}`;
    }
    btn.innerHTML = `${ICON_STOP_SOLID} <span class="btn-label">Stop</span>`;
    return;
  }

  if (status === "crashed") {
    btn.classList.add("crashed");
    btn.innerHTML = `${ICON_WARNING} <span class="btn-label">Run</span>`;
    btn.title = `Last attempt failed: ${info.error || "unknown error"} — click to retry`;
    return;
  }

  btn.innerHTML = `${ICON_PLAY_SOLID} <span class="btn-label">Run</span>`;
  btn.title = `Run ${btn.dataset.project} (npm run dev, plus tw if present)`;
}

// Starts/stops a project's dev (and tw, if present) processes on the port
// it's currently assigned to. Warns first if that port already looks live —
// starting anyway would likely fail to bind.
function buildRunButton(entry) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "run-btn";
  btn.dataset.project = entry.name;
  btn.dataset.port = entry.port;
  applyRunButtonState(btn, projectRunStatus[entry.name]);

  btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    const managed = projectRunStatus[entry.name];
    const isRunning = (managed && managed.status === "running") || (!managed && !!portLiveStatus[String(entry.port)]);
    const card = btn.closest(".card") || btn.closest(".project-header");

    if (!isRunning) {
      const status = await fetchPortStatus([entry.port]);
      if (status[String(entry.port)]) {
        const proceed = await customConfirm(
          `Port ${entry.port} already has something listening on it (maybe started outside this dashboard). ` +
            `Starting "${entry.name}" now may fail to bind. Continue anyway?`
        );
        if (!proceed) return;
      }
    }

    // A separate flag from `disabled` — "external" state also sets disabled
    // persistently, so polling can't use that alone to tell "mid-click" from
    // "locked because it's running elsewhere."
    btn.dataset.busy = "1";
    btn.disabled = true;
    btn.innerHTML = ICON_SPINNER;
    clearCardError(card);
    try {
      if (isRunning) {
        await stopProject(entry.name);
        delete projectRunStatus[entry.name];
        portLiveStatus[String(entry.port)] = false; // optimistic; next poll corrects if the kill didn't take
      } else {
        await startProject(entry.name);
        projectRunStatus[entry.name] = { status: "running", error: null, twError: null };
      }
    } catch (err) {
      if (!isRunning) {
        projectRunStatus[entry.name] = { status: "crashed", error: err.message, twError: null };
      }
      showCardError(card, err.message);
    } finally {
      delete btn.dataset.busy;
      applyRunButtonState(btn, projectRunStatus[entry.name]);
    }
  });

  return btn;
}

// Multi-select filter for the toolbar: an "active ports only" toggle plus a
// checkbox per section (fire/breeze/cold/unassigned). Unlike the other
// dropdowns here, picking an option doesn't close the menu — it stays open
// so multiple filters can be toggled in one go.
const FILTER_SECTIONS = [...CATEGORIES, "unassigned"];

// The one look every checkbox in the app shares — the Filter and Tags menus'
// options draw it directly, real checkboxes get it through decorateCheckbox.
function checkboxIcon(checked) {
  return checked ? ICON_CHECKBOX_CHECKED : ICON_CHECKBOX;
}

// Draws a real checkbox with checkboxIcon() instead of the browser's own box.
// The input itself stays, invisible but laid over the icon, so clicks, Space,
// change events and `disabled` all behave exactly as before; the icon is
// redrawn whenever it changes.
function decorateCheckbox(input) {
  const wrap = document.createElement("span");
  wrap.className = "icon-checkbox";
  const box = document.createElement("span");
  box.className = "icon-checkbox-box";
  box.innerHTML = checkboxIcon(input.checked);
  input.classList.add("icon-checkbox-input");
  input.addEventListener("change", () => {
    box.innerHTML = checkboxIcon(input.checked);
  });
  wrap.append(input, box);
  return wrap;
}

const MAX_PORT = 65535;
// What fits in 3 lines of the project header's description at a 1920px
// window, where its column is 480px wide.
const PROJECT_DESCRIPTION_MAX_LENGTH = 230;

// The add/edit form's port field. Digits only, and every way of changing it
// (typing, arrow keys, the step buttons) stays inside `range`: a typed value
// outside it is pulled back to the nearest edge when the field is committed
// (blur/Enter), and a cleared field gets its last good value back.
function buildPortStepper(range, value, onChange) {
  const min = range.start;
  const max = Math.min(range.end, MAX_PORT);
  let committed = value;

  const wrap = document.createElement("div");
  wrap.className = "port-stepper";

  const input = document.createElement("input");
  input.type = "text";
  input.inputMode = "numeric";
  input.placeholder = "port";
  input.value = value;

  const upBtn = buildStepButton("Next port", "M1 5l4-4 4 4", 1);
  const downBtn = buildStepButton("Previous port", "M1 1l4 4 4-4", -1);
  const btns = document.createElement("div");
  btns.className = "port-step-btns";
  btns.append(upBtn, downBtn);
  wrap.append(input, btns);

  function buildStepButton(label, path, delta) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "port-step";
    btn.setAttribute("aria-label", label);
    btn.innerHTML =
      `<svg viewBox="0 0 10 6" width="9" height="6" aria-hidden="true">` +
      `<path d="${path}" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    btn.addEventListener("mousedown", (e) => e.preventDefault()); // keep focus in the field
    btn.addEventListener("click", () => step(delta));
    return btn;
  }

  function syncButtons() {
    const n = Number(input.value);
    downBtn.disabled = input.value !== "" && n <= min;
    upBtn.disabled = input.value !== "" && n >= max;
  }

  function commit(n) {
    committed = String(Math.min(Math.max(n, min), max));
    input.value = committed;
    syncButtons();
    onChange(committed);
  }

  function step(delta) {
    commit(input.value ? Number(input.value) + delta : min);
  }

  input.addEventListener("input", () => {
    const digits = input.value.replace(/\D/g, "");
    if (digits !== input.value) input.value = digits;
    syncButtons();
    onChange(input.value);
  });
  input.addEventListener("change", () => {
    if (input.value) {
      commit(Number(input.value));
    } else {
      input.value = committed;
      syncButtons();
      onChange(committed);
    }
  });
  input.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();
    step(e.key === "ArrowUp" ? 1 : -1);
  });

  syncButtons();
  return { el: wrap, input };
}

function buildCreateProjectForm() {
  let editingEntry = null;
  let editingSource = null;
  if (editingKey) {
    editingSource = editingKey.list;
    editingEntry =
      editingKey.list === "entries"
        ? entries.find((e) => e.port === editingKey.port)
        : unassigned.find((e) => e.name === editingKey.name);
    if (!editingEntry) {
      // The entry being edited vanished from under us (unassigned/assigned/
      // removed elsewhere) — fall back to a normal create form.
      editingKey = null;
      editingSource = null;
    }
  }
  const excludePort = editingSource === "entries" ? editingKey.port : null;

  if (createForm.category === null) {
    createForm.category = CATEGORIES.find((cat) => !isCategoryFull(cat)) || CATEGORIES[0];
  }
  if (createForm.port === null) {
    createForm.port = nextFreePortInCategory(createForm.category, -1) || "";
  }

  const form = document.createElement("div");
  form.className = "add-form-card";

  const heading = document.createElement("div");
  heading.className = "create-form-heading";
  heading.textContent = editingEntry ? `Edit ${editingEntry.name}` : "Add project";
  form.appendChild(heading);

  if (!editingEntry) {
    const subtitle = document.createElement("button");
    subtitle.type = "button";
    subtitle.className = "create-form-subtitle";
    subtitle.textContent = "loading projects folder…";
    subtitle.disabled = true;
    fetchProjectsRoot().then((rootPath) => {
      if (!rootPath) {
        subtitle.remove();
        return;
      }
      subtitle.textContent = rootPath;
      subtitle.title = "Open in File Explorer";
      subtitle.disabled = false;
    });
    subtitle.addEventListener("click", async () => {
      try {
        await openProjectsRoot();
      } catch (err) {
        fail(err.message);
      }
    });
    form.appendChild(subtitle);
  }

  const categoryDropdown = buildCreateCategoryDropdown(!editingEntry);

  const isUnassignedTarget = createForm.category === "unassigned";

  // Unassigned has no port range; the field is hidden then, so any range does.
  const portRange = isUnassignedTarget ? { start: 1, end: MAX_PORT } : categoryPortRange(createForm.category);
  const { el: portStepper, input: portInput } = buildPortStepper(portRange, createForm.port, (value) => {
    createForm.port = value;
    updateSubmitState();
  });
  portStepper.hidden = isUnassignedTarget;
  if (!isUnassignedTarget) {
    portStepper.title = `${createForm.category}'s port range: ${formatPortRange(portRange)}`;
  }

  const nameInput = document.createElement("input");
  nameInput.placeholder = "folder name";
  nameInput.value = createForm.name;

  const folderListPromise = editingEntry ? Promise.resolve([]) : fetchProjectFolders();
  const datalist = document.createElement("datalist");
  datalist.id = "project-folder-options";

  if (editingEntry) {
    nameInput.disabled = true;
    nameInput.title = "Name can't be changed here — it must match the project's folder name";
  } else {
    nameInput.setAttribute("list", "project-folder-options");
    nameInput.addEventListener("input", () => {
      createForm.name = nameInput.value;
      updateSubmitState();
    });
    const claimedNames = new Set([...entries.map((e) => e.name), ...unassigned.map((e) => e.name)]);
    folderListPromise.then((folders) => {
      for (const folder of folders) {
        if (claimedNames.has(folder) || SUGGESTION_EXCLUDED_FOLDERS.has(folder)) continue;
        const opt = document.createElement("option");
        opt.value = folder;
        datalist.appendChild(opt);
      }
    });
  }

  // The project's live site, linked from its page header (see
  // buildLiveSiteLink). Plain text rather than type="url", so a bare
  // "example.com" isn't flagged as invalid — normalizeSiteUrl adds https://.
  const urlInput = document.createElement("input");
  urlInput.inputMode = "url";
  urlInput.placeholder = "live site URL (optional)";
  urlInput.value = createForm.url;
  urlInput.addEventListener("input", () => {
    createForm.url = urlInput.value;
  });

  const descInput = document.createElement("textarea");
  descInput.className = "card-desc";
  descInput.rows = 3;
  descInput.maxLength = PROJECT_DESCRIPTION_MAX_LENGTH;
  descInput.placeholder = "description (optional)";
  descInput.value = createForm.description;
  function autoResizeDescInput() {
    descInput.style.height = "auto";
    descInput.style.height = `${descInput.scrollHeight}px`;
  }
  const descCounter = document.createElement("div");
  descCounter.className = "desc-counter";
  function updateDescCounter() {
    const over = descInput.value.length > descInput.maxLength;
    descCounter.textContent = `${descInput.value.length}/${descInput.maxLength}`;
    descCounter.classList.toggle("over-limit", over);
  }
  updateDescCounter();
  descInput.addEventListener("input", () => {
    createForm.description = descInput.value;
    autoResizeDescInput();
    updateDescCounter();
    updateSubmitState();
  });
  requestAnimationFrame(autoResizeDescInput);

  const createBtn = document.createElement("button");
  createBtn.className = "create-btn";
  createBtn.textContent = editingEntry ? "Save changes" : "Add project";

  async function persistWithSpinner() {
    const originalLabel = createBtn.innerHTML;
    createBtn.disabled = true;
    createBtn.innerHTML = ICON_SPINNER;
    const ok = await persist();
    if (!ok) {
      createBtn.disabled = false;
      createBtn.innerHTML = originalLabel;
    }
    return ok;
  }

  function updateSubmitState() {
    const categoryOk = createForm.category !== null && !isCategoryFullExcluding(createForm.category, excludePort);
    const portOk = createForm.category === "unassigned" || /^\d+$/.test(portInput.value.trim());
    const descOk = descInput.value.length <= descInput.maxLength;
    createBtn.disabled = !nameInput.value.trim() || !portOk || !categoryOk || !descOk;
  }
  updateSubmitState();

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "cancel-btn";
  cancelBtn.textContent = "Cancel";
  cancelBtn.addEventListener("click", () => {
    editingKey = null;
    createForm = { category: null, port: null, name: "", description: "", url: "" };
    render();
  });

  const actions = document.createElement("div");
  actions.className = "add-form-actions";

  function fail(message) {
    const existing = form.querySelector(".card-error");
    if (existing) existing.remove();
    const err = document.createElement("div");
    err.className = "card-error";
    err.textContent = message;
    form.insertBefore(err, actions);
  }

  createBtn.addEventListener("click", async () => {
    const existingFail = form.querySelector(".card-error");
    if (existingFail) existingFail.remove();

    const category = createForm.category;
    const port = portInput.value.trim();
    const url = normalizeSiteUrl(urlInput.value);
    if (url === null) return fail("Live site must be a web address, like example.com or https://example.com");

    if (editingSource === "entries") {
      if (!/^\d+$/.test(port)) return fail("Port must be a positive integer");
      const range = categoryPortRange(category);
      const portNum = Number(port);
      if (portNum < range.start || portNum > range.end) {
        return fail(`Port must be within ${category}'s range (${formatPortRange(range)})`);
      }
      const selfIndex = entries.findIndex((e) => e.port === editingKey.port);
      if (selfIndex === -1) {
        editingKey = null;
        render();
        return;
      }
      if (portConflict(port, selfIndex)) return fail(`Port ${port} is already in use`);
      if (isCategoryFullExcluding(category, excludePort)) return fail(`${category} is already at its limit`);
      const portsChanged = port !== editingEntry.port;
      if (portsChanged && !(await confirmPortsFree([editingEntry.port, port]))) return;

      const prev = { ...entries[selfIndex] };
      entries[selfIndex] = { ...entries[selfIndex], category, port, description: descInput.value.trim(), url };
      const ok = await persistWithSpinner();
      if (!ok) {
        entries[selfIndex] = prev;
        return;
      }
      editingKey = null;
      createForm = { category: null, port: null, name: "", description: "", url: "" };
      render();
      return;
    }

    if (editingSource === "unassigned") {
      if (!/^\d+$/.test(port)) return fail("Port must be a positive integer");
      const range = categoryPortRange(category);
      const portNum = Number(port);
      if (portNum < range.start || portNum > range.end) {
        return fail(`Port must be within ${category}'s range (${formatPortRange(range)})`);
      }
      const unassignedIndex = unassigned.findIndex((e) => e.name === editingKey.name);
      if (unassignedIndex === -1) {
        editingKey = null;
        render();
        return;
      }
      if (portConflict(port, -1)) return fail(`Port ${port} is already in use`);
      if (isCategoryFull(category)) return fail(`${category} is already at its limit`);
      if (!(await confirmPortsFree([port]))) return;

      const removed = unassigned.splice(unassignedIndex, 1)[0];
      entries.push({ port, category, name: removed.name, description: descInput.value.trim(), url });
      const ok = await persistWithSpinner();
      if (!ok) {
        entries.pop();
        unassigned.splice(unassignedIndex, 0, removed);
        return;
      }
      editingKey = null;
      createForm = { category: null, port: null, name: "", description: "", url: "" };
      render();
      return;
    }

    const name = nameInput.value.trim();
    if (!name) return fail("Name is required — must match the project's folder name");
    const folders = await folderListPromise;
    if (!folders.includes(name)) {
      try {
        await createProjectFolder(name);
      } catch (err) {
        return fail(err.message);
      }
    }

    if (category === "unassigned") {
      unassigned.push({ name, description: descInput.value.trim(), url });
      const ok = await persistWithSpinner();
      if (!ok) {
        unassigned.pop();
        return;
      }
      createForm = { category: null, port: null, name: "", description: "", url: "" };
      render();
      return;
    }

    if (!/^\d+$/.test(port)) return fail("Port must be a positive integer");
    const range = categoryPortRange(category);
    const portNum = Number(port);
    if (portNum < range.start || portNum > range.end) {
      return fail(`Port must be within ${category}'s range (${formatPortRange(range)})`);
    }
    if (portConflict(port, -1)) return fail(`Port ${port} is already in use`);
    if (isCategoryFull(category)) return fail(`${category} is already at its limit`);
    if (!(await confirmPortsFree([port]))) return;

    entries.push({ port, category, name, description: descInput.value.trim(), url });
    const ok = await persistWithSpinner();
    if (!ok) {
      entries.pop();
      return;
    }
    createForm = { category: null, port: null, name: "", description: "", url: "" };
    render();
  });

  const topRow = document.createElement("div");
  topRow.className = "add-form-row";
  topRow.appendChild(categoryDropdown);
  topRow.appendChild(portStepper);

  form.appendChild(topRow);
  form.appendChild(nameInput);
  form.appendChild(datalist);
  form.appendChild(urlInput);
  form.appendChild(descInput);
  form.appendChild(descCounter);
  actions.appendChild(cancelBtn);
  actions.appendChild(createBtn);
  form.appendChild(actions);
  return form;
}

function buildCategoryDropdown(entry, index) {
  const wrap = document.createElement("div");
  const isOpen = openCategoryDropdown === index;
  wrap.className = "dropdown" + (isOpen ? " open" : "");

  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "dropdown-toggle";
  toggleBtn.innerHTML =
    `<span>${entry.category}</span>` +
    `<svg class="dropdown-caret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">` +
    `<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  toggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    openCardMenu = null;
    openCategoryDropdown = isOpen ? null : index;
    render();
  });
  wrap.appendChild(toggleBtn);

  if (isOpen) {
    const menu = document.createElement("div");
    menu.className = "dropdown-menu";
    for (const cat of CATEGORIES) {
      const active = cat === entry.category;
      const blocked = !active && isCategoryFull(cat);
      const opt = document.createElement("button");
      opt.type = "button";
      opt.className = "dropdown-option cat-" + cat + (active ? " active" : "");
      opt.disabled = blocked;
      opt.innerHTML =
        `<span class="label">${cat}</span>` +
        (blocked
          ? `<span class="hint">full (${categoryCount(cat)}/${CATEGORY_LIMITS[cat]})</span>`
          : active
          ? `<span class="check">✓</span>`
          : "");
      opt.addEventListener("click", async (e) => {
        e.stopPropagation();
        openCategoryDropdown = null;
        if (active) {
          render();
          return;
        }
        const newPort = nextFreePortInCategory(cat, index);
        if (newPort === null) {
          render();
          return;
        }
        if (!(await confirmPortsFree([entry.port, newPort]))) {
          render();
          return;
        }
        const prevCategory = entry.category;
        const prevPort = entry.port;
        entry.category = cat;
        entry.port = newPort;
        markCardSaving(opt.closest(".card"));
        const ok = await persist();
        if (!ok) {
          entry.category = prevCategory;
          entry.port = prevPort;
        }
        render();
      });
      menu.appendChild(opt);
    }
    wrap.appendChild(menu);
  }

  return wrap;
}

function buildAssignDropdown(entry, index) {
  const wrap = document.createElement("div");
  const isOpen = openAssignDropdown === index;
  wrap.className = "dropdown" + (isOpen ? " open" : "");

  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "dropdown-toggle";
  toggleBtn.innerHTML =
    `<span>Assign category</span>` +
    `<svg class="dropdown-caret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">` +
    `<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  toggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    openAssignDropdown = isOpen ? null : index;
    render();
  });
  wrap.appendChild(toggleBtn);

  if (isOpen) {
    const menu = document.createElement("div");
    menu.className = "dropdown-menu";
    for (const cat of CATEGORIES) {
      const blocked = isCategoryFull(cat);
      const opt = document.createElement("button");
      opt.type = "button";
      opt.className = "dropdown-option cat-" + cat;
      opt.disabled = blocked;
      opt.innerHTML =
        `<span class="label">${cat}</span>` +
        (blocked ? `<span class="hint">full (${categoryCount(cat)}/${CATEGORY_LIMITS[cat]})</span>` : "");
      opt.addEventListener("click", async (e) => {
        e.stopPropagation();
        openAssignDropdown = null;
        const newPort = nextFreePortInCategory(cat, -1);
        if (newPort === null) {
          render();
          return;
        }
        if (!(await confirmPortsFree([newPort]))) {

        markCardSaving(opt.closest(".card") || opt.closest(".project-header"));

  return wrap;
