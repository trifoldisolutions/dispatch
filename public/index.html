function buildPathInfoItem(label, value) {
  const item = document.createElement("span");
  const labelEl = document.createElement("span");
  labelEl.className = "project-path-label";
  labelEl.textContent = label + " ";
  item.appendChild(labelEl);
  item.appendChild(document.createTextNode(value));
  return item;
}

// Lazily fetches and caches a project's on-disk path/timestamps (per project
// name, so re-opening/re-rendering its page doesn't repeat the filesystem
// stat/recursive scan), re-rendering once the fetch resolves.
function ensurePathInfoLoaded(entry) {
  if (projectPathInfo[entry.name] || projectPathInfoInFlight.has(entry.name)) return;
  projectPathInfoInFlight.add(entry.name);
  fetchProjectPathInfo(entry.name)
    .then((result) => {
      projectPathInfo[entry.name] = result;
    })
    .catch((err) => {
      projectPathInfo[entry.name] = { error: err.message };
    })
    .finally(() => {
      projectPathInfoInFlight.delete(entry.name);
      render();
    });
}

// The on-disk path chip shown next to the category tag; click to reveal the
// folder in File Explorer.
function buildPathButton(entry) {
  ensurePathInfoLoaded(entry);
  const info = projectPathInfo[entry.name];

  const pathBtn = document.createElement("button");
  pathBtn.type = "button";
  pathBtn.className = "project-path-link project-folder-link";

  if (!info) {
    pathBtn.textContent = "📁 Loading…";
    pathBtn.disabled = true;
    return pathBtn;
  }
  if (info.error) {
    pathBtn.textContent = "📁 Unavailable";
    pathBtn.title = info.error;
    pathBtn.disabled = true;
    return pathBtn;
  }

  pathBtn.textContent = `📁 ${info.path}`;
  pathBtn.title = `Open ${info.path} in File Explorer`; // in full, since the chip may cut it short
  pathBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      await openProjectFolder(entry.name);
    } catch (err) {
      setStatus("error", err.message);
    }
  });
  return pathBtn;
}

// The project's creation/last-edited timestamps, shown below the description.
// Renders nothing until buildPathButton's fetch (triggered earlier in the
// same render) has resolved.
function buildPathMeta(entry) {
  const info = projectPathInfo[entry.name];
  if (!info || info.error) return null;

  const meta = document.createElement("div");
  meta.className = "project-path-meta";
  meta.appendChild(buildPathInfoItem("Created", formatTimestamp(info.created)));
  const sep = document.createElement("span");
  sep.className = "project-path-sep";
  sep.textContent = "•";
  meta.appendChild(sep);
  meta.appendChild(buildPathInfoItem("Last edited", formatTimestamp(info.modified)));
  return meta;
}

function buildUnassignedCard(entry, index) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.project = entry.name;
  if (editingKey && editingKey.list === "unassigned" && editingKey.name === entry.name) {
    card.classList.add("busy");
  }
  card.draggable = true;
  card.addEventListener("dragstart", (e) => {
    if (e.target.closest("input, textarea, button")) {
      e.preventDefault();
      return;
    }
    dragSource = { list: "unassigned", index };
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";

  });
  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
    dragSource = null;
  });
  card.appendChild(buildCardLink(entry.name));

  const top = document.createElement("div");
  top.className = "card-top";
  const name = document.createElement("div");
  name.className = "card-name";
  name.textContent = entry.name;

  card.appendChild(description);
  card.appendChild(actions);

// --- Routing: the dashboard lives at "/" and each project has its own page
// at /<name>, with a page for each of its panels at /<name>/<section> (see
// PROJECT_SECTIONS). Pages are keyed by folder name, not port — the name
// stays put while a project is dragged to another port, switched to another
// category or (un)assigned, so its pages survive all of those. The server
// answers all of these addresses with this same file; navigate() switches
// between them without a reload, and popstate covers the browser's
// back/forward.
function projectPath(name, section = null) {
  return "/" + encodeURIComponent(name) + (section ? `/${section}` : "");
}

// { project, section } for an address: nulls on the dashboard, and a null
// section on a project's own page. Anything past the section is kept on it,
// so a mistyped address shows as a section that doesn't exist.
function routeFromPath(pathname) {
  const [encoded, ...rest] = pathname.replace(/^\/+|\/+$/g, "").split("/");
  if (!encoded) return { project: null, section: null };
  try {
    return { project: decodeURIComponent(encoded), section: rest.length > 0 ? rest.join("/") : null };
  } catch {
    return { project: null, section: null };
  }
}

// The page a project page's section address names — a panel's, or Staff's —
// or null when it names none (see routeFromPath).
function findProjectSection(slug) {
  return [...PROJECT_SECTIONS, STAFF_SECTION].find((section) => section.slug === slug) || null;
}

function navigate(path) {
  if (path !== location.pathname) history.pushState(null, "", path);
  applyRoute();
}

// Brings the page in line with the address bar — after navigate(), or the
// browser's back/forward — and renders whichever page that now is.
function applyRoute() {
  const next = routeFromPath(location.pathname);
  if (next.project === currentProjectName) {
    // Between a project's page and its sections' pages the panels' filters
    // and drafts carry over — it's the same panel, given more room.
    const sectionChanged = next.section !== currentProjectSection;
    currentProjectSection = next.section;
    render();
    if (sectionChanged) window.scrollTo(0, 0);
    return;
  }
  if (currentProjectName === null) dashboardScrollY = window.scrollY;
  resetPageState();
  currentProjectName = next.project;
  currentProjectSection = next.section;
  if (currentProjectName !== null) {
    // Agents change files and rewrite the pending commit message while the
    // page is elsewhere — re-read git's side (and the file counts) on every
    // visit, so what shows beside Push is what a push would actually commit
    // with.
    delete historyCache[currentProjectName];
    delete gitStatusCache[currentProjectName];
    delete explorerCountsCache[currentProjectName];
  }
  render();
  window.scrollTo(0, currentProjectName === null ? dashboardScrollY : 0);
}

// Everything that belongs to the page being left rather than to the app:
// open menus, the panels' filters, and any half-done edit — a task loaded into
// the composer, or a project's details loaded into the edit form — which
// would otherwise turn up stale on the next page as if freshly started.
function resetPageState() {
  if (editingTaskId !== null && editingTaskProject !== null) {
    cancelTaskEdit(editingTaskProject);
  }
  if (editingKey) {
    editingKey = null;
    createForm = { category: null, port: null, name: "", description: "", url: "" };
  }
  taskFilter = emptyTaskFilter();
  taskStatusFilter = defaultTaskStatusFilter();
  journalFilter = emptyJournalFilter();
  explorerQuery = "";
  explorerSearchCollapsed = new Set();
  clearTimeout(explorerSearchTimer);
  closeJournalCalendar();
  closeTaskCalendar();
  taskDueCalendarOpen = false;
  portSwitchOpen = false;
  openTagsDropdownFor = null;
  openCategoryDropdown = null;
  openAssignDropdown = null;
  openCardMenu = null;
  openUnassignedCardMenu = null;
  createCategoryDropdownOpen = false;
  filterDropdownOpen = false;
}

// Dispatch's own folder gets a project page too (list "self", linked
// from the dashboard's toolbar), for its files, tasks, journal and history.
// It isn't in the registry: it always runs on PORT 3000, which no project can
// have, and on its page it has no port to switch, details to edit or Delete,
// since deleting it would delete the dashboard itself.
const SELF_PROJECT = {
  name: "dispatch",
  port: "3000",
  description:
    "This dashboard: gives each project in the folder a port by category (Fire, Breeze, Cold), runs and stops them, and keeps their files, tasks, journal and git history in view.",
  url: "",
};

// Looks a project up by name in either list — by value, not a stale index,
// the same way editingKey is resolved — so its page keeps tracking it across
// renders, including a move between entries and unassigned.
function findProjectByName(name) {
  if (name === SELF_PROJECT.name) return { entry: SELF_PROJECT, index: -1, list: "self" };
  let index = entries.findIndex((e) => e.name === name);
  if (index !== -1) return { entry: entries[index], index, list: "entries" };
  index = unassigned.findIndex((e) => e.name === name);
  return index === -1 ? null : { entry: unassigned[index], index, list: "unassigned" };
}

// The link that makes a whole card open its project's page: a real <a>, so
// hovering shows the address and Ctrl/middle/right-click open it in a new
// tab the way any link does. It's laid over the card (see .card-link in the
// CSS) beneath the card's own controls. draggable=false hands a drag that
// starts on it to the card itself, so a card can still be dragged onto
// another port.
function buildCardLink(name) {
  const link = document.createElement("a");
  link.className = "card-link";
  link.href = projectPath(name);
  link.dataset.route = "";
  link.draggable = false;
  link.setAttribute("aria-label", `Open ${name}`);
  return link;
}

// Keeps the page from scrolling behind a dialog (confirm/prompt, or the new
// folders one) while either is open. Centralized here since a confirm can
// be opened from inside the new folders dialog, and closing it shouldn't
// unlock scrolling while that one is still up.
function updateBodyScrollLock() {
  document.body.style.overflow = activeDialog || newFoldersModalOpen ? "hidden" : "";
}

function resolveDialog(result) {
  if (!activeDialog) return;
  const { resolve } = activeDialog;
  activeDialog = null;
  document.getElementById("confirm-overlay").hidden = true;
  document.getElementById("confirm-panel").innerHTML = "";
  updateBodyScrollLock();
  resolve(result);
}

// Custom-styled stand-in for window.confirm() — resolves true/false. Every
// call site already awaits it inside an async function, so this drops in
// wherever confirm(...) used to sit.
function customConfirm(message) {
  return new Promise((resolve) => {
    activeDialog = { resolve };
    renderConfirmDialog({ message });
  });
}

// Custom-styled stand-in for the "type this exact value to confirm"
// pattern the app used window.prompt() for (only the delete-project flow).
// Resolves true/false, not the typed string — the confirm/delete button
// itself stays disabled until the input matches confirmValue exactly, so
// there's no separate "you typed it wrong" step for the caller to handle.
function customPrompt(message, confirmValue) {
  return new Promise((resolve) => {
    activeDialog = { resolve };
    renderConfirmDialog({ message, confirmValue });
  });
}

function renderConfirmDialog({ message, confirmValue }) {
  const overlay = document.getElementById("confirm-overlay");
  const panel = document.getElementById("confirm-panel");
  panel.innerHTML = "";
  overlay.hidden = false;
  updateBodyScrollLock();

  const msg = document.createElement("p");
  msg.className = "confirm-message";
  msg.textContent = message;
  panel.appendChild(msg);

  const isPrompt = confirmValue !== undefined;
  let input = null;
  let okBtn;

  if (isPrompt) {
    const hint = document.createElement("p");
    hint.className = "confirm-hint";
    hint.append("Type ", Object.assign(document.createElement("strong"), { textContent: confirmValue }), " to confirm.");
    panel.appendChild(hint);

    input = document.createElement("input");
    input.type = "text";
    input.className = "confirm-input";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.addEventListener("input", () => {
      okBtn.disabled = input.value !== confirmValue;
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !okBtn.disabled) resolveDialog(true);
    });
    panel.appendChild(input);
  }

  const actions = document.createElement("div");
  actions.className = "confirm-actions";

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "cancel-btn";
  cancelBtn.textContent = "Cancel";
  cancelBtn.addEventListener("click", () => resolveDialog(false));
  actions.appendChild(cancelBtn);

  okBtn = document.createElement("button");
  okBtn.type = "button";
  okBtn.className = "confirm-btn" + (isPrompt ? " danger" : "");
  okBtn.textContent = isPrompt ? "Delete" : "OK";
  okBtn.disabled = isPrompt;
  okBtn.addEventListener("click", () => resolveDialog(true));
  actions.appendChild(okBtn);

  panel.appendChild(actions);
  requestAnimationFrame(() => (input || cancelBtn).focus());
}

function buildCard(entry, index) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.project = entry.name;
  if (editingKey && editingKey.list === "entries" && editingKey.port === entry.port) {
    card.classList.add("busy");
  }
  card.draggable = true;
  card.addEventListener("dragstart", (e) => {
    if (e.target.closest("input, textarea, button, a")) {
      e.preventDefault();
      return;
    }
    dragSource = { list: "entries", index };
    card.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", entry.name);
  });
  card.addEventListener("dragend", () => {
    card.classList.remove("dragging");
    dragSource = null;
  });
  // Dropping another card here hands it this card's port and slides this one
  // (and the projects behind it) over — see planPortShifts().
  card.addEventListener("dragover", (e) => {
    if (!dragSource || (dragSource.list === "entries" && dragSource.index === index)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    card.classList.add("drop-target");
  });
  card.addEventListener("dragleave", (e) => {
    if (card.contains(e.relatedTarget)) return; // just moved onto one of its own children
    card.classList.remove("drop-target");
  });
  card.addEventListener("drop", (e) => {
    e.preventDefault();
    card.classList.remove("drop-target");
    handlePortDrop(Number(entry.port), card);
  });
  card.appendChild(buildCardLink(entry.name));

  const top = document.createElement("div");
  top.className = "card-top";

  const liveDot = document.createElement("span");
  liveDot.className = "live-dot" + (portLiveStatus[entry.port] ? " live" : "");
  liveDot.dataset.port = entry.port;
  liveDot.title = portLiveStatus[entry.port]
    ? "Something is actively listening on this port"
    : "Nothing detected listening on this port";

  const nameText = document.createElement("a");
  nameText.className = "card-name-text";
  nameText.dataset.port = entry.port;
  nameText.textContent = entry.name;
  applyNameLinkState(nameText, !!portLiveStatus[entry.port]);

  const name = document.createElement("div");
  name.className = "card-name";
  name.title = `${entry.name} — read-only here, it must match the project's folder name for auto port injection to work`;
  name.appendChild(liveDot);
  name.appendChild(nameText);

  const portDisplay = document.createElement("div");
  portDisplay.className = "card-port";
  portDisplay.textContent = entry.port;
  portDisplay.title = `${entry.category}'s port range: ${formatPortRange(categoryPortRange(entry.category))}`;

  top.appendChild(name);
  top.appendChild(portDisplay);
  top.appendChild(buildCardMenu(entry, index));

  const description = document.createElement("div");
  description.className = "card-desc-text" + (entry.description ? "" : " empty");
  description.textContent = entry.description || "No description";
  if (entry.description) description.title = entry.description;

  const actions = document.createElement("div");
  actions.className = "card-actions stretch";
  actions.appendChild(buildCategoryDropdown(entry, index));
  actions.appendChild(buildRunButton(entry));

  card.appendChild(top);
  card.appendChild(description);
  card.appendChild(actions);
  return card;
}

// Lazily fetches and caches one folder level of the Explorer panel's tree
// (per project + relative path, so collapsing/re-expanding or an unrelated
// re-render doesn't repeat the readdir), re-rendering once it resolves.
function ensureTreeLoaded(project, subpath) {
  const key = `${project}::${subpath}`;
  if (fileTreeCache[key] || fileTreeInFlight.has(key)) return;
  fileTreeInFlight.add(key);
  fetchProjectTree(project, subpath)
    .then((entries) => {
      fileTreeCache[key] = entries;
    })
    .catch((err) => {
      fileTreeCache[key] = { error: err.message };
    })
    .finally(() => {
      fileTreeInFlight.delete(key);
      render();
    });
}

// The cache key for searching `project` for `query`, its words tidied so
// "Server " and "server" share one search; null when there are no words.
function explorerSearchKey(project, query) {
  const terms = filterTerms(query);
  return terms.length > 0 ? `${project}::${terms.join(" ")}` : null;
}

// Same lazy-load/cache/dedupe pattern as ensureTreeLoaded, for the
// Explorer's search, re-rendering once the results are in — while the
// search box still has focus (see renderProjectPage).
function ensureExplorerSearch(project, query) {
  const key = explorerSearchKey(project, query);
  if (!key || explorerSearchCache[key] || explorerSearchInFlight.has(key)) return;
  explorerSearchInFlight.add(key);
  const terms = filterTerms(query);
  fetchProjectTreeSearch(project, terms.join(" "))
    .then((result) => {
      explorerSearchCache[key] = { ...result, terms };
    })
    .catch((err) => {
      explorerSearchCache[key] = { error: err.message };
    })
    .finally(() => {
      explorerSearchInFlight.delete(key);
      render();
    });
}

// Same lazy-load/cache/dedupe pattern again, for the Explorer panel header's
// folder and file counts. It walks the whole project, so it's fetched once
// per visit (see applyRoute), not on every expand.
function ensureExplorerCountsLoaded(project) {
  if (explorerCountsCache[project] || explorerCountsInFlight.has(project)) return;
  explorerCountsInFlight.add(project);
  fetchProjectTreeCounts(project)
    .then((result) => {
      explorerCountsCache[project] = result;
    })
    .catch((err) => {
      explorerCountsCache[project] = { error: err.message };
    })
    .finally(() => {
      explorerCountsInFlight.delete(project);
      render();
    });
}

// Lazily fetches and caches a project's git status (once per project — the
// Explorer panel doesn't re-fetch on every re-render/expand, only when it's
// missing from cache), re-rendering once it resolves.
function ensureGitStatusLoaded(project) {
  if (gitStatusCache[project] || gitStatusInFlight.has(project)) return;
  gitStatusInFlight.add(project);
  fetchGitStatus(project)
    .then((result) => {
      gitStatusCache[project] = { isRepo: result.isRepo, byPath: new Map(result.entries.map((e) => [e.path, e.status])) };
    })
    .catch((err) => {
      // Shown as no repo, but marked failed so retryFailedLoads asks again.
      gitStatusCache[project] = { isRepo: false, byPath: new Map(), error: err.message };
    })
    .finally(() => {
      gitStatusInFlight.delete(project);
      render();
    });
}

// Lazily fetches and caches a project's git history (once per project, same
// dedupe pattern as ensureGitStatusLoaded), for the History panel's last
// commit / last push display.
function ensureHistoryLoaded(project) {
  if (historyCache[project] || historyInFlight.has(project)) return;
  historyInFlight.add(project);
  fetchGitHistory(project)
    .then((result) => {
      historyCache[project] = result;
    })
    .catch((err) => {
      historyCache[project] = { error: err.message };
    })
    .finally(() => {
      historyInFlight.delete(project);
      render();
    });
}

// Lazily fetches and caches a project's journal (once per project, same
// dedupe pattern as ensureGitStatusLoaded) so opening a project's page
// re-reads dev_resources/journal.md fresh — picking up edits made directly
// to the file, not just ones made from this composer.
function ensureJournalLoaded(project) {
  if (journalCache[project] || journalInFlight.has(project)) return;
  journalInFlight.add(project);
  fetchJournal(project)
    .then((result) => {
      journalCache[project] = result;
    })
    .catch((err) => {
      journalCache[project] = { error: err.message };
    })
    .finally(() => {
      journalInFlight.delete(project);
      render();
    });
}

// Same lazy-load/cache/dedupe pattern as ensureJournalLoaded, for the Tasks
// tab's dev_resources/tasks.json.
function ensureTasksLoaded(project) {
  if (taskCache[project] || taskInFlight.has(project)) return;
  taskInFlight.add(project);
  fetchTasks(project)
    .then((result) => {
      taskCache[project] = result;
    })
    .catch((err) => {
      taskCache[project] = { error: err.message };
    })
    .finally(() => {
      taskInFlight.delete(project);
      render();
    });
}

// Same priority order as the server's GIT_STATUS_PRIORITY — used here to
// pick one status for a folder that contains a mix of changed paths.
const GIT_STATUS_PRIORITY = ["conflicted", "modified", "renamed", "added", "untracked", "deleted", "ignored"];
const GIT_STATUS_LABELS = {
  conflicted: "Merge conflict",
  modified: "Modified",
  renamed: "Renamed",
  added: "Added",
  untracked: "Untracked",
  deleted: "Deleted",
  ignored: "Ignored",
};
// Single-letter badges, matching the convention VS Code's Explorer uses.
const GIT_STATUS_LETTERS = {
  conflicted: "C",
  modified: "M",
  renamed: "R",
  added: "A",
  untracked: "U",
  deleted: "D",
  ignored: "I",
};

// A file's status is a direct lookup; a folder's is the highest-priority
// status among any changed path at or beneath it, so an untouched folder
// with one modified file three levels down still shows as modified.
function gitStatusForPath(project, itemPath, isDir) {
  const cache = gitStatusCache[project];
  if (!cache || !cache.isRepo) return null;
  if (!isDir) return cache.byPath.get(itemPath) || null;
  const prefix = itemPath + "/";
  let best = null;
  for (const [path, status] of cache.byPath) {
    if (path !== itemPath && !path.startsWith(prefix)) continue;
    if (best === null || GIT_STATUS_PRIORITY.indexOf(status) < GIT_STATUS_PRIORITY.indexOf(best)) best = status;
  }
  return best;
}

function fileTreeMessage(text, depth, isError) {
  const msg = document.createElement("div");
  msg.className = "file-tree-message" + (isError ? " error" : "");
  msg.style.paddingLeft = `${4 + depth * 16 + 20}px`;
  msg.textContent = text;
  return msg;
}

// One folder's contents — fetched (or read from cache) for `subpath`, then
// rendered as a flat run of rows at `depth`. Expanded subfolders append
// their own children level recursively via buildFileTreeNode.
function buildFileTreeChildren(project, subpath, depth) {
  const key = `${project}::${subpath}`;
  ensureTreeLoaded(project, subpath);
  const container = document.createElement("div");
  container.className = "file-tree-children";
  const cached = fileTreeCache[key];
  if (!cached) {
    container.appendChild(fileTreeMessage("Loading…", depth, false));
  } else if (cached.error) {
    container.appendChild(fileTreeMessage(cached.error, depth, true));
  } else if (cached.length === 0) {
    container.appendChild(fileTreeMessage("Empty folder", depth, false));
  } else {
    for (const item of cached) {
      container.appendChild(buildFileTreeNode(project, subpath, item, depth));
    }
  }
  return container;
}

// Drops every cached tree level under (and including) `itemPath`, plus its
// parent's listing — the parent needs a fresh readdir since it no longer
// includes the deleted entry, and any cached descendant levels are now
// stale/gone regardless of whether they were ever expanded.
function invalidateTreeCache(project, itemPath) {
  const parentPath = itemPath.includes("/") ? itemPath.slice(0, itemPath.lastIndexOf("/")) : "";
  delete fileTreeCache[`${project}::${parentPath}`];
  const prefix = `${project}::${itemPath}`;
  for (const key of Object.keys(fileTreeCache)) {
    if (key === prefix || key.startsWith(prefix + "/")) delete fileTreeCache[key];
  }
  fileTreeExpanded.delete(prefix);
  delete explorerCountsCache[project]; // it took some folders or files with it
  // Searches that found it, or anything inside it, can't any more.
  for (const [key, result] of Object.entries(explorerSearchCache)) {
    if (!key.startsWith(`${project}::`) || !result.matches) continue;
    result.matches = result.matches.filter((m) => m.path !== itemPath && !m.path.startsWith(itemPath + "/"));
  }
}

async function handleFileTreeDelete(project, itemPath, item) {
  const message =
    item.type === "dir"
      ? `This permanently deletes the "${item.name}" folder and everything inside it. This can't be undone.`
      : `This permanently deletes "${item.name}". This can't be undone.`;
  const confirmed = await customConfirm(message);
  if (!confirmed) return;
  try {
    await deleteProjectTreeEntry(project, itemPath);
  } catch (err) {
    setStatus("error", err.message);
    return;
  }
  invalidateTreeCache(project, itemPath);
  render();
}

// One row (folder or file) plus, if it's an expanded folder, its children
// level nested beneath it — folders start collapsed until their toggle (or
// the row itself) is clicked, at which point their contents are fetched.
// In a search's results (`search`, see buildExplorerSearchResults) a folder
// holding matches lists only those instead, and starts open; a matching
// name has the search's words marked, and a file found by its contents
// has its matching lines under it.
function buildFileTreeNode(project, parentPath, item, depth, search = null) {
  const wrapper = document.createElement("div");
  wrapper.className = "file-tree-node";
  const itemPath = parentPath ? `${parentPath}/${item.name}` : item.name;
  const key = `${project}::${itemPath}`;
  const isDir = item.type === "dir";
  const holdsMatches = isDir && search !== null && search.levels.has(itemPath);
  const expanded = isDir && (holdsMatches ? !explorerSearchCollapsed.has(key) : fileTreeExpanded.has(key));

  const gitStatus = gitStatusForPath(project, itemPath, isDir);

  const row = document.createElement("div");
  row.className = "file-tree-row" + (gitStatus ? ` git-${gitStatus}` : "");
  row.dataset.dir = String(isDir);
  row.style.paddingLeft = `${4 + depth * 16}px`;
  if (gitStatus) row.title = GIT_STATUS_LABELS[gitStatus];

  const toggle = document.createElement(isDir ? "button" : "span");
  if (isDir) {
    toggle.type = "button";
    toggle.className = "json-toggle" + (expanded ? "" : " collapsed");
    toggle.setAttribute("aria-label", expanded ? "Collapse" : "Expand");
    toggle.innerHTML = JSON_TOGGLE_CHEVRON;
  } else {
    toggle.className = "json-toggle-spacer";
  }
  row.appendChild(toggle);

  const icon = document.createElement("span");
  icon.className = "file-tree-icon";
  icon.innerHTML = isDir ? ICON_FOLDER : iconForFileName(item.name);
  row.appendChild(icon);

  const label = document.createElement("span");
  label.className = "file-tree-label";
  if (search && item.matched) appendHighlighted(label, item.name, search.terms);
  else label.textContent = item.name;
  row.appendChild(label);

  const end = document.createElement("span");
  end.className = "file-tree-end";

  const deleteBtn = document.createElement("button");
  deleteBtn.type = "button";
  deleteBtn.className = "file-tree-delete";
  deleteBtn.setAttribute("aria-label", `Delete ${item.name}`);
  deleteBtn.title = `Delete "${item.name}"`;
  deleteBtn.innerHTML = ICON_TRASH;
  deleteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    handleFileTreeDelete(project, itemPath, item);
  });
  end.appendChild(deleteBtn);

  if (gitStatus) {
    const badge = document.createElement("span");
    badge.className = "file-tree-badge";
    badge.textContent = GIT_STATUS_LETTERS[gitStatus];
    badge.title = GIT_STATUS_LABELS[gitStatus];
    end.appendChild(badge);
  }

  row.appendChild(end);

  if (isDir) {
    row.addEventListener("click", (e) => {
      e.stopPropagation();
      if (holdsMatches) {
        if (expanded) explorerSearchCollapsed.add(key);
        else explorerSearchCollapsed.delete(key);
      } else if (expanded) {
        fileTreeExpanded.delete(key);
      } else {
        fileTreeExpanded.add(key);
      }
      render();
    });
  }

  wrapper.appendChild(row);
  if (search && item.lineCount > 0) wrapper.appendChild(buildFileTreeSnippets(item, depth, search));
  if (expanded) {
    wrapper.appendChild(
      holdsMatches
        ? buildFileTreeSearchLevel(project, itemPath, depth + 1, search)
        : buildFileTreeChildren(project, itemPath, depth + 1)
    );
  }
  return wrapper;
}

// Folders first, then by name ignoring case — the order the server lists a
// folder in (see its tree route).
function compareTreeItems(a, b) {
  if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
  return a.name.localeCompare(b.name, undefined, { sensitivity: "base" });
}

// The Explorer with a search set: every match laid out in the tree under the
// folders that hold it — the search's words marked in a name that matched,
// and a file found by its contents followed by its first matching lines
// (see buildFileTreeSnippets). Those folders start open, though each can
// still be closed. A folder that matched with nothing inside it matching
// starts closed, and opening it lists everything it holds, the same as it
// would without a search.
function buildExplorerSearchResults(project, result) {
  const levels = new Map(); // folder path -> Map(name -> { name, type, matched, lines, lineCount })
  for (const match of result.matches) {
    const parts = match.path.split("/");
    parts.forEach((name, i) => {
      const parent = parts.slice(0, i).join("/");
      if (!levels.has(parent)) levels.set(parent, new Map());
      const level = levels.get(parent);
      const isMatch = i === parts.length - 1;
      const item = level.get(name) || { name, type: isMatch ? match.type : "dir", matched: false };
      if (isMatch) Object.assign(item, { matched: match.nameMatch, lines: match.lines || [], lineCount: match.lineCount || 0 });
      level.set(name, item);
    });
  }
  const container = document.createElement("div");
  container.className = "file-tree";
  container.appendChild(buildFileTreeSearchLevel(project, "", 0, { levels, terms: result.terms }));
  return container;
}

// Under a file the search found by its contents, lined up with its name:
// its first few matching lines, each with its line number and the search
// marked, then how many more there are. Contents match the search as one
// phrase, so that's what gets marked, not its words one by one.
function buildFileTreeSnippets(item, depth, search) {
  const list = document.createElement("div");
  list.className = "file-tree-snippets";
  list.style.paddingLeft = `${50 + depth * 16}px`; // a row's padding, toggle, icon and gaps (see buildFileTreeNode)
  const phrase = [search.terms.join(" ")];
  for (const { line, text } of item.lines) {
    const row = document.createElement("div");
    row.className = "file-tree-snippet";
    row.title = `Line ${line}: ${text}`;
    const number = document.createElement("span");
    number.className = "file-tree-snippet-line";
    number.textContent = line;
    const code = document.createElement("span");
    code.className = "file-tree-snippet-text";
    appendHighlighted(code, text, phrase);
    row.append(number, code);
    list.appendChild(row);
  }
  const more = item.lineCount - item.lines.length;
  if (more > 0) {
    const moreEl = document.createElement("div");
    moreEl.className = "file-tree-snippet-more";
    moreEl.textContent = `+${more} more line${more === 1 ? "" : "s"}`;
    list.appendChild(moreEl);
  }
  return list;
}

// One folder's worth of a search's results, at `depth`.
function buildFileTreeSearchLevel(project, subpath, depth, search) {
  const container = document.createElement("div");
  container.className = "file-tree-children";
  for (const item of [...search.levels.get(subpath).values()].sort(compareTreeItems)) {
    container.appendChild(buildFileTreeNode(project, subpath, item, depth, search));
  }
  return container;
}

// Parsed as a local date (not UTC) so it never drifts a day depending on
// timezone. Builds the stacked month/day/year badge shown on a day's first
// entry only — month abbreviation on top, the day number (larger) in the
// middle, the year at the bottom; highlighted if it's today.
function buildJournalEntryDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const badge = document.createElement("div");
  badge.className = "journal-entry-date" + (date.toDateString() === new Date().toDateString() ? " is-today" : "");
  const month = document.createElement("div");
  month.className = "journal-entry-date-month";
  month.textContent = date.toLocaleDateString(undefined, { month: "short" });
  const day = document.createElement("div");
  day.className = "journal-entry-date-day";
  day.textContent = String(d).padStart(2, "0");
  const year = document.createElement("div");
  year.className = "journal-entry-date-year";
  year.textContent = String(y);
  badge.appendChild(month);
  badge.appendChild(day);
  badge.appendChild(year);
  return badge;
}

// The History panel's content: the repo's last commit and when it was last
// pushed (see the git-history endpoint for how "last push" is derived from
// the upstream branch's reflog). Read-only — nothing here writes to the repo.
function buildHistoryPanel(entry, panel) {
  ensureHistoryLoaded(entry.name);
  const container = document.createElement("div");
  container.className = "history-tab";
  const state = historyCache[entry.name];

  if (!state) {
    container.appendChild(buildPanelLoading());
    return container;
  }
  if (state.error) {
    container.appendChild(buildLoadErrorEmpty(entry.name, "Couldn't load history", state.error));
    return container;
  }
  if (!state.isRepo) {
    container.appendChild(
      buildPanelEmpty({
        icon: ICON_GIT_BRANCH,
        title: "Not a git repository",
        text: "The project's last commit and push show here once its folder is a git repository.",
      })
    );
    return container;
  }

  const columns = document.createElement("div");
  columns.className = "history-columns";

  columns.appendChild(
    buildHistoryRow(
      "Last commit",
      state.lastCommit
        ? [
            { text: state.lastCommit.message },
            { text: `${state.lastCommit.shortHash} · ${state.lastCommit.author} · ${formatTimestamp(state.lastCommit.date)}`, dim: true },
          ]
        : [{ text: "No commits yet.", dim: true }]
    )
  );

  columns.appendChild(
    buildHistoryRow(
      "Last push",
      state.lastPush
        ? [{ text: formatTimestamp(state.lastPush.date) }, { text: `to ${state.upstream}`, dim: true }]
        : [{ text: state.upstream ? "No push recorded yet." : "No upstream branch configured.", dim: true }]
    )
  );

  // The push bar heads the panel: pending change count plus one-click Push,
  // counted from the same gitStatusCache entry that colors the Explorer.
  ensureGitStatusLoaded(entry.name);
  const gitState = gitStatusCache[entry.name];
  if (gitState && gitState.isRepo) {
    container.appendChild(buildGitPushBar(entry, panel, gitState, state.commitMessage));
  }

  // With nothing committed, there's no last commit or push to show yet.
  container.appendChild(
    state.lastCommit
      ? columns
      : buildPanelEmpty({ icon: ICON_GIT_COMMIT, title: "No commits yet", text: "The project's last commit and push show here after its first commit." })
  );

  return container;
}

// One label + stacked value lines for the History panel (e.g. "Last commit").
function buildHistoryRow(label, lines) {
  const row = document.createElement("div");
  row.className = "history-row";
  const labelEl = document.createElement("div");
  labelEl.className = "history-row-label";
  labelEl.textContent = label;
  row.appendChild(labelEl);
  const valueEl = document.createElement("div");
  valueEl.className = "history-row-value";
  lines.forEach(({ text, dim }) => {
    const line = document.createElement("div");
    line.className = "history-row-line" + (dim ? " history-row-line-dim" : "");
    line.textContent = text;
    valueEl.appendChild(line);
  });
  row.appendChild(valueEl);
  return row;
}

// The Journal panel's content: entries grouped into one block per calendar
// day (newest day first, per journal.md's own convention), a filter field
// above them, and a composer at the bottom to add a new note.
function buildJournalPanel(entry, panel) {
  ensureJournalLoaded(entry.name);
  const container = document.createElement("div");
  container.className = "journal-tab";

  const listEl = document.createElement("div");
  listEl.className = "journal-entries panel-scroll";
  listEl.dataset.scrollKey = "journal"; // see renderProjectPage
  const state = journalCache[entry.name];

  if (!state) {
    listEl.appendChild(buildPanelLoading());
  } else if (state.error) {
    // Nothing to add a note to until the journal can be read.
    container.appendChild(buildLoadErrorEmpty(entry.name, "Couldn't load the journal", state.error));
    return container;
  } else if (state.days.length === 0) {
    listEl.appendChild(
      buildPanelEmpty({
        icon: ICON_BOOK_OPEN,
        title: "No journal entries yet",
        text: "Notes added below, and the entries agents post, show here by day.",
      })
    );
  } else {
    // Typing re-fills just the list, from the top, the same way
    // buildTasksPanel does and for the same reason.
    const total = state.days.reduce((n, day) => n + day.entries.length, 0);
    const filterBar = buildJournalFilterBar(entry, () => {
      listEl.scrollTop = 0;
      fillList();
    });
    container.appendChild(filterBar.el);
    function fillList() {
      listEl.textContent = "";
      const terms = filterTerms(journalFilter.query);
      const days = filterJournalDays(state.days);
      if (days.length === 0) {
        listEl.appendChild(
          buildPanelEmpty({
            icon: ICON_SEARCH,
            title: "No matching entries",
            text:
              terms.length > 0
                ? "No entry's note or reported files match this filter."
                : `Nothing was logged ${journalFilter.start === journalFilter.end ? "on" : "from"} ${formatDateRange(journalFilter)}.`,
            action: { label: "Clear filter", onClick: filterBar.clear },
          })
        );
      }
      days.forEach((day, dayIndex) => {
        if (dayIndex > 0) {
          const divider = document.createElement("div");
          divider.className = "journal-day-divider";
          listEl.appendChild(divider);
        }
        listEl.appendChild(buildJournalDay(entry.name, day, terms));
      });
      filterBar.updateStatus(days.reduce((n, day) => n + day.entries.length, 0), total);
    }
    fillList();
  }

  container.appendChild(listEl);
  container.appendChild(buildJournalComposer(entry, panel));
  return container;
}

// One day's block: its entries, the first carrying the date badge, then the
// files they reported. `terms` are the filter's search words, marked
// wherever they turn up. Each entry's time sits under its text: for one the
// dashboard inserted, the exact insert time (`insertedAt`, from the audit log
// in server.js), to the second; for a hand-written one, the HH:MM it was
// written with. Their tooltips say which it is.
function buildJournalDay(name, day, terms) {
  const dayEl = document.createElement("div");
  dayEl.className = "journal-day";
  day.entries.forEach((item, i) => {
    const row = document.createElement("div");
    row.className = "journal-entry";
    if (i === 0) {
      row.appendChild(buildJournalEntryDate(day.date));
    } else {
      const spacer = document.createElement("div");
      spacer.className = "journal-entry-date";
      row.appendChild(spacer);
    }
    const content = document.createElement("div");
    content.className = "journal-entry-content";
    const dash = document.createElement("span");
    dash.className = "journal-entry-dash";
    dash.textContent = "— ";
    content.appendChild(dash);
    appendHighlighted(content, item.content, terms);
    const time = buildJournalEntryTime(day.date, item);
    if (time) content.appendChild(time);
    row.appendChild(content);
    dayEl.appendChild(row);
  });
  const files = buildJournalDayFiles(name, day, terms);
  if (files) dayEl.appendChild(files);
  return dayEl;
}

// The time line under one journal entry (see buildJournalDay), or null for
// a hand-written entry with no time at all.
function buildJournalEntryTime(date, item) {
  const el = document.createElement("div");
  el.className = "journal-entry-time";
  if (item.insertedAt) {
    const inserted = new Date(item.insertedAt);
    el.textContent = inserted.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" });
    el.title = `Inserted ${inserted.toLocaleString()}`;
  } else if (item.time) {
    el.textContent = new Date(`${date}T${item.time}`).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    el.title = "Time as written in journal.md; no insert record";
  } else {
    return null;
  }
  return el;
}

const JOURNAL_FILE_KIND_LABELS = { created: "Created", modified: "Modified", deleted: "Deleted" };

// For each journal day, the files known to exist when it began: reported
// created or modified on an earlier day, and not reported deleted since.
// Built from the whole journal rather than the filtered view, so a search
// can't hide the day a file first appeared. Cached per fetched journal.
const journalExistingFilesCache = new WeakMap();

function journalFilesExistingByDate(days) {
  let byDate = journalExistingFilesCache.get(days);
  if (byDate) return byDate;
  byDate = new Map();
  const existing = new Set();
  for (const day of [...days].sort((a, b) => a.date.localeCompare(b.date))) {
    if (!byDate.has(day.date)) byDate.set(day.date, new Set(existing));
    // Oldest entry first, so a file deleted and then made again that day
    // ends it existing (untimed hand-written entries keep their order).
    const entries = [...day.entries].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
    for (const item of entries) {
      for (const file of (item.files && item.files.created) || []) existing.add(file);
      for (const file of (item.files && item.files.modified) || []) existing.add(file);
      for (const file of (item.files && item.files.deleted) || []) existing.delete(file);
    }
  }
  journalExistingFilesCache.set(days, byDate);
  return byDate;
}

// Every file a day's entries reported (their `files`, see parseJournal in
// server.js), merged per kind and sorted. A file created that day and then
// edited again still counts as created. A file stays created only on the
// day it first appeared: one in `existing` (already there when the day
// began, see journalFilesExistingByDate) that an entry reports as created
// again counts as modified, unless the day also deleted it.
function journalDayFiles(day, existing) {
  const kinds = { created: new Set(), modified: new Set(), deleted: new Set() };
  for (const item of day.entries) {
    for (const kind of Object.keys(kinds)) {
      for (const file of (item.files && item.files[kind]) || []) kinds[kind].add(file);
    }
  }
  for (const file of [...kinds.created]) {
    if (existing.has(file) && !kinds.deleted.has(file)) {
      kinds.created.delete(file);
      kinds.modified.add(file);
    }
  }
  for (const file of kinds.created) kinds.modified.delete(file);
  return Object.fromEntries(Object.entries(kinds).map(([kind, set]) => [kind, [...set].sort()]));
}

// Under a day's entries: the files they reported, all on one wrapping row
// (created, then modified, then deleted), each shown like an Explorer file —
// its icon and name, colored by kind — with the full path on hover, and the
// filter's search words (`terms`) marked in it. Nothing at all for a day
// whose entries reported no files.
function buildJournalDayFiles(name, day, terms) {
  const existing = journalFilesExistingByDate(journalCache[name].days).get(day.date);
  const files = journalDayFiles(day, existing || new Set());
  const kinds = Object.keys(files).filter((kind) => files[kind].length > 0);
  if (kinds.length === 0) return null;
  const wrap = document.createElement("div");
  wrap.className = "journal-files";
  for (const kind of kinds) {
    for (const file of files[kind]) {
      const fileName = file.slice(file.lastIndexOf("/") + 1);
      const item = document.createElement("span");
      item.className = `journal-file ${kind}`;
      item.title = `${file} (${JOURNAL_FILE_KIND_LABELS[kind]})`;
      const icon = document.createElement("span");
      icon.className = "file-tree-icon";
      icon.innerHTML = iconForFileName(fileName);
      const label = document.createElement("span");
      label.className = "journal-file-name";
      appendHighlighted(label, fileName, terms);
      item.append(icon, label);
      wrap.appendChild(item);
    }
  }
  return wrap;
}

// --- Journal filter: the field above the entries. Its search keeps the
// entries whose note, or one of whose reported files, has every word in
// it; its date segment's calendar narrows them to one day or an inclusive
// range of days. Picking takes up to two clicks: the first day filters to
// just that day straight away; a second click turns it into the range
// between the two and closes the calendar.

// `start`–`end` are inclusive "YYYY-MM-DD" bounds, nulls when unset.
function emptyJournalFilter() {
  return { query: "", start: null, end: null };
}

function isJournalFilterActive() {
  return journalFilter.query.trim() !== "" || journalFilter.start !== null;
}

function journalEntryMatches(item, terms) {
  if (terms.length === 0) return true;
  const files = item.files ? Object.values(item.files).flat() : [];
  const haystack = [item.content, ...files].join("\n").toLowerCase();
  return terms.every((term) => haystack.includes(term));
}

// The days the filter lets through, each with only its matching entries.
// `withDates: false` leaves the date range out, for the calendar's dots.
function filterJournalDays(days, { withDates = true } = {}) {
  const terms = filterTerms(journalFilter.query);
  const { start, end } = journalFilter;
  return days
    .filter((day) => !withDates || start === null || (day.date >= start && day.date <= end))
    .map((day) => ({ ...day, entries: day.entries.filter((item) => journalEntryMatches(item, terms)) }))
    .filter((day) => day.entries.length > 0);
}

// "Oct 22, 2026" for one day; "Oct 20 – Oct 24, 2026" for a range within a
// year, with both years spelled out when it spans two.
function formatDateRange({ start, end }) {
  const format = (dateStr, withYear) =>
    parseDateOnly(dateStr).toLocaleDateString(undefined, { month: "short", day: "numeric", ...(withYear && { year: "numeric" }) });
  if (start === end) return format(start, true);
  return `${format(start, start.slice(0, 4) !== end.slice(0, 4))} – ${format(end, true)}`;
}

function closeJournalCalendar() {
  journalCalendarOpen = false;
  journalRangeAnchor = null;
}

// Applies a date range (nulls clear it) and shows its entries from the top
// — the list's carried-over scroll (see renderProjectPage) belonged to
// whatever it showed before.
function setJournalDateRange(start, end) {
  journalFilter.start = start;
  journalFilter.end = end;
  render();
  const list = document.querySelector('[data-scroll-key="journal"]');
  if (list) list.scrollTop = 0;
}

function pickJournalDate(dateStr) {
  if (journalRangeAnchor === null) {
    journalRangeAnchor = dateStr;
    setJournalDateRange(dateStr, dateStr);
    return;
  }
  const [start, end] = [journalRangeAnchor, dateStr].sort();
  closeJournalCalendar();
  setJournalDateRange(start, end);
}

// The calendar opens on the month of the filter's last day, else the newest
// entry's month, else this month.
function initialJournalCalendarMonth(name) {
  const state = journalCache[name];
  const newest = state && !state.error && state.days.length > 0 ? state.days[0].date : null;
  const date = parseDateOnly(journalFilter.end || newest || toDateOnlyString(new Date()));
  return { year: date.getFullYear(), month: date.getMonth() };
}

// The bar above the journal: the search text, a "3 of 27" count of entries
// and a clear-all × (those two only while a filter is set), with the date
// button, which opens buildJournalCalendar, at its right end. Typing applies
// through `onChange` (re-filling just the list — see buildJournalPanel); the
// date button and × go through a full render().
function buildJournalFilterBar(entry, onChange) {
  const dated = journalFilter.start !== null;
  const dateDropdown = buildFilterDateDropdown({
    open: journalCalendarOpen,
    rangeLabel: dated ? formatShortDateRange(journalFilter.start, journalFilter.end) : null,
    title: dated ? `Entries from ${formatDateRange(journalFilter)}` : "Filter entries by date",
    onToggle: () => {
      if (journalCalendarOpen) {
        closeJournalCalendar();
      } else {
        journalCalendarOpen = true;
        journalCalendarMonth = initialJournalCalendarMonth(entry.name);
        openTagsDropdownFor = null;
        closeTaskCalendar();
        taskDueCalendarOpen = false;
        portSwitchOpen = false;
      }
    },
    buildCalendar: () => buildJournalCalendar(entry),
  });
  const filter = buildPanelFilter({
    key: "journal",
    value: journalFilter.query,
    placeholder: "Filter by note or file…",
    label: "Filter journal entries",
    onInput: (query) => {
      journalFilter.query = query;
      onChange();
    },
    onClear: () => {
      journalFilter = emptyJournalFilter();
      closeJournalCalendar();
    },
    segments: [dateDropdown],
  });
  return {
    el: filter.el,
    clear: filter.clear,
    updateStatus(shown, total) {
      const active = isJournalFilterActive();
      filter.updateStatus(active ? `${shown} of ${total}` : null, active);
    },
  };
}

// Sunday first, like the page's other date pickers; two-letter day names in
// the browser's language (2026-01-04 is a Sunday).
const CALENDAR_WEEKDAYS = Array.from({ length: 7 }, (_, i) =>
  new Date(2026, 0, 4 + i).toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2)
);

/// The day a project's folder was created, once projectPathInfo has it.
function projectCreatedDate(name) {
  const info = projectPathInfo[name];
  return info && !info.error && info.created ? toDateOnlyString(new Date(info.created)) : null;
}

// The days the calendar offers: the project's lifetime, from the day it was
// created (its folder's creation date, or its oldest entry's if that's
// earlier) to today (or its newest entry's, if later). `first` is null until
// both of those are known.
function journalCalendarBounds(name) {
  const state = journalCache[name];
  const entryDates = state && !state.error ? state.days.map((d) => d.date) : [];
  const created = projectCreatedDate(name);
  const first = created ? [created, ...entryDates].sort()[0] : null;
  const last = [toDateOnlyString(new Date()), ...entryDates].sort().pop();
  return { first, last };
}

// The quick picks under a calendar: today, the week up to it (or, with
// `lookAhead`, the week from it — for due dates), and this month.
function calendarPresets(lookAhead = false) {
  const now = new Date();
  const day = (offset) => toDateOnlyString(new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset));
  const today = day(0);
  return [
    ["Today", today, today],
    lookAhead ? ["Next 7 days", today, day(6)] : ["Last 7 days", day(-6), today],
    [
      "This month",
      toDateOnlyString(new Date(now.getFullYear(), now.getMonth(), 1)),
      toDateOnlyString(new Date(now.getFullYear(), now.getMonth() + 1, 0)),
    ],
  ];
}

// One month of a date-range picker, shared by the Journal and Tasks filter
// fields — and, picking a single day, by the Tasks composer's due date.
// Days in `counts` carry a dot (hover for
// describeCount's wording), today is outlined, and `range` — the applied
// filter, nulls when there's none — is shaded from its first day to its
// last. While a range is half-picked (`anchor` holds its first day),
// hovering previews it. The months stop at `bounds` and days outside them
// can't be picked; either end may be null for no limit. The line under the
// days explains picking a range, unless `hint` says otherwise (null leaves
// it out). The callers own all
// of this state: the shown month changes through onMonth, a clicked day goes
// to onDay, and a preset or Clear hands its range (nulls to clear) to onRange.
// The preset matching `range` shows as picked.
function buildDateCalendar({ month: shown, range, anchor, bounds, counts, describeCount, presets, hint, onMonth, onDay, onRange }) {
  const { year, month } = shown;
  const today = toDateOnlyString(new Date());
  const shownMonth = toDateOnlyString(new Date(year, month, 1)).slice(0, 7);

  const calendar = document.createElement("div");
  calendar.className = "dropdown-menu date-calendar";

  const head = document.createElement("div");
  head.className = "date-calendar-head";
  const navButton = (icon, label, delta, disabled) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "date-calendar-nav";
    btn.setAttribute("aria-label", label);
    btn.title = label;
    btn.innerHTML = icon;
    btn.disabled = disabled;
    btn.addEventListener("click", () => {
      const shifted = new Date(year, month + delta, 1);
      onMonth({ year: shifted.getFullYear(), month: shifted.getMonth() });
    });
    return btn;
  };
  const title = document.createElement("span");
  title.className = "date-calendar-title";
  title.textContent = new Date(year, month, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  head.append(
    navButton(ICON_CHEVRON_LEFT, "Previous month", -1, bounds.first !== null && shownMonth <= bounds.first.slice(0, 7)),
    title,
    navButton(ICON_CHEVRON_RIGHT, "Next month", 1, bounds.last !== null && shownMonth >= bounds.last.slice(0, 7))
  );
  calendar.appendChild(head);

  const grid = document.createElement("div");
  grid.className = "date-calendar-grid";
  for (const name of CALENDAR_WEEKDAYS) {
    const cell = document.createElement("span");
    cell.className = "date-calendar-weekday";
    cell.textContent = name;
    grid.appendChild(cell);
  }
  const leading = new Date(year, month, 1).getDay();
  const weeks = Math.ceil((leading + new Date(year, month + 1, 0).getDate()) / 7);
  const { start, end } = range;
  for (let i = 0; i < weeks * 7; i++) {
    const date = new Date(year, month, 1 - leading + i);
    const dateStr = toDateOnlyString(date);
    const count = counts.get(dateStr) || 0;
    const inRange = start !== null && dateStr >= start && dateStr <= end;
    const day = document.createElement("button");
    day.type = "button";
    day.className =
      "date-calendar-day" +
      (date.getMonth() !== month ? " outside" : "") +
      (dateStr === today ? " today" : "") +
      (count ? " has-items" : "") +
      (inRange ? " in-range" : "") +
      (dateStr === start ? " range-start" : "") +
      (dateStr === end ? " range-end" : "");
    day.dataset.date = dateStr;
    day.disabled = (bounds.first !== null && dateStr < bounds.first) || (bounds.last !== null && dateStr > bounds.last);
    day.setAttribute("aria-pressed", String(inRange));
    const fullDate = date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    day.setAttribute("aria-label", count ? `${fullDate}, ${describeCount(count)}` : fullDate);
    if (count) day.title = describeCount(count);
    const num = document.createElement("span");
    num.className = "date-calendar-num";
    num.textContent = date.getDate();
    day.appendChild(num);
    day.addEventListener("click", () => onDay(dateStr));
    day.addEventListener("mouseenter", () => {
      if (anchor === null || day.disabled) return;
      const [from, to] = [anchor, dateStr].sort();
      grid.querySelectorAll(".date-calendar-day").forEach((el) => {
        el.classList.toggle("preview", el.dataset.date >= from && el.dataset.date <= to);
        el.classList.toggle("preview-start", el.dataset.date === from);
        el.classList.toggle("preview-end", el.dataset.date === to);
      });
    });
    grid.appendChild(day);
  }
  grid.addEventListener("mouseleave", () => {
    grid.querySelectorAll(".preview").forEach((el) => el.classList.remove("preview", "preview-start", "preview-end"));
  });
  calendar.appendChild(grid);

  const hintText =
    hint !== undefined ? hint : anchor === null ? "Pick a day — or two, for a range" : "Pick another day to make it a range";
  if (hintText) {
    const hintEl = document.createElement("div");
    hintEl.className = "date-calendar-hint";
    hintEl.textContent = hintText;
    calendar.appendChild(hintEl);
  }

  const foot = document.createElement("div");
  foot.className = "date-calendar-foot";
  for (const [label, from, to] of presets) {
    // The preset spanning exactly the applied range shows as picked.
    const picked = from === start && to === end;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "date-calendar-preset" + (picked ? " active" : "");
    btn.setAttribute("aria-pressed", String(picked));
    btn.textContent = label;
    btn.addEventListener("click", () => onRange(from, to));
    foot.appendChild(btn);
  }
  const clearBtn = document.createElement("button");
  clearBtn.type = "button";
  clearBtn.className = "date-calendar-preset clear";
  clearBtn.textContent = "Clear";
  clearBtn.disabled = start === null;
  clearBtn.addEventListener("click", () => onRange(null, null));
  foot.appendChild(clearBtn);
  calendar.appendChild(foot);

  return calendar;
}

// The Journal filter field's calendar: days with entries carry a dot (of
// those its search lets through), and the months stop at the project's
// lifetime (see journalCalendarBounds).
function buildJournalCalendar(entry) {
  const state = journalCache[entry.name];
  const days = state && !state.error ? filterJournalDays(state.days, { withDates: false }) : [];
  return buildDateCalendar({
    month: journalCalendarMonth,
    range: journalFilter,
    anchor: journalRangeAnchor,
    bounds: journalCalendarBounds(entry.name),
    counts: new Map(days.map((d) => [d.date, d.entries.length])),
    describeCount: (n) => `${n} entr${n === 1 ? "y" : "ies"}`,
    presets: calendarPresets(),
    onMonth: (shown) => {
      journalCalendarMonth = shown;
      render();
    },
    onDay: pickJournalDate,
    onRange: (start, end) => {
      closeJournalCalendar();
      setJournalDateRange(start, end);
    },
  });
}

const JOURNAL_NOTE_MAX_LENGTH = 150;

// The Journal panel's bottom input: a textarea with the character counter and
// "Add note" button overlaid inside its own bottom padding (Ctrl/Cmd+Enter
// also submits), so the control reads as built into the box rather than a
// separate row below it. journalDraft holds the in-progress text at module
// level so a full render() triggered by something else never wipes what the
// user is mid-typing here.
function buildJournalComposer(entry, panel) {
  const composer = document.createElement("div");
  composer.className = "journal-composer";

  const wrap = document.createElement("div");
  wrap.className = "journal-input-wrap";

  const textarea = document.createElement("textarea");
  textarea.className = "journal-input";
  textarea.rows = 3;
  textarea.maxLength = JOURNAL_NOTE_MAX_LENGTH;
  textarea.placeholder = "Add a journal note… (Ctrl+Enter to save)";
  textarea.value = journalDraft[entry.name] || "";

  const footer = document.createElement("div");
  footer.className = "journal-input-footer";

  const counter = document.createElement("div");
  counter.className = "journal-counter";
  function updateCounter() {
    counter.textContent = `${textarea.value.length}/${JOURNAL_NOTE_MAX_LENGTH}`;
  }
  updateCounter();

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "journal-add-btn";
  addBtn.textContent = "Add note";
  addBtn.disabled = !textarea.value.trim();
  addBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    addBtn.disabled = true;
    await submitJournalNote(entry, panel);
    addBtn.disabled = !(journalDraft[entry.name] || "").trim();
  });

  textarea.addEventListener("click", (e) => e.stopPropagation());
  textarea.addEventListener("input", () => {
    journalDraft[entry.name] = textarea.value;
    addBtn.disabled = !textarea.value.trim();
    updateCounter();
  });
  textarea.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitJournalNote(entry, panel);
    }
  });

  footer.appendChild(counter);
  footer.appendChild(addBtn);
  wrap.appendChild(textarea);
  wrap.appendChild(footer);
  composer.appendChild(wrap);
  return composer;
}

// Posts the current draft for `entry`, updates the journal cache, and
// re-renders; failures surface via showCardError at the foot of the Journal
// panel. Shared by the composer's Ctrl+Enter shortcut and its "Add note"
// button.
async function submitJournalNote(entry, panel) {
  const content = (journalDraft[entry.name] || "").trim();
  if (!content || journalSubmitting.has(entry.name)) return;
  journalSubmitting.add(entry.name);
  try {
    journalCache[entry.name] = await postJournalEntry(entry.name, content);
    journalDraft[entry.name] = "";
    render();
  } catch (err) {
    showCardError(panel, err.message);
  } finally {
    journalSubmitting.delete(entry.name);
  }
}

// The Tasks panel's content: a flat to-do list (newest first) with a checkbox
// to mark each one done, plus per-row archive/delete actions, a filter bar
// above it, and a composer at the bottom to add a new one. Archived tasks
// stay in tasks.json and are left out of this list until the header's
// "archived" box is checked, where each has an Unarchive button instead —
// so of the two only Delete is something the tab itself can't undo.
function buildTasksPanel(entry, panel) {
  ensureTasksLoaded(entry.name);
  const container = document.createElement("div");
  container.className = "tasks-tab";

  const listEl = document.createElement("div");
  listEl.className = "task-list panel-scroll";
  listEl.dataset.scrollKey = "tasks"; // see renderProjectPage
  const state = taskCache[entry.name];

  if (!state) {
    listEl.appendChild(buildPanelLoading());
  } else if (state.error) {
    // Nothing to add a task to until the list can be read.
    container.appendChild(buildLoadErrorEmpty(entry.name, "Couldn't load tasks", state.error));
    return container;
  } else if (state.tasks.length === 0) {
    listEl.appendChild(
      buildPanelEmpty({ icon: ICON_LIST_CHECK, title: "No tasks yet", text: "Add one below to keep track of what's left to do." })
    );
  } else {
    const visible = tasksForStatusFilter(state.tasks);
    // Re-fills just the list, not the whole page — typing in the filter's
    // search box calls this on every keystroke, and a full render() would
    // rebuild (and so unfocus) that very input.
    const filterBar = buildTaskFilterBar(entry.name, visible, state.tags, fillList);
    container.appendChild(filterBar.el);
    function fillList() {
      listEl.textContent = "";
      const matching = visible.filter((task) => taskMatchesFilter(task, taskFilter));
      if (visible.length === 0) listEl.appendChild(buildPanelEmpty({ icon: ICON_LIST_CHECK, ...noTasksForStatusEmpty() }));
      else if (matching.length === 0) {
        listEl.appendChild(
          buildPanelEmpty({
            icon: ICON_SEARCH,
            title: "No matching tasks",
            text: "No task's ID, title, description, tags or dates match this filter.",
            action: { label: "Clear filter", onClick: filterBar.clear },
          })
        );
      } else matching.forEach((task) => listEl.appendChild(buildTaskRow(entry, task, panel)));
      filterBar.updateStatus(matching.length, visible.length);
    }
    fillList();
  }

  container.appendChild(listEl);
  container.appendChild(buildTaskComposer(entry, panel));
  return container;
}

// Which of the Tasks header's figures a task counts under.
function taskStatus(task) {
  return task.archived ? "archived" : task.done ? "done" : "open";
}

// Open and done start checked in the Tasks header, archived doesn't: an
// archived task stays out of the list until it's asked for.
function defaultTaskStatusFilter() {
  return new Set(["open", "done"]);
}

// The tasks the header's status boxes let through: those under a checked one.
function tasksForStatusFilter(tasks) {
  return tasks.filter((t) => taskStatusFilter.has(taskStatus(t)));
}

// "No archived tasks", "No open or done tasks": the title and line of the
// list's empty state (see buildPanelEmpty) when none of the project's tasks
// are under the checked statuses.
function noTasksForStatusEmpty() {
  if (taskStatusFilter.size === 0) return { title: "No status checked", text: "Check open, done or archived above to list those tasks." };
  const statuses = TASK_STATUSES.filter((s) => taskStatusFilter.has(s));
  return {
    title: `No ${new Intl.ListFormat("en", { type: "disjunction" }).format(statuses)} tasks`,
    text: "Check another status above to see the rest.",
  };
}

// Parsed as a local date (not UTC), same reasoning as buildJournalEntryDate —
// a "YYYY-MM-DD" due date shouldn't drift a day depending on timezone.
function parseDateOnly(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatDueDate(dateStr) {
  return parseDateOnly(dateStr).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

function isTaskOverdue(task) {
  if (!task.dueDate || task.done) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return parseDateOnly(task.dueDate) < today;
}

// A Date as a local "YYYY-MM-DD" — the inverse of parseDateOnly, so a task's
// createdAt timestamp compares against the date filter's days by the day it
// was added here, not the UTC day.
function toDateOnlyString(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

// `dateField` is which of a task's dates the `start`–`end` range (inclusive
// "YYYY-MM-DD" bounds, nulls when unset) is matched against — the calendar's
// Due date/Date added toggle — and survives clearing, so it stays where the
// user left it.
function emptyTaskFilter(dateField = "due") {
  return { query: "", tags: new Set(), dateField, start: null, end: null };
}

function isTaskFilterActive(filter) {
  return filter.query.trim() !== "" || filter.tags.size > 0 || filter.start !== null;
}

// The day a task counts as for a date field: its due date (null when it has
// none), or the day it was added here.
function taskFilterDate(task, dateField) {
  return dateField === "due" ? task.dueDate || null : toDateOnlyString(new Date(task.createdAt));
}

// Every filter that's set must match (AND). The search text is split into
// words, each of which has to appear somewhere in the task's id, title,
// description or tag names, in any order; picked tags must all be on the
// task; a date range must take in its due date, or the day it was added.
function taskMatchesFilter(task, filter) {
  const terms = filterTerms(filter.query);
  if (terms.length > 0) {
    const haystack = [task.id, task.title, task.description || "", ...(task.tags || [])].join("\n").toLowerCase();
    if (!terms.every((term) => haystack.includes(term))) return false;
  }
  if (filter.tags.size > 0) {
    const taskTags = new Set((task.tags || []).map((t) => t.toLowerCase()));
    for (const tag of filter.tags) {
      if (!taskTags.has(tag.toLowerCase())) return false;
    }
  }
  if (filter.start !== null) {
    const taskDate = taskFilterDate(task, filter.dateField);
    if (taskDate === null || taskDate < filter.start || taskDate > filter.end) return false;
  }
  return true;
}

// --- Tasks date filter: the filter field's date button opens the same
// calendar as the Journal's, picking one day or a range the same way.

function closeTaskCalendar() {
  taskCalendarOpen = false;
  taskRangeAnchor = null;
}

// Applies a date range (nulls clear it) and shows the matching tasks from
// the top, same as setJournalDateRange.
function setTaskDateRange(start, end) {
  taskFilter.start = start;
  taskFilter.end = end;
  render();
  const list = document.querySelector('[data-scroll-key="tasks"]');
  if (list) list.scrollTop = 0;
}

function pickTaskDate(dateStr) {
  if (taskRangeAnchor === null) {
    taskRangeAnchor = dateStr;
    setTaskDateRange(dateStr, dateStr);
    return;
  }
  const [start, end] = [taskRangeAnchor, dateStr].sort();
  closeTaskCalendar();
  setTaskDateRange(start, end);
}

// The calendar opens on this month while the range takes in today (so
// "Next 7 days" running into next month opens where it starts), else on
// the month of the range's last day, else this month.
function initialTaskCalendarMonth() {
  const today = toDateOnlyString(new Date());
  const { start, end } = taskFilter;
  const date = parseDateOnly(end !== null && !(start <= today && today <= end) ? end : today);
  return { year: date.getFullYear(), month: date.getMonth() };
}

// "Oct 22", "Oct 20 – 24", "Oct 28 – Nov 3": the date button's short label,
// with years only once the range leaves this year. formatDateRange's full
// version goes in the button's tooltip.
function formatShortDateRange(start, end) {
  const thisYear = String(new Date().getFullYear());
  const withYear = start.slice(0, 4) !== thisYear || end.slice(0, 4) !== thisYear;
  const format = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", ...(withYear && { year: "numeric" }) });
  return format.formatRange(parseDateOnly(start), parseDateOnly(end));
}

// The Tasks calendar: a Due date / Date added toggle on top choosing which
// of a task's dates the picked days match, over a buildDateCalendar that
// dots each day with tasks on it (of those the search and tags let through).
// Due dates can fall on any day; added dates stay within the project's
// lifetime, the way the Journal's entries do (see journalCalendarBounds).
function buildTaskCalendar(name, tasks) {
  const field = taskFilter.dateField;
  const undated = { ...taskFilter, start: null, end: null };
  const counts = new Map();
  for (const task of tasks) {
    const date = taskFilterDate(task, field);
    if (date && taskMatchesFilter(task, undated)) counts.set(date, (counts.get(date) || 0) + 1);
  }
  let bounds = { first: null, last: null };
  if (field === "added") {
    const addedDates = tasks.map((task) => taskFilterDate(task, "added"));
    const created = projectCreatedDate(name);
    bounds = {
      first: created ? [created, ...addedDates].sort()[0] : null,
      last: [toDateOnlyString(new Date()), ...addedDates].sort().pop(),
    };
  }

  const calendar = buildDateCalendar({
    month: taskCalendarMonth,
    range: taskFilter,
    anchor: taskRangeAnchor,
    bounds,
    counts,
    describeCount: (n) => `${n} task${n === 1 ? "" : "s"} ${field === "due" ? "due" : "added"}`,
    presets: calendarPresets(field === "due"),
    onMonth: (shown) => {
      taskCalendarMonth = shown;
      render();
    },
    onDay: pickTaskDate,
    onRange: (start, end) => {
      closeTaskCalendar();
      setTaskDateRange(start, end);
    },
  });

  const seg = document.createElement("div");
  seg.className = "task-filter-seg";
  seg.setAttribute("role", "group");
  seg.setAttribute("aria-label", "Date to filter by");
  for (const [value, label] of [
    ["due", "Due date"],
    ["added", "Date added"],
  ]) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "task-filter-seg-btn" + (value === field ? " active" : "");
    btn.textContent = label;
    btn.setAttribute("aria-pressed", String(value === field));
    btn.addEventListener("click", () => {
      if (value === field) return;
      taskFilter.dateField = value;
      taskRangeAnchor = null;
      render();
    });
    seg.appendChild(btn);
  }
  calendar.prepend(seg);
  return calendar;
}

// The Tasks filter field's date segment: "Date", or the picked range
// ("Due Oct 20 – 24") once there is one.
function buildTaskDateDropdown(name, tasks) {
  const active = taskFilter.start !== null;
  const fieldLabel = taskFilter.dateField === "due" ? "Due" : "Added";
  return buildFilterDateDropdown({
    open: taskCalendarOpen,
    rangeLabel: active ? `${fieldLabel} ${formatShortDateRange(taskFilter.start, taskFilter.end)}` : null,
    title: active ? `Tasks ${fieldLabel.toLowerCase()} ${formatDateRange(taskFilter)}` : "Filter by due date or date added",
    onToggle: () => {
      if (taskCalendarOpen) {
        closeTaskCalendar();
      } else {
        taskCalendarOpen = true;
        taskCalendarMonth = initialTaskCalendarMonth();
        openTagsDropdownFor = null;
        closeJournalCalendar();
        taskDueCalendarOpen = false;
        portSwitchOpen = false;
      }
    },
    buildCalendar: () => buildTaskCalendar(name, tasks),
  });
}

// The bar above the task list: the search text, a "3 of 27" count and a
// clear-all × (those two only while a filter is set), with the tags
// dropdown and the date button as segments at its right end. Typing applies
// through `onChange` (re-filling just the list — see buildTasksPanel); the
// dropdowns and × go through a full render() like every other dropdown,
// which rebuilds this bar from taskFilter anyway.
function buildTaskFilterBar(name, tasks, knownTags, onChange) {
  const tagsDropdown = buildTagsDropdown(knownTags, taskFilter.tags, "filter", { allowNewTags: false });
  tagsDropdown.querySelector(".tags-toggle").classList.toggle("active", taskFilter.tags.size > 0);
  const filter = buildPanelFilter({
    key: "tasks",
    value: taskFilter.query,
    placeholder: "Filter by ID, title, description or tag…",
    label: "Filter tasks",
    onInput: (query) => {
      taskFilter.query = query;
      onChange();
    },
    onClear: () => {
      taskFilter = emptyTaskFilter(taskFilter.dateField);
      closeTaskCalendar();
      openTagsDropdownFor = null;
    },
    segments: [tagsDropdown, buildTaskDateDropdown(name, tasks)],
  });
  return {
    el: filter.el,
    clear: filter.clear,
    updateStatus(shown, total) {
      const active = isTaskFilterActive(taskFilter);
      filter.updateStatus(active ? `${shown} of ${total}` : null, active);
    },
  };
}

// --- Panel filter fields: the Explorer, Tasks and Journal panels each have
// one above their list (see buildPanelFilter).

// A search's words, lowercased. Each has to turn up somewhere, in any
// order, for something to match.
function filterTerms(query) {
  return query.toLowerCase().split(/\s+/).filter(Boolean);
}

// Appends `text` to `el` with every place one of `terms` turns up wrapped in
// a .filter-match mark, overlapping finds merged into one. Plain text when
// lowercasing changes its length (a few non-English letters), since the
// places found in the lowercased copy wouldn't line up with it.
function appendHighlighted(el, text, terms) {
  const lower = text.toLowerCase();
  if (lower.length !== text.length) {
    el.append(text);
    return;
  }
  const ranges = [];
  for (const term of terms) {
    for (let i = lower.indexOf(term); i !== -1; i = lower.indexOf(term, i + term.length)) {
      ranges.push([i, i + term.length]);
    }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  let pos = 0;
  for (let i = 0; i < ranges.length; i++) {
    let [start, end] = ranges[i];
    if (start < pos) continue;
    while (i + 1 < ranges.length && ranges[i + 1][0] <= end) end = Math.max(end, ranges[++i][1]);
    if (start > pos) el.append(text.slice(pos, start));
    const mark = document.createElement("mark");
    mark.className = "filter-match";
    mark.textContent = text.slice(start, end);
    el.appendChild(mark);
    pos = end;
  }
  if (pos < text.length) el.append(text.slice(pos));
}

// A panel's filter field: a search icon and box, then a status (a count)
// and a clear-all ×, each shown only when updateStatus says, then
// `segments` — dropdowns like Tasks' tags and date — at its right end.
// Typing hands the text to `onInput`, and Escape empties a non-empty box
// the same way (the document-level Escape handler leaves the page alone
// while focus is in a field). The × runs `onClear` to reset the panel's
// filter, then a full render() rebuilds the field from it and focus goes
// back to the box. `key` names the field for that, and for
// renderProjectPage, which keeps a focused box focused across a render().
function buildPanelFilter({ key, value, placeholder, label, onInput, onClear, segments = [] }) {
  const bar = document.createElement("div");
  bar.className = "panel-filter";
  bar.innerHTML =
    `<svg class="panel-filter-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">` +
    `<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>`;

  const focusKey = `${key}-filter`;
  const input = document.createElement("input");
  input.type = "text";
  input.className = "panel-filter-input";
  input.placeholder = placeholder;
  input.setAttribute("aria-label", label);
  input.autocomplete = "off";
  input.value = value;
  input.dataset.focusKey = focusKey;
  bar.appendChild(input);

  const status = document.createElement("span");
  status.className = "panel-filter-status";
  status.hidden = true;
  bar.appendChild(status);

  const clearBtn = document.createElement("button");
  clearBtn.type = "button";
  clearBtn.className = "panel-filter-clear";
  clearBtn.setAttribute("aria-label", "Clear all filters");
  clearBtn.title = "Clear all filters";
  clearBtn.hidden = true;
  clearBtn.innerHTML =
    `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
  bar.appendChild(clearBtn);

  for (const segment of segments) bar.appendChild(segment);

  input.addEventListener("click", (e) => e.stopPropagation());
  input.addEventListener("input", () => onInput(input.value));
  input.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && input.value) {
      e.stopPropagation();
      input.value = "";
      onInput("");
    }
  });
  // Clears every filter and puts the cursor back in the box, for the × and
  // for an empty list's Clear filter (see buildPanelEmpty).
  function clear() {
    onClear();
    render();
    const box = document.querySelector(`[data-focus-key="${focusKey}"]`);
    if (box) box.focus();
  }
