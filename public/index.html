  clearBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    clear();
  });

  return {
    el: bar,
    clear,
    // `text` (a count) shows when there is one, the × whenever `active`.
    updateStatus(text, active) {
      status.textContent = text || "";
      status.hidden = !text;
      clearBtn.hidden = !active;
    },
  };
}

// A filter field's date segment: a calendar icon and "Date", or
// `rangeLabel` once a range is picked, over the menu `buildCalendar` makes.
// The caller owns whether it's open — the toggle runs `onToggle`, then
// render(), the same way every other dropdown here opens (see
// positionOpenDropdowns).
function buildFilterDateDropdown({ open, rangeLabel, title, onToggle, buildCalendar }) {
  const dropdown = document.createElement("div");
  dropdown.className = "dropdown filter-date-dropdown" + (open ? " open" : "");
  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "dropdown-toggle filter-date-toggle" + (rangeLabel ? " active" : "");
  toggle.setAttribute("aria-expanded", String(open));
  toggle.title = title;
  toggle.innerHTML = ICON_CALENDAR;
  const label = document.createElement("span");
  label.className = "filter-date-label";
  label.textContent = rangeLabel || "Date";
  toggle.appendChild(label);
  toggle.insertAdjacentHTML(
    "beforeend",
    `<svg class="dropdown-caret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">` +
      `<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  );
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    onToggle();
    render();
  });
  dropdown.appendChild(toggle);
  if (open) dropdown.appendChild(buildCalendar());
  return dropdown;
}

const TAG_MAX_LENGTH = 30;

function getTaskTagsDraft(name) {
  if (!taskTagsDraft[name]) taskTagsDraft[name] = new Set();
  return taskTagsDraft[name];
}

// Removes any member of `selected` that case-insensitively matches `tag` —
// selected tags are added under a dropdown option's exact (canonical) label,
// but this makes toggling off robust even if a caller ever passes a
// differently-cased variant of the same tag.
function removeTagCaseInsensitive(selected, tag) {
  const key = tag.toLowerCase();
  for (const t of selected) {
    if (t.toLowerCase() === key) selected.delete(t);
  }
}

// A custom checkbox-list dropdown for picking a task's tags, shared by the
// composer (creating a task) and the inline edit form (editing one) — same
// `.dropdown`/`.dropdown-menu`/checkboxIcon() shell the Filter dropdown uses.
// `knownTags` is the project's persisted tag list; `selected` is the Set
// being built up by this particular form. A tag typed into "New tag…" is
// just added straight to `selected` — it only becomes a real project tag
// once the task is actually saved (see mergeKnownTags on the server).
// `allowNewTags: false` drops the "New tag…" row, for the Tasks panel's filter
// bar — filtering by a tag no task has yet can only ever match nothing.
function buildTagsDropdown(knownTags, selected, dropdownKey, { allowNewTags = true } = {}) {
  const wrap = document.createElement("div");
  wrap.className = "dropdown tags-dropdown" + (openTagsDropdownFor === dropdownKey ? " open" : "");

  const toggleBtn = document.createElement("button");
  toggleBtn.type = "button";
  toggleBtn.className = "dropdown-toggle tags-toggle";
  toggleBtn.dataset.dropdownKey = dropdownKey; // lets findOpenTagsToggle() locate this on scroll
  toggleBtn.innerHTML =
    `<span>Tags${selected.size ? ` (${selected.size})` : ""}</span>` +
    `<svg class="dropdown-caret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">` +
    `<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  toggleBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    openTagsDropdownFor = openTagsDropdownFor === dropdownKey ? null : dropdownKey;
    closeJournalCalendar();
    closeTaskCalendar();
    taskDueCalendarOpen = false;
    portSwitchOpen = false;
    render();
  });
  wrap.appendChild(toggleBtn);

  if (openTagsDropdownFor === dropdownKey) {
    const menu = document.createElement("div");
    // Portaled straight onto <body> instead of nested under `wrap`, and
    // placed with fixed coordinates by positionPortalMenu — so the Tasks
    // panel's fixed height and scrolling list can never clip it or stretch
    // around it, and it can be clamped to the window from any side.
    menu.className = "dropdown-menu portal-menu";

    // Known tags plus any not-yet-saved tag this form already has selected,
    // so a freshly-typed tag shows up checked immediately.
    const allTags = knownTags.slice();
    for (const tag of selected) {
      if (!allTags.some((k) => k.toLowerCase() === tag.toLowerCase())) allTags.push(tag);
    }

    const optionsEl = document.createElement("div");
    optionsEl.className = "dropdown-scroll";
    menu.appendChild(optionsEl);

    if (allTags.length === 0) {
      const empty = document.createElement("div");
      empty.className = "dropdown-empty";
      empty.textContent = "No tags yet.";
      optionsEl.appendChild(empty);
    } else {
      for (const tag of allTags) {
        const on = [...selected].some((t) => t.toLowerCase() === tag.toLowerCase());
        const opt = document.createElement("button");
        opt.type = "button";
        opt.className = "dropdown-option";
        opt.innerHTML = `<span class="dropdown-option-content">${checkboxIcon(on)}<span class="label">${tag}</span></span>`;
        opt.addEventListener("click", (e) => {
          e.stopPropagation();
          if (on) removeTagCaseInsensitive(selected, tag);
          else selected.add(tag);
          render();
        });
        optionsEl.appendChild(opt);
      }
    }

    if (allowNewTags) {
      menu.appendChild(Object.assign(document.createElement("div"), { className: "dropdown-divider" }));

      const newTagRow = document.createElement("div");
      newTagRow.className = "dropdown-new-tag";
      const newTagInput = document.createElement("input");
      newTagInput.type = "text";
      newTagInput.className = "dropdown-new-tag-input";
      newTagInput.maxLength = TAG_MAX_LENGTH;
      newTagInput.placeholder = "New tag…";
      const addTagBtn = document.createElement("button");
      addTagBtn.type = "button";
      addTagBtn.className = "dropdown-new-tag-btn";
      addTagBtn.textContent = "Add";
      function submitNewTag() {
        const tag = newTagInput.value.trim();
        if (!tag) return;
        selected.add(tag);
        newTagInput.value = "";
        render();
      }
      newTagInput.addEventListener("click", (e) => e.stopPropagation());
      newTagInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          submitNewTag();
        }
      });
      addTagBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        submitNewTag();
      });
      newTagRow.appendChild(newTagInput);
      newTagRow.appendChild(addTagBtn);
      menu.appendChild(newTagRow);
    }

    document.body.appendChild(menu);
    // toggleBtn isn't connected/laid out yet at this point — buildTagsDropdown
    // only returns a detached subtree for its caller to insert — so the real
    // position has to be measured a frame later, once it actually is.
    requestAnimationFrame(() => positionPortalMenu(toggleBtn, menu));
  }

  return wrap;
}

// Places a portaled dropdown menu (see buildTagsDropdown) next to its
// toggle, kept inside dropdownBounds() — the same placeDropdown()
// decision positionOpenDropdowns() applies to every other (non-portaled)
// dropdown via CSS classes, just turned into fixed coordinates here since
// this menu has no positioned ancestor to anchor to.
function positionPortalMenu(toggleEl, menu) {
  const toggleRect = toggleEl.getBoundingClientRect();
  menu.style.minWidth = `${toggleRect.width}px`;
  menu.style.maxHeight = ""; // measure its natural height, not a cap left over from the last placement
  const menuRect = menu.getBoundingClientRect();
  const bounds = dropdownBounds(toggleEl);

  const place = placeDropdown(toggleRect, menuRect, bounds);
  const height = place.maxHeight === null ? menuRect.height : Math.min(menuRect.height, place.maxHeight);
  if (place.maxHeight !== null) menu.style.maxHeight = `${place.maxHeight}px`;
  menu.style.top = place.above ? `${toggleRect.top - DROPDOWN_GAP - height}px` : `${toggleRect.bottom + DROPDOWN_GAP}px`;

  // Unlike a nested menu, this one can be nudged freely, so instead of just
  // right-aligning it's also clamped — a wide menu under a narrow toggle
  // near the window's left edge still lands fully inside.
  const preferredLeft = place.alignRight ? toggleRect.right - menuRect.width : toggleRect.left;
  const maxLeft = Math.max(bounds.left, bounds.right - menuRect.width);
  menu.style.left = `${Math.min(Math.max(preferredLeft, bounds.left), maxLeft)}px`;
}

// Finds the .tags-toggle button matching whichever dropdown is currently
// open (there's at most one, since openTagsDropdownFor is a single value) —
// used to reposition its portaled menu on scroll, when the caller doesn't
// already have a direct reference to that button.
function findOpenTagsToggle() {
  return [...document.querySelectorAll(".tags-toggle")].find((el) => el.dataset.dropdownKey === openTagsDropdownFor);
}

// The task's short id as a badge with a copy icon inside it after the code;
// clicking the badge copies the id. As feedback, "Copied" briefly replaces the
// code and the icon turns into a checkmark, like the Raw JSON tab's copy
// button.
function buildTaskCodeBadge(task, panel) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "task-copy";
  btn.title = "Copy task ID";
  btn.setAttribute("aria-label", `Copy task ID ${task.id}`);
  const code = document.createElement("span");
  code.className = "task-code";
  code.textContent = task.id;
  const icon = document.createElement("span");
  icon.className = "task-copy-icon";
  icon.innerHTML = ICON_TASK_COPY;
  btn.append(code, icon);
  let resetTimer = null;
  btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      await navigator.clipboard.writeText(task.id);
      clearTimeout(resetTimer);
      code.textContent = "Copied";
      icon.innerHTML = ICON_CHECK;
      btn.classList.add("copied");
      resetTimer = setTimeout(() => {
        code.textContent = task.id;
        icon.innerHTML = ICON_TASK_COPY;
        btn.classList.remove("copied");
      }, 1200);
    } catch (err) {
      showCardError(panel, `Copy failed: ${err.message}`);
    }
  });
  return btn;
}

function buildTaskRow(entry, task, panel) {
  const isEditingThis = editingTaskId === task.id;
  // Disabled either because a request against it is actually in flight, or
  // because its data is sitting unsaved in the composer below — checking
  // done/archiving/deleting it from here while that's true would race (or
  // silently conflict) with whatever Save changes/Cancel ends up doing.
  const isDisabled = taskUpdating.has(task.id) || isEditingThis;
  const row = document.createElement("div");
  row.className = "task-row" + (task.done ? " done" : "") + (isEditingThis ? " editing" : "") + (isDisabled ? " disabled" : "");
  row.dataset.taskId = task.id; // lets refreshTaskRowDisabled() find this row directly, without a full render()

  const checkbox = document.createElement("input");
  checkbox.type = "checkbox";
  checkbox.checked = task.done;
  checkbox.disabled = isDisabled;
  checkbox.setAttribute("aria-label", task.done ? "Mark task not done" : "Mark task done");
  checkbox.addEventListener("click", (e) => e.stopPropagation());
  checkbox.addEventListener("change", () => updateTask(entry, task.id, { done: checkbox.checked }, panel));
  row.appendChild(decorateCheckbox(checkbox));

  const main = document.createElement("div");
  main.className = "task-main";

  const title = document.createElement("div");
  title.className = "task-title";
  title.textContent = task.title;
  main.appendChild(title);

  if (task.description) {
    const description = document.createElement("div");
    description.className = "task-description";
    description.textContent = task.description;
    main.appendChild(description);
  }

  // Two meta rows: the task's dates on top — added, due, then when it was
  // archived or else marked done (left out for tasks finished before those
  // stamps existed) — and its ID badge and tags under them.
  const dates = document.createElement("div");
  dates.className = "task-meta task-dates";
  const addDate = (text, className) => {
    if (dates.childElementCount > 0) {
      const sep = document.createElement("span");
      sep.className = "task-meta-sep";
      sep.textContent = "•";
      dates.appendChild(sep);
    }
    const part = document.createElement("span");
    if (className) part.className = className;
    part.textContent = text;
    dates.appendChild(part);
  };
  addDate(`Added ${formatTimestamp(task.createdAt)}`);
  if (task.dueDate) addDate(`Due ${formatDueDate(task.dueDate)}`, "task-due" + (isTaskOverdue(task) ? " overdue" : ""));
  if (task.archived && task.archivedAt) addDate(`Archived ${formatTimestamp(task.archivedAt)}`);
  else if (task.done && task.doneAt) addDate(`Marked as done ${formatTimestamp(task.doneAt)}`);
  main.appendChild(dates);

  const meta = document.createElement("div");
  meta.className = "task-meta";
  meta.appendChild(buildTaskCodeBadge(task, panel));
  (task.tags || []).forEach((tag) => {
    const tagEl = document.createElement("span");
    tagEl.className = "task-tag";
    tagEl.textContent = `#${tag}`;
    meta.appendChild(tagEl);
  });
  main.appendChild(meta);

  row.appendChild(main);

  const end = document.createElement("div");
  end.className = "task-end";

  const editBtn = document.createElement("button");
  editBtn.type = "button";
  editBtn.className = "task-action-btn" + (isEditingThis ? " active" : "");
  editBtn.disabled = isDisabled;
  editBtn.setAttribute("aria-label", "Edit task");
  editBtn.title = "Edit task";
  editBtn.innerHTML = ICON_EDIT;
  editBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    // No inline editing — load this task's data into the composer at the
    // bottom of the tab instead, same fields, so editing and adding a task
    // share one form. Enter/Save-changes there PATCHes this task's id.
    editingTaskId = task.id;
    editingTaskProject = entry.name;
    taskTitleDraft[entry.name] = task.title;
    taskDescriptionDraft[entry.name] = task.description || "";
    taskDueDraft[entry.name] = task.dueDate || "";
    taskTagsDraft[entry.name] = new Set(task.tags || []);
    taskDueCalendarOpen = false;
    render();
    requestAnimationFrame(() => {
      const el = document.querySelector(".task-title-input");
      if (el) {
        el.focus();
        el.select();
        el.scrollIntoView({ block: "nearest" });
      }
    });
  });
  end.appendChild(editBtn);

  // An archived task (shown once the header's "archived" box is checked)
  // gets Unarchive here instead, putting it back among the open/done ones.
  const archiveLabel = task.archived ? "Unarchive task" : "Archive task";
  const archiveBtn = document.createElement("button");
  archiveBtn.type = "button";
  archiveBtn.className = "task-action-btn";
  archiveBtn.disabled = isDisabled;
  archiveBtn.setAttribute("aria-label", archiveLabel);
  archiveBtn.title = archiveLabel;
  archiveBtn.innerHTML = task.archived ? ICON_UNARCHIVE : ICON_ARCHIVE;
  archiveBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    updateTask(entry, task.id, { archived: !task.archived }, panel);
  });
  end.appendChild(archiveBtn);

  const deleteBtn = document.createElement("button");
  deleteBtn.type = "button";
  deleteBtn.className = "task-action-btn";
  deleteBtn.disabled = isDisabled;
  deleteBtn.setAttribute("aria-label", "Delete task");
  deleteBtn.title = "Delete task";
  deleteBtn.innerHTML = ICON_TRASH;
  deleteBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    removeTask(entry, task.id, panel);
  });
  end.appendChild(deleteBtn);

  row.appendChild(end);
  return row;
}

const TASK_TITLE_MAX_LENGTH = 80;
const TASK_DESCRIPTION_MAX_LENGTH = 500;

// Clears the composer's draft state for `name` and exits edit mode — called
// when an edit is explicitly canceled, or abandoned by leaving the page.
// Doesn't render(); callers do that themselves alongside whatever else
// they're changing.
function cancelTaskEdit(name) {
  editingTaskId = null;
  editingTaskProject = null;
  taskTitleDraft[name] = "";
  taskDescriptionDraft[name] = "";
  taskDueDraft[name] = "";
  taskTagsDraft[name] = new Set();
  taskDueCalendarOpen = false;
}

// The Tasks panel's bottom composer: a one-line title input (required — Enter
// there moves on to the description) above a description textarea
// (optional) whose bottom strip holds the optional due date, the tags
// dropdown, and the Add/Save button; Ctrl+Enter in either field submits.
// taskTitleDraft/taskDescriptionDraft/taskDueDraft/taskTagsDraft hold the
// in-progress values at module level so a full render() triggered by
// something else never wipes what's mid-entry.
// Doubles as the edit form: clicking a task row's edit button loads that
// task's fields in here (see buildTaskRow) instead of editing inline, so
// there's exactly one place with this add/edit UI rather than two.
function buildTaskComposer(entry, panel) {
  const isEditing = editingTaskId !== null && editingTaskProject === entry.name;

  const composer = document.createElement("div");
  composer.className = "task-composer";

  const titleInput = document.createElement("input");
  titleInput.type = "text";
  titleInput.className = "task-input task-title-input";
  titleInput.maxLength = TASK_TITLE_MAX_LENGTH;
  titleInput.placeholder = isEditing ? "Task title" : "Add a task title…";
  titleInput.value = taskTitleDraft[entry.name] || "";
  composer.appendChild(titleInput);

  // Same box as the Journal panel's composer — a textarea with its controls
  // tucked into its own bottom padding — except Journal only ever has to
  // fit a counter and one button down there; this one also has the due
  // date picker and the tags dropdown, so that reserved strip is taller.
  const inputWrap = document.createElement("div");
  inputWrap.className = "task-composer-input-wrap";

  const input = document.createElement("textarea");
  input.className = "task-input task-composer-input";
  input.rows = 3;
  input.maxLength = TASK_DESCRIPTION_MAX_LENGTH;
  input.placeholder = isEditing ? "Description (optional)… (Ctrl+Enter to save)" : "Description (optional)… (Ctrl+Enter to add)";
  input.value = taskDescriptionDraft[entry.name] || "";
  inputWrap.appendChild(input);

  const footer = document.createElement("div");
  footer.className = "task-composer-footer";

  const counter = document.createElement("div");
  counter.className = "task-composer-counter";
  function updateCounter() {
    counter.textContent = `${input.value.length}/${TASK_DESCRIPTION_MAX_LENGTH}`;
  }
  updateCounter();
  footer.appendChild(counter);

  const footerRow = document.createElement("div");
  footerRow.className = "task-composer-footer-row";

  footerRow.appendChild(buildTaskDueDropdown(entry.name));

  const knownTags = (taskCache[entry.name] && taskCache[entry.name].tags) || [];
  const tagsDropdown = buildTagsDropdown(knownTags, getTaskTagsDraft(entry.name), "composer");
  tagsDropdown.classList.add("tags-dropdown-grow");
  footerRow.appendChild(tagsDropdown);

  if (isEditing) {
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "cancel-btn";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      cancelTaskEdit(entry.name);
      render();
    });
    footerRow.appendChild(cancelBtn);
  }

  const addBtn = document.createElement("button");
  addBtn.type = "button";
  addBtn.className = "task-add-btn";
  addBtn.textContent = isEditing ? "Save changes" : "Add task";
  addBtn.disabled = !titleInput.value.trim();
  addBtn.addEventListener("click", async (e) => {
    e.stopPropagation();
    addBtn.disabled = true;
    await submitTask(entry, panel);
    addBtn.disabled = !(taskTitleDraft[entry.name] || "").trim();
  });
  footerRow.appendChild(addBtn);

  footer.appendChild(footerRow);
  inputWrap.appendChild(footer);
  composer.appendChild(inputWrap);

  // Shared by both fields: Ctrl+Enter submits, Escape abandons an edit.
  function handleSubmitOrCancelKey(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      submitTask(entry, panel);
      return true;
    }
    if (e.key === "Escape" && isEditing) {
      e.preventDefault();
      cancelTaskEdit(entry.name);
      render();
      return true;
    }
    return false;
  }

  titleInput.addEventListener("click", (e) => e.stopPropagation());
  titleInput.addEventListener("input", () => {
    taskTitleDraft[entry.name] = titleInput.value;
    addBtn.disabled = !titleInput.value.trim();
  });
  titleInput.addEventListener("keydown", (e) => {
    if (handleSubmitOrCancelKey(e)) return;
    if (e.key === "Enter") {
      e.preventDefault();
      input.focus();
    }
  });

  input.addEventListener("click", (e) => e.stopPropagation());
  input.addEventListener("input", () => {
    taskDescriptionDraft[entry.name] = input.value;
    updateCounter();
  });
  input.addEventListener("keydown", handleSubmitOrCancelKey);

  return composer;
}

// The composer's due date: a calendar icon and "Due date", or the picked
// day, over the same calendar the filter fields open (buildDateCalendar) —
// picking a single day here, which closes it. Days other open tasks are due
// carry a dot, so it's easy to see what a day already holds. The day lives
// in taskDueDraft with the rest of the draft.
function buildTaskDueDropdown(name) {
  const due = taskDueDraft[name] || null;
  const dropdown = document.createElement("div");
  dropdown.className = "dropdown task-due-dropdown" + (taskDueCalendarOpen ? " open" : "");
  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "dropdown-toggle task-due-toggle" + (due ? " active" : "");
  toggle.setAttribute("aria-expanded", String(taskDueCalendarOpen));
  toggle.title = due ? `Due ${formatDueDate(due)}` : "Due date (optional)";
  toggle.innerHTML = ICON_CALENDAR;
  const label = document.createElement("span");
  label.className = "task-due-label";
  label.textContent = due ? `Due ${formatShortDateRange(due, due)}` : "Due date";
  toggle.appendChild(label);
  toggle.insertAdjacentHTML(
    "beforeend",
    `<svg class="dropdown-caret" viewBox="0 0 10 6" width="10" height="6" aria-hidden="true">` +
      `<path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  );
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    if (taskDueCalendarOpen) {
      taskDueCalendarOpen = false;
    } else {
      taskDueCalendarOpen = true;
      const shown = parseDateOnly(due || toDateOnlyString(new Date()));
      taskDueCalendarMonth = { year: shown.getFullYear(), month: shown.getMonth() };
      openTagsDropdownFor = null;
      closeJournalCalendar();
      closeTaskCalendar();
      portSwitchOpen = false;
    }
    render();
  });
  dropdown.appendChild(toggle);
  if (taskDueCalendarOpen) dropdown.appendChild(buildTaskDueCalendar(name, due));
  return dropdown;
}

function buildTaskDueCalendar(name, due) {
  const state = taskCache[name];
  const counts = new Map();
  for (const task of state && !state.error ? state.tasks : []) {
    // The task being edited is the one this picks for, not another one due.
    if (!task.dueDate || task.done || task.archived || task.id === editingTaskId) continue;
    counts.set(task.dueDate, (counts.get(task.dueDate) || 0) + 1);
  }
  const now = new Date();
  const day = (offset) => toDateOnlyString(new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset));
  const pick = (dateStr) => {
    taskDueDraft[name] = dateStr || "";
    taskDueCalendarOpen = false;
    render();
  };
  return buildDateCalendar({
    month: taskDueCalendarMonth,
    range: { start: due, end: due },
    anchor: null,
    bounds: { first: null, last: null },
    counts,
    describeCount: (n) => `${countLabel(n, "open task")} due`,
    presets: [
      ["Today", day(0), day(0)],
      ["Tomorrow", day(1), day(1)],
      ["In a week", day(7), day(7)],
    ],
    hint: null,
    onMonth: (shown) => {
      taskDueCalendarMonth = shown;
      render();
    },
    onDay: pick,
    onRange: pick, // a preset's one day, or null from Clear
  });
}

// Posts (or, mid-edit, PATCHes) the current draft for `entry`, updates the
// task cache, and re-renders; failures surface via showCardError, same as
// submitJournalNote.
async function submitTask(entry, panel) {
  const title = (taskTitleDraft[entry.name] || "").trim();
  const description = (taskDescriptionDraft[entry.name] || "").trim();
  if (!title || taskSubmitting.has(entry.name)) return;
  taskSubmitting.add(entry.name);
  // Editing an existing task is a PATCH against its own id — disable that
  // row for the duration, same as any other in-flight change to it. (It's
  // already showing disabled from being loaded in the composer at all —
  // see buildTaskRow — this only matters for the moment right after a
  // failed save, when editingTaskId is still set but taskUpdating no longer
  // is; refreshTaskRowDisabled re-checks both, so it stays disabled either way.)
  const editingId = editingTaskId !== null && editingTaskProject === entry.name ? editingTaskId : null;
  if (editingId) taskUpdating.add(editingId);
  try {
    const tags = Array.from(getTaskTagsDraft(entry.name));
    const dueDate = taskDueDraft[entry.name] || null;
    if (editingId) {
      taskCache[entry.name] = await patchTask(entry.name, editingId, { title, description, dueDate, tags });
      editingTaskId = null;
      editingTaskProject = null;
      taskUpdating.delete(editingId);
    } else {
      taskCache[entry.name] = await postTask(entry.name, title, description, dueDate, tags);
    }
    taskTitleDraft[entry.name] = "";
    taskDescriptionDraft[entry.name] = "";
    taskDueDraft[entry.name] = "";
    taskTagsDraft[entry.name] = new Set();
    taskDueCalendarOpen = false;
    render();
  } catch (err) {
    if (editingId) {
      taskUpdating.delete(editingId);
      refreshTaskRowDisabled(editingId);
    }
    showCardError(panel, err.message);
  } finally {
    taskSubmitting.delete(entry.name);
  }
}

// Re-applies one row's disabled/dimmed look from current state, without a
// full render() — used right when a request against `id` starts or ends.
// render() rebuilds the whole project page from scratch, which would erase
// the very error message showCardError is about to show; a full render()
// (on success, or from some unrelated action) still naturally reflects this
// correctly via buildTaskRow, this only covers the gap until that happens.
// Recomputes disabled fresh (taskUpdating.has(id) || editingTaskId === id)
// rather than trusting a boolean from the caller — a failed Save changes,
// for instance, clears taskUpdating but leaves editingTaskId set, and the
// row needs to stay disabled either way.
function refreshTaskRowDisabled(id) {
  const row = document.querySelector(`.task-row[data-task-id="${id}"]`);
  if (!row) return;
  const disabled = taskUpdating.has(id) || editingTaskId === id;
  row.classList.toggle("disabled", disabled);
  row.querySelectorAll("input, button").forEach((el) => {
    el.disabled = disabled;
  });
}

// Shared by the checkbox (done) and the archive button — both are a PATCH
// against one task id, just with a different field flipped.
async function updateTask(entry, id, changes, panel) {
  if (taskUpdating.has(id)) return;
  taskUpdating.add(id);
  refreshTaskRowDisabled(id);
  try {
    taskCache[entry.name] = await patchTask(entry.name, id, changes);
    taskUpdating.delete(id);
    render();
  } catch (err) {
    taskUpdating.delete(id);
    refreshTaskRowDisabled(id);
    showCardError(panel, err.message);
  }
}

// Unlike archiving, deleting a task can't be undone from the UI, so this
// confirms first — same customConfirm used for deleting a file/folder in the
// Explorer panel.
async function removeTask(entry, id, panel) {
  if (taskUpdating.has(id)) return;
  const confirmed = await customConfirm("Delete this task? This can't be undone.");
  if (!confirmed) return;
  taskUpdating.add(id);
  refreshTaskRowDisabled(id);
  try {
    taskCache[entry.name] = await deleteTask(entry.name, id);
    taskUpdating.delete(id);
    // Deleting the task currently loaded in the composer would otherwise
    // leave it showing "Save changes" for an id that no longer exists.
    if (editingTaskId === id) cancelTaskEdit(entry.name);
    render();
  } catch (err) {
    taskUpdating.delete(id);
    refreshTaskRowDisabled(id);
    showCardError(panel, err.message);
  }
}

// Re-applies the push button's disabled/label state without a full render()
// — same reasoning as refreshTaskRowDisabled: a full render on success
// already reflects this correctly, but the error path needs the button
// re-enabled without wiping the showCardError message about to be shown.
function refreshGitPushButton(project) {
  const btn = document.querySelector(`.git-push-btn[data-project="${project}"]`);
  if (!btn) return;
  const busy = gitPushInFlight.has(project);
  btn.disabled = busy;
  btn.textContent = busy ? "Pushing…" : "Push";
}

// Stages everything, commits with an auto-generated message (server-side —
// see the git-push endpoint) if there's anything to commit, then pushes.
// Invalidates the git-status and history caches on success so the Explorer
// badges and History panel both pick up the new state on the next render.
async function pushProjectChanges(entry, panel) {
  if (gitPushInFlight.has(entry.name)) return;
  gitPushInFlight.add(entry.name);
  refreshGitPushButton(entry.name);
  try {
    await requestGitPush(entry.name);
    delete gitStatusCache[entry.name];
    delete historyCache[entry.name];
    gitPushInFlight.delete(entry.name);
    render();
  } catch (err) {
    gitPushInFlight.delete(entry.name);
    refreshGitPushButton(entry.name);
    showCardError(panel, err.message);
  }
}

// The bar heading the History panel for a git-repo project: how many paths
// currently show a git status, the commit message the next push will use
// (the summary line, full text on hover), plus a one-click "Push" button.
// No commit-message prompt by design — the project's agents keep that
// message written as they work (see git-push in server.js).
function buildGitPushBar(entry, panel, gitState, commitMessage) {
  const bar = document.createElement("div");
  bar.className = "git-push-bar";

  const info = document.createElement("div");
  info.className = "git-push-info";
  const status = document.createElement("span");
  status.className = "git-push-status";
  const changeCount = gitState.byPath.size;
  status.textContent = changeCount === 0 ? "No pending changes" : `${changeCount} change${changeCount === 1 ? "" : "s"}`;
  info.appendChild(status);
  const message = document.createElement("span");
  message.className = "git-push-message" + (commitMessage ? "" : " empty");
  if (commitMessage) {
    message.textContent = commitMessage.split("\n")[0];
    message.title = commitMessage;
  } else {
    message.textContent = "No commit message yet — Push would use “Auto-commit: <date>”";
  }
  info.appendChild(message);
  bar.appendChild(info);

  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "git-push-btn";
  btn.dataset.project = entry.name;
  btn.textContent = "Push";
  btn.disabled = gitPushInFlight.has(entry.name);
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    pushProjectChanges(entry, panel);
  });
  bar.appendChild(btn);
  return bar;
}

// The Explorer's file tree without a search: the project folder's own
// top-level entries, collapsed by default, indented one step deeper per
// level as they're expanded.
function buildFileTree(entry) {
  const container = document.createElement("div");
  container.className = "file-tree";
  container.appendChild(buildFileTreeChildren(entry.name, "", 0));
  return container;
}

const EXPLORER_SEARCH_DELAY = 150; // ms of no typing before the Explorer searches

// The Explorer panel's content: a search box over the file tree, or over
// the search's results once there's something in it (see
// buildExplorerSearchResults). Searching walks the whole project on the
// server, reading every file's contents, so typing waits for a pause first;
// meanwhile, and while it runs,
// the last search's results stay on screen rather than flashing
// "Searching…" on every keystroke.
function buildExplorerPanel(entry) {
  ensureGitStatusLoaded(entry.name);
  const container = document.createElement("div");
  container.className = "explorer-tab";

  // A project folder that couldn't be listed, or holds nothing, has nothing
  // to search either, so there's no search box over saying so.
  const key = explorerSearchKey(entry.name, explorerQuery);
  if (!key) {
    ensureTreeLoaded(entry.name, "");
    const root = fileTreeCache[`${entry.name}::`];
    if (root && (root.error || root.length === 0)) {
      delete explorerLastSearch[entry.name];
      container.appendChild(
        root.error
          ? buildLoadErrorEmpty(entry.name, "Couldn't load files", root.error)
          : buildPanelEmpty({ icon: ICON_FOLDER, title: "Empty folder", text: "The project's folder has no files or folders in it yet." })
      );
      return container;
    }
  }

  const filter = buildPanelFilter({
    key: "explorer",
    value: explorerQuery,
    placeholder: "Search files…",
    label: "Search files and folders",
    onInput: (query) => {
      explorerQuery = query;
      explorerSearchCollapsed = new Set();
      clearTimeout(explorerSearchTimer);
      const key = explorerSearchKey(entry.name, query);
      if (!key || explorerSearchCache[key]) render();
      else explorerSearchTimer = setTimeout(render, EXPLORER_SEARCH_DELAY);
    },
    onClear: () => {
      explorerQuery = "";
      explorerSearchCollapsed = new Set();
      clearTimeout(explorerSearchTimer);
    },
  });
  container.appendChild(filter.el);

  const listEl = document.createElement("div");
  listEl.className = "explorer-list panel-scroll";
  listEl.dataset.scrollKey = "explorer"; // see renderProjectPage
  container.appendChild(listEl);

  if (!key) {
    delete explorerLastSearch[entry.name];
    listEl.appendChild(buildFileTree(entry));
    filter.updateStatus(null, false);
    return container;
  }

  ensureExplorerSearch(entry.name, explorerQuery);
  let shownKey = key;
  if (explorerSearchCache[key]) explorerLastSearch[entry.name] = key;
  else shownKey = explorerLastSearch[entry.name];
  const result = explorerSearchCache[shownKey];
  // Each search's results start from the top; re-renders of the same ones
  // (opening a folder in them, ...) keep their scroll.
  if (result) listEl.dataset.scrollKey = `explorer:${shownKey}`;

  if (!result) {
    listEl.appendChild(fileTreeMessage("Searching…", 0, false));
    filter.updateStatus(null, true);
  } else if (result.error) {
    listEl.appendChild(buildLoadErrorEmpty(entry.name, "Couldn't search", result.error));
    filter.updateStatus(null, true);
  } else {
    const count = result.matches.length;
    filter.updateStatus(`${count}${result.truncated ? "+" : ""} result${count === 1 ? "" : "s"}`, true);
    if (count === 0) {
      listEl.appendChild(
        buildPanelEmpty({
          icon: ICON_SEARCH,
          title: "No matches",
          text: `No file or folder names or contents match “${result.terms.join(" ")}”.`,
          action: { label: "Clear search", onClick: filter.clear },
        })
      );
    } else {
      listEl.appendChild(buildExplorerSearchResults(entry.name, result));
      if (result.truncated) {
        listEl.appendChild(fileTreeMessage(`Showing the first ${count} — add to the search to narrow it down.`, 0, false));
      }
    }
  }
  return container;
}

// --- Project page (/<name>): everything about one project, rebuilt on every
// render() the same way the dashboard is. A header holds who the project is
// plus every action on it (the same real implementations the cards' kebab
// menus use — buildRunButton, unassignEntry, deleteProject,
// buildAssignDropdown, startEditEntry); a dashboard grid below holds its
// Explorer, Tasks, Journal and History panels. The toolbar's "All projects"
// link leads back to the dashboard.
function renderProjectPage() {
  // The dashboard is rebuilt whenever it's shown again — empty it meanwhile
  // so its hidden cards don't answer lookups like findCardByProjectName.
  rootEl.innerHTML = "";
  document.getElementById("create-project").innerHTML = "";

  // A full rebuild would snap every panel's list back to the top on any
  // click inside it (expanding a folder, ticking a task, ...). Carry each
  // one's scroll over, matched by data-scroll-key, while it's still the
  // same project's page.
  const scrolls = {}; // sideways too, for the header's staff row
  // Same for a focused filter field (matched by data-focus-key), caret and
  // all — the Explorer's search results land through a render() while
  // you're still typing in its search box.
  let focus = null;
  if (projectViewEl.dataset.project === currentProjectName) {
    projectViewEl.querySelectorAll("[data-scroll-key]").forEach((el) => {
      scrolls[el.dataset.scrollKey] = { top: el.scrollTop, left: el.scrollLeft };
    });
    const active = document.activeElement;
    if (active && active.dataset.focusKey && projectViewEl.contains(active)) {
      focus = { key: active.dataset.focusKey, start: active.selectionStart, end: active.selectionEnd };
    }
  }

  projectViewEl.replaceChildren(...buildProjectPageContent());
  projectViewEl.dataset.project = currentProjectName;

  projectViewEl.querySelectorAll("[data-scroll-key]").forEach((el) => {
    const scroll = scrolls[el.dataset.scrollKey];
    if (scroll) {
      el.scrollTop = scroll.top;
      el.scrollLeft = scroll.left;
    }
  });
  if (focus) {
    const el = projectViewEl.querySelector(`[data-focus-key="${focus.key}"]`);
    if (el) {
      el.focus({ preventScroll: true });
      if (focus.start !== null) el.setSelectionRange(focus.start, focus.end); // null on a checkbox, which has no caret
    }
  }
}

function buildProjectPageContent() {
  if (!registryLoaded) return [buildProjectMessage("Loading…")];

  const found = findProjectByName(currentProjectName);
  if (!found) {
    const message = buildProjectMessage(`There's no project named "${currentProjectName}". `);
    const back = document.createElement("a");
    back.href = "/";
    back.dataset.route = "";
    back.textContent = "Back to all projects";
    message.appendChild(back);
    return [message];
  }

  const section = findProjectSection(currentProjectSection);
  if (currentProjectSection !== null && !section) {
    const message = buildProjectMessage(`${currentProjectName} has no "${currentProjectSection}" page. `);
    const back = document.createElement("a");
    back.href = projectPath(currentProjectName);
    back.dataset.route = "";
    back.textContent = `Back to ${currentProjectName}`;
    message.appendChild(back);
    return [message];
  }

  const { entry, index, list } = found;
  const content = [buildProjectHeader(entry, index, list)];
  if (isEditingProject(entry, list)) {
    const edit = document.createElement("div");
    edit.id = "project-edit";
    edit.className = "project-edit";
    edit.appendChild(buildCreateProjectForm());
    content.push(edit);
  }
  content.push(section ? buildProjectSectionPage(entry, section) : buildProjectPanels(entry));
  return content;
}

function buildProjectMessage(text) {
  const message = document.createElement("div");
  message.className = "project-message";
  message.textContent = text;
  return message;
}

// Whether the shared add/edit form (see startEditEntry) is editing this
// project right now.
function isEditingProject(entry, list) {
  if (!editingKey || editingKey.list !== list) return false;
  return list === "entries" ? editingKey.port === entry.port : editingKey.name === entry.name;
}

// Who the project is — category, folder, name, port, description, when it
// was created/last edited — on the left, its changes and tasks in the middle
// (see buildProjectActivity), its staff over every action on it on the
// right (see buildProjectStaff), and below those why its last run failed. Action errors land at the foot of this
// header (see showCardError).
function buildProjectHeader(entry, index, list) {
  const header = document.createElement("section");
  header.className = "project-header";
  header.dataset.project = entry.name;

  const top = document.createElement("div");
  top.className = "project-header-top";

  const identity = document.createElement("div");
  identity.className = "project-identity";

  const meta = document.createElement("div");
  meta.className = "project-meta";
  meta.innerHTML =
    list === "entries"
      ? `<span class="project-badge cat-${entry.category}">${CATEGORY_ICONS[entry.category]} ${entry.category}</span>`
      : list === "self"
      ? `<span class="project-badge">🎛️ Dashboard</span>`
      : `<span class="project-badge">${CATEGORY_ICONS.unassigned} Unassigned</span>`;
  meta.appendChild(buildPathButton(entry));
  if (list !== "unassigned") meta.appendChild(buildSiteLink(entry));
  if (entry.url) meta.appendChild(buildLiveSiteLink(entry));
  identity.appendChild(meta);

  const titleRow = document.createElement("div");
  titleRow.className = "project-title-row";
  if (list === "entries") {
    const liveDot = document.createElement("span");
    liveDot.className = "live-dot" + (portLiveStatus[entry.port] ? " live" : "");
    liveDot.dataset.port = entry.port;
    titleRow.appendChild(liveDot);
  } else if (list === "self") {
    // Live by definition, since it's serving this page. No data-port, so the
    // live-status poll, which only checks the projects' ports, leaves it be.
    const liveDot = document.createElement("span");
    liveDot.className = "live-dot live";
    liveDot.title = "Running: it's serving this page";
    titleRow.appendChild(liveDot);
  }
  const title = document.createElement("h1");
  title.className = "project-title";
  if (list === "entries") {
    const titleLink = document.createElement("a");
    titleLink.className = "card-name-text";
    titleLink.dataset.port = entry.port;
    titleLink.textContent = entry.name;
    applyNameLinkState(titleLink, !!portLiveStatus[entry.port]);
    title.appendChild(titleLink);
  } else {
    title.textContent = entry.name;
  }
  const nameGroup = document.createElement("div");
  nameGroup.className = "project-name-group";
  nameGroup.appendChild(title);
  if (list !== "unassigned") {
    const portNumber = document.createElement("span");
    portNumber.className = "project-port-number";
    portNumber.textContent = entry.port;
    portNumber.title =
      list === "self"
        ? `Dispatch always runs on ${entry.port}; projects' ports start at ${BASE_PORT}`
        : `${entry.category}'s port range: ${formatPortRange(categoryPortRange(entry.category))}`;
    nameGroup.appendChild(portNumber);
  }
  titleRow.appendChild(nameGroup);
  if (list === "entries") titleRow.appendChild(buildProjectPortActions(entry, index, header));
  identity.appendChild(titleRow);

  const desc = document.createElement("p");
  desc.className = "project-description" + (entry.description ? "" : " empty");
  desc.textContent = entry.description || "No description";
  if (entry.description) desc.title = entry.description;
  identity.appendChild(desc);

  const pathMeta = buildPathMeta(entry);
  if (pathMeta) identity.appendChild(pathMeta);

  const side = document.createElement("div");
  side.className = "project-side" + (list === "self" ? " self" : "");
  side.append(buildProjectStaff(entry), buildProjectActions(entry, index, list, header));

  top.appendChild(identity);
  top.appendChild(buildProjectActivity(entry));
  top.appendChild(side);
  header.appendChild(top);

  if (list === "entries") {
    const info = projectRunStatus[entry.name];
    if (info && info.status === "crashed" && info.error) {
      header.appendChild(buildProjectCallout("danger", `Last run failed: ${info.error}`));
    }
    if (info && info.twError) {
      header.appendChild(buildProjectCallout("warn", `Tailwind watcher failed: ${info.twError}`));
    }
  }

  return header;
}

// Switch and Eject, right after the port they act on — moving the project
// to another port, or giving this one back (it moves to Unassigned) —
// rather than among the actions that aren't about the port.
function buildProjectPortActions(entry, index, header) {
  const group = document.createElement("div");
  group.className = "project-port-actions";
  group.appendChild(buildPortSwitchDropdown(entry, header));
  const ejectBtn = buildProjectActionButton(ICON_EJECT, "Eject", `Eject project from port ${entry.port}`, () =>
    unassignEntry(entry, index, header)
  );
  ejectBtn.classList.add("danger");
  group.appendChild(ejectBtn);
  return group;
}

// Switch: opens buildPortSwitchMenu, scrolled to this project's own port.
// Off while the Edit form is open on this project — the form has its own
// port field, and keeps track of the project by the port it had.
function buildPortSwitchDropdown(entry, header) {
  const wrap = document.createElement("div");
  wrap.className = "dropdown port-switch" + (portSwitchOpen ? " open" : "");
  const toggle = document.createElement("button");
  toggle.type = "button";
  toggle.className = "icon-btn project-switch-btn";
  toggle.title = "Switch project to another port";
  toggle.setAttribute("aria-expanded", String(portSwitchOpen));
  toggle.innerHTML = `${ICON_SWITCH}<span>Switch</span>`;
  toggle.disabled = isEditingProject(entry, "entries");
  toggle.addEventListener("click", (e) => {
    e.stopPropagation();
    portSwitchOpen = !portSwitchOpen;
    openTagsDropdownFor = null;
    closeJournalCalendar();
    closeTaskCalendar();
    taskDueCalendarOpen = false;
    render();
    const menu = portSwitchOpen && document.querySelector(".port-switch-menu");
    const current = menu && menu.querySelector(".active");
    if (current) menu.scrollTop = current.offsetTop - (menu.clientHeight - current.offsetHeight) / 2;
  });
  wrap.appendChild(toggle);
  if (portSwitchOpen) wrap.appendChild(buildPortSwitchMenu(entry, header));
  return wrap;
}

// The ports `entry` could move to, under a heading per category: every port
// of a capped category, and the unlimited one's up to one past its last
// taken port. Each shows who has it, or that it's free — except that one
// past the last, an open slot shown with a placeholder name and Insert:
// there's always another after it, so it isn't one of the free ports the
// toolbar counts (see countFreePorts).
function buildPortSwitchMenu(entry, header) {
  const menu = document.createElement("div");
  menu.className = "dropdown-menu port-switch-menu";
  menu.dataset.scrollKey = "port-switch"; // see renderProjectPage
  const holders = new Map(entries.map((e) => [Number(e.port), e]));
  for (const cat of CATEGORIES) {
    const range = categoryPortRange(cat);
    const heading = document.createElement("div");
    heading.className = "port-switch-heading";
    heading.innerHTML =
      `<span>${CATEGORY_ICONS[cat]} <span class="port-switch-cat">${cat}</span></span>` +
      `<span class="port-switch-range">${formatPortRange(range)}</span>`;
    menu.appendChild(heading);
    let last = range.end;
    let end = null;
    if (last === Infinity) {
      const taken = entries.filter((e) => e.category === cat).map((e) => Number(e.port));
      last = end = taken.length > 0 ? Math.max(...taken) + 1 : range.start;
    }
    for (let port = range.start; port <= last; port++) {
      menu.appendChild(buildPortSwitchOption(entry, port, holders.get(port) || null, header, port === end));
    }
  }
  return menu;
}

function buildPortSwitchOption(entry, port, holder, header, isEnd) {
  const current = holder === entry;
  const category = categoryForPort(port);
  const opt = document.createElement("button");
  opt.type = "button";
  opt.className = `dropdown-option port-switch-option cat-${category}` + (current ? " active" : "");
  opt.disabled = current;
  opt.title = current
    ? "This project's port"
    : holder
    ? `Swap ports with ${holder.name}`
    : isEnd
    ? `Insert ${entry.name} at ${port}, after ${capitalize(category)}'s last project`
    : `Move to port ${port}`;
  const portEl = document.createElement("span");
  portEl.className = "port-switch-port";
  portEl.textContent = port;
  const holderEl = document.createElement("span");
  holderEl.className = "port-switch-holder" + (holder ? "" : isEnd ? " end" : " free");
  holderEl.textContent = holder ? holder.name : isEnd ? "Next port" : "Free";
  const hint = document.createElement("span");
  hint.className = "port-switch-hint";
  hint.textContent = current ? "✓" : holder ? "Swap" : isEnd ? "Insert" : "";
  opt.append(portEl, holderEl, hint);
  opt.addEventListener("click", (e) => {
    e.stopPropagation();
    portSwitchOpen = false;
    switchProjectPort(entry, port, holder, header);
  });
  return opt;
}

// Moves `entry` to `port`: a free one, or `holder`'s, in which case the two
// swap — `holder` takes `entry`'s old port, after a confirm, since it moves a
// project you may not be looking at. Only those two ever move, and each one's
// category follows its new port, the same as a category switch or a drop on
// the dashboard (see handlePortDrop).
async function switchProjectPort(entry, port, holder, header) {
  const oldPort = Number(entry.port);
  if (holder) {
    const confirmed = await customConfirm(
      `Swap ports with "${holder.name}"? "${entry.name}" moves to ${port} (${categoryForPort(port)}) ` +
        `and "${holder.name}" to ${oldPort} (${categoryForPort(oldPort)}).`
    );
    if (!confirmed) {
      render();
      return;
    }
  }
  if (!(await confirmPortsFree([oldPort, port]))) {
    render();
    return;
  }
  const moves = [{ entry, port }];
  if (holder) moves.push({ entry: holder, port: oldPort });
  const previous = moves.map((m) => ({ entry: m.entry, port: m.entry.port, category: m.entry.category }));
  for (const m of moves) {
    m.entry.port = String(m.port);
    m.entry.category = categoryForPort(m.port);
  }
  markCardSaving(header);
  const ok = await persist();
  if (!ok) {
    for (const prev of previous) {
      prev.entry.port = prev.port;
      prev.entry.category = prev.category;
    }
  }
  render();
}

// The chip after the folder path that opens the project's local site in a
// new tab. Unlike the title (which only links while the port is live), it's
// always a link, so it can be opened straight after Run without waiting for
// the next live-status poll.
function buildSiteLink(entry) {
  const url = `http://localhost:${entry.port}`;
  const link = document.createElement("a");
  link.className = "project-path-link project-site-link";
  link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.title = `Open ${url} in a new tab`;
  link.textContent = `💻 localhost:${entry.port}`;
  return link;
}

// The chip after the localhost one that opens the project's live site, for a
// project that has one (set in its Edit form). Like the localhost chip it
// names just where it goes — the address without its https:// — in full on
// hover.
function buildLiveSiteLink(entry) {
  const link = document.createElement("a");
  link.className = "project-path-link project-site-link";
  link.href = entry.url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.title = `Open ${entry.url} in a new tab`;
  link.textContent = `🌐 ${entry.url.replace(/^https?:\/\//, "").replace(/\/$/, "")}`;
  return link;
}

// The project form's live site as the registry keeps it: "" when left blank,
// https:// added when no scheme was typed (so "example.com" works), without a
// lone trailing slash, and null when it isn't an http(s) address with a
// dotted host at all.
function normalizeSiteUrl(raw) {
  const value = raw.trim();
  if (!value) return "";
  let url;
  try {
    url = new URL(/^[a-z][a-z\d+.-]*:\/\//i.test(value) ? value : `https://${value}`);
  } catch {
    return null;
  }
  if (!["http:", "https:"].includes(url.protocol) || !url.hostname.includes(".")) return null;
  return url.pathname === "/" && !url.search && !url.hash ? url.origin : url.href;
}

function buildProjectCallout(kind, text) {
  const callout = document.createElement("div");
  callout.className = `project-callout ${kind}`;
  const icon = document.createElement("span");
  icon.innerHTML = ICON_WARNING;
  callout.appendChild(icon);
  callout.appendChild(document.createTextNode(text));
  return callout;
}

// The header's middle part: the project's last year of changes, then its
// tasks done against open. It loads the journal and tasks itself, since a
// section's own page doesn't have the panels that otherwise would.
function buildProjectActivity(entry) {
  ensureJournalLoaded(entry.name);
  ensureTasksLoaded(entry.name);
  const activity = document.createElement("div");
  activity.className = "project-activity";
  activity.append(buildChangesGraph(entry.name, activity), buildTaskProgress(entry.name));
  return activity;
}

const ACTIVITY_WEEKS = 53; // this week and the 52 before it — a year, the way GitHub shows one

// One square per day over the last ACTIVITY_WEEKS weeks, a column per week
// (Sunday at the top), shaded by how many changes — journal entries — that
// day had: each step a quarter of the busiest day's count.
// This week's column stops at today.
function buildChangesGraph(name, activity) {
  const state = journalCache[name];
  const counts = new Map();
  if (state && !state.error) {
    for (const day of state.days) counts.set(day.date, (counts.get(day.date) || 0) + day.entries.length);
  }

  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() - (ACTIVITY_WEEKS - 1) * 7);
  const days = [];
  for (let i = 0; ; i++) {
    const date = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i);
    if (date > now) break;
    const key = toDateOnlyString(date);
    days.push({ date, key, count: counts.get(key) || 0, week: Math.floor(i / 7), weekday: i % 7 });
  }
  const total = days.reduce((n, day) => n + day.count, 0);
  const max = Math.max(...days.map((day) => day.count));

  const summaryText = !state
    ? "Loading…"
    : state.error
    ? "Couldn't load the journal"
    : `${countLabel(total, "change")} in the last year`;
  const scale = document.createElement("div");
  scale.className = "activity-legend-scale";
  scale.setAttribute("aria-hidden", "true");
  scale.innerHTML =
    "<span>Less</span>" +
    [0, 1, 2, 3, 4].map((level) => `<span class="activity-swatch activity-level-${level}"></span>`).join("") +
    "<span>More</span>";

  const weekdays = document.createElement("div");
  weekdays.className = "activity-weekdays";
  weekdays.setAttribute("aria-hidden", "true");
  for (const weekday of [1, 3, 5]) {
    const label = document.createElement("span");
    label.style.gridRow = weekday + 2;
    label.textContent = days[weekday].date.toLocaleDateString(undefined, { weekday: "short" });
    weekdays.appendChild(label);
  }

  const grid = document.createElement("div");
  grid.className = "activity-grid";
  grid.setAttribute("role", "img");
  grid.setAttribute("aria-label", `Changes: ${summaryText}`);
  // A month's name over the first week starting in it — and over the first
  // column too, unless the next name follows too closely to fit beside it.
  const monthStarts = [];
  for (let week = 0; week < ACTIVITY_WEEKS; week++) {
    const month = days[week * 7].date.getMonth();
    if (week === 0 || month !== days[(week - 1) * 7].date.getMonth()) monthStarts.push(week);
  }
  if (monthStarts[1] < 3) monthStarts.shift();
  for (const week of monthStarts) {
    const label = document.createElement("span");
    label.className = "activity-month";
    label.style.gridColumn = `${week + 1} / span 3`;
    label.textContent = days[week * 7].date.toLocaleDateString(undefined, { month: "short" });
    label.setAttribute("aria-hidden", "true");
    grid.appendChild(label);
  }
  for (const day of days) {
    const cell = document.createElement("span");
    cell.className = `activity-cell activity-level-${day.count === 0 ? 0 : Math.ceil((day.count / max) * 4)}`;
    cell.style.gridColumn = day.week + 1;
    cell.style.gridRow = day.weekday + 2;
    cell.dataset.date = day.key;
    cell.dataset.count = day.count;
    grid.appendChild(cell);
  }
  grid.addEventListener("mouseover", (e) => {
    const cell = e.target.closest(".activity-cell");
    if (cell) showChangesTooltip(activity, cell);
    else hideChangesTooltip(activity);
  });
  grid.addEventListener("mouseleave", () => hideChangesTooltip(activity));

  const scroll = document.createElement("div");
  scroll.className = "activity-scroll";
  scroll.appendChild(grid);
  const graph = document.createElement("div");
  graph.className = "activity-graph";
  graph.append(weekdays, scroll);

  return buildActivitySection("Changes", summaryText, scale, graph);
}

// "3 changes on Sun, Oct 25, 2026" over a hovered day, kept within the
// activity part's width so it can't push the page sideways on a phone.
function showChangesTooltip(activity, cell) {
  let tip = activity.querySelector(".activity-tooltip");
  if (!tip) {
    tip = document.createElement("div");
    tip.className = "activity-tooltip";
    activity.appendChild(tip);
  }
  const count = Number(cell.dataset.count);
  const figure = document.createElement("strong");
  figure.textContent = count === 0 ? "No changes" : countLabel(count, "change");
  const date = parseDateOnly(cell.dataset.date).toLocaleDateString(undefined, {
    weekday: "short",
    month: "short",
    day: "numeric",
    year: "numeric",
  });
  tip.replaceChildren(figure, ` on ${date}`);
  const box = activity.getBoundingClientRect();
  const rect = cell.getBoundingClientRect();
  const half = tip.offsetWidth / 2;
  const center = rect.left + rect.width / 2 - box.left;
  tip.style.left = `${Math.min(Math.max(center, half), box.width - half)}px`;
  tip.style.top = `${rect.top - box.top - 6}px`;
}

function hideChangesTooltip(activity) {
  const tip = activity.querySelector(".activity-tooltip");
  if (tip) tip.remove();
}

// The project's done tasks against its open ones, which together make its
// total. Archived tasks have been put away, so they count as neither — the
// Tasks panel's header still counts them.
function buildTaskProgress(name) {
  const state = taskCache[name];
  const counts = { open: 0, done: 0, archived: 0 };
  if (state && !state.error) for (const task of state.tasks) counts[taskStatus(task)]++;
  const total = counts.open + counts.done;

  const summaryText = !state
    ? "Loading…"
    : state.error
    ? "Couldn't load tasks"
    : total > 0
    ? `${Math.floor((counts.done / total) * 100)}% done`
    : counts.archived > 0
    ? "No open or done tasks"
    : "No tasks yet";

  const legend = document.createElement("div");
  legend.className = "activity-legend";
  if (total > 0) {
    for (const status of ["done", "open"]) {
      const item = document.createElement("span");
      item.className = "activity-legend-item";
      const swatch = document.createElement("span");
      swatch.className = `activity-swatch task-progress-${status}`;
      const figure = document.createElement("span");
      figure.className = "task-progress-figure";
      figure.textContent = counts[status];
      item.append(swatch, figure, ` ${status}`);
      legend.appendChild(item);
    }
    const totalItem = document.createElement("span");
    const totalFigure = document.createElement("span");
    totalFigure.className = "task-progress-figure";
    totalFigure.textContent = total;
    totalItem.append(totalFigure, " total");
    legend.appendChild(totalItem);
  }

  const bar = document.createElement("div");
  bar.className = "task-progress-bar" + (total === 0 ? " empty" : "");
  bar.setAttribute("role", "progressbar");
  bar.setAttribute("aria-label", "Tasks done");
  bar.setAttribute("aria-valuemin", "0");
  bar.setAttribute("aria-valuemax", String(total));
  bar.setAttribute("aria-valuenow", String(counts.done));
  for (const status of ["done", "open"]) {
    if (counts[status] === 0) continue;
    const segment = document.createElement("span");
    segment.className = `task-progress-${status}`;
    segment.style.flex = `${counts[status]} 1 0`;
    segment.title = `${counts[status]} ${status}`;
    bar.appendChild(segment);
  }

  return buildActivitySection("Tasks", summaryText, legend, bar);
}

// A title (text, or a link) and its figure, if any, on the left over `body`,
// with `aside` (a legend), if any, on the right of the title.
function buildActivitySection(titleContent, summaryText, aside, body) {
  const section = document.createElement("div");
  section.className = "activity-section";
  const head = document.createElement("div");
  head.className = "activity-head";
  const main = document.createElement("div");
  main.className = "activity-head-main";
  const title = document.createElement("span");
  title.className = "activity-title";
  title.append(titleContent);
  main.appendChild(title);
  if (summaryText) {
    const summary = document.createElement("span");
    summary.textContent = summaryText;
    main.appendChild(summary);
  }
  head.appendChild(main);
  if (aside) head.appendChild(aside);
  section.append(head, body);
  return section;
}

// Who works on the project (see projectStaff), on one row that scrolls
// sideways once it's full. With no one to show, it says so instead, the
// way an empty panel does, as the Staff page does too (STAFF_EMPTY).
function buildProjectStaff(entry) {
  const staff = projectStaff(entry);
  // Its title links to the Staff page, the way a panel's does to its own —
  // except on that page.
  const onStaffPage = currentProjectSection === STAFF_SECTION.slug;
  const title = onStaffPage ? "Staff" : buildTitleLink("Staff", projectPath(entry.name, STAFF_SECTION.slug));
  const body = staff.length ? buildStaffRow(staff) : buildPanelEmpty(STAFF_EMPTY);
  const section = buildActivitySection(title, null, null, body);
  section.classList.add("project-staff");
  return section;
}

// The people on a project, its Project Lead first, then everybody else, as
// { name, role, lead, online }. There are no dev profiles yet, so no project
// has anyone on it.
function projectStaff(entry) {
  return [];
}

function buildStaffRow(staff) {
  const row = document.createElement("div");
  row.className = "staff-row";
  row.dataset.scrollKey = "staff"; // see renderProjectPage
  // With no scrollbar to drag, a mouse wheel scrolls the row sideways — until
  // it reaches an end, where the page gets the wheel back. A trackpad's or
  // Shift+wheel's sideways scroll is left to the browser.
  row.addEventListener(
    "wheel",
    (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      const max = row.scrollWidth - row.clientWidth;
      const next = Math.min(Math.max(row.scrollLeft + e.deltaY * (e.deltaMode === 1 ? 16 : 1), 0), max);
      if (max <= 0 || next === row.scrollLeft) return;
      e.preventDefault();
      row.scrollLeft = next;
    },
    { passive: false }
  );
  for (const member of staff) row.appendChild(buildStaffCard(member));
  return row;
}

// One person on the project (see projectStaff): their avatar, with a green
// dot when they're logged in, over their name and role, and under them what
// can be done to them (see buildStaffActions). The lead's role is set apart
// (see .staff-role.lead).
function buildStaffCard(member) {
  const card = document.createElement("div");
  card.className = "staff-card";
  const avatar = document.createElement("span");
  avatar.className = "staff-avatar";
  if (member.online) {
    const presence = document.createElement("span");
    presence.className = "staff-presence";
    presence.title = "Logged in";
    presence.setAttribute("role", "img");
    presence.setAttribute("aria-label", "Logged in");
    avatar.appendChild(presence);
  }
  const text = document.createElement("div");
  text.className = "staff-text";
  const name = document.createElement("span");
  name.className = "staff-name";
  name.textContent = member.name;
  name.title = member.name;
  const roleEl = document.createElement("span");
  roleEl.className = "staff-role" + (member.lead ? " lead" : "");
  roleEl.textContent = member.role;
  text.append(name, roleEl);
  card.append(avatar, text, buildStaffActions());
  return card;
}

// A row of icons under a staff card's role: Message, Suspend (keeps them
// from acting on the project until it's lifted) and Remove — few enough to
// show without a menu. With no profiles yet there's no one for them to act
// on, so they don't do anything.
function buildStaffActions() {
  const actions = document.createElement("div");
  actions.className = "staff-actions";
  for (const [icon, label, danger] of [
    [ICON_CHAT_DOTS, "Message", false],
    [ICON_LOCK, "Suspend", false],
    [ICON_MINUS_CIRCLE, "Remove", true],
  ]) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "staff-action" + (danger ? " danger" : "");
    btn.title = label;
    btn.setAttribute("aria-label", label);
    btn.innerHTML = icon;
    actions.appendChild(btn);
  }
  return actions;
}

// Run (assigned projects only), VS Code, Edit, Assign (unassigned projects
// only) and Delete — labeled here, since unlike a card there's room for the
// words. An assigned project's Switch and Eject sit after its port instead
// (see buildProjectPortActions).
function buildProjectActions(entry, index, list, header) {
  const actions = document.createElement("div");
  actions.className = "card-actions project-actions";

  if (list === "entries") actions.appendChild(buildRunButton(entry));

  actions.appendChild(
    buildProjectActionButton(ICON_VSCODE, "VS Code", "Open in VS Code", async () => {
      try {
        await openInVSCode(entry.name);
      } catch (err) {
        showCardError(header, err.message);
      }
    })
  );

  // Dispatch's own page (see SELF_PROJECT) stops there: it has no
  // registry entry to edit or assign, and it mustn't delete itself.
  if (list === "self") return actions;

  const editBtn = buildProjectActionButton(ICON_EDIT, "Edit", "Edit details", () => startEditEntry(entry, list));
  editBtn.disabled = isEditingProject(entry, list);
  actions.appendChild(editBtn);

  if (list !== "entries") actions.appendChild(buildAssignDropdown(entry, index));

  const deleteBtn = buildProjectActionButton(ICON_TRASH, "Delete", "Delete project", async () => {
    await deleteProject(entry, list, index, header);
    // Once it's gone there's no page left to show — back to the dashboard.
    if (!findProjectByName(entry.name)) navigate("/");
  });
  deleteBtn.classList.add("danger", "danger-fill");
  actions.appendChild(deleteBtn);

  return actions;
}

function buildProjectActionButton(icon, label, title, onClick) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "icon-btn";
  btn.title = title;
  btn.innerHTML = `${icon}<span>${label}</span>`;
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    onClick();
  });
  return btn;
}

// The project page's panels, in reading order (History under Explorer), so
// Tab moves through them the way they're laid out. Each also has a page of
// its own at /<name>/<slug>, where it's the only panel and gets all the
// room; on the project page its title links there. `meta` gives the
// figures on the right of its header (see buildProjectPanel).
const PROJECT_SECTIONS = [
  { slug: "explore", area: "explorer", title: "Explorer", meta: explorerCountsMeta, build: (entry) => buildExplorerPanel(entry) },
  { slug: "history", area: "history", title: "History", meta: historyMeta, build: buildHistoryPanel },
  { slug: "tasks", area: "tasks", title: "Tasks", meta: taskCountsMeta, build: buildTasksPanel },
  { slug: "journal", area: "journal", title: "Journal", meta: journalCountsMeta, build: buildJournalPanel },
];

// The header's Staff links to a page of its own too, laid out like a
// panel's, though it has no panel in the grid. Until there are dev profiles
// it only says so.
const STAFF_SECTION = { slug: "staff", area: "staff", title: "Staff", meta: () => ({ text: "No profiles yet" }), build: buildStaffPanel };

// What the Staff page and the header's Staff show while a project has no
// one on it (see projectStaff).
const STAFF_EMPTY = {
  icon: ICON_USERS,
  title: "No dev profiles yet",
  text: "Staff profiles will show up here once they are assigned.",
};

function buildStaffPanel() {
  return buildPanelEmpty(STAFF_EMPTY);
}

function buildProjectPanels(entry) {
  const grid = document.createElement("div");
  grid.className = "project-grid";
  for (const section of PROJECT_SECTIONS) grid.appendChild(buildSectionPanel(entry, section, true));
  return grid;
}

// A section's own page (/<name>/<slug>): just its panel, as wide and as tall
// as the grid on the project page is.
function buildProjectSectionPage(entry, section) {
  const page = document.createElement("div");
  page.className = "project-section-page";
  page.appendChild(buildSectionPanel(entry, section, false));
  return page;
}

function buildSectionPanel(entry, section, linked) {
  return buildProjectPanel({
    area: section.area,
    title: section.title,
    href: linked ? projectPath(entry.name, section.slug) : null,
    meta: section.meta(entry.name),
    buildBody: (panel) => section.build(entry, panel),
  });
}

// A title that links to its page: the label with a chevron after it.
function buildTitleLink(title, href) {
  const link = document.createElement("a");
  link.className = "project-panel-title-link";
  link.href = href;
  link.dataset.route = "";
  link.title = `Open ${title} on its own page`;
  const label = document.createElement("span");
  label.textContent = title;
  link.appendChild(label);
  link.insertAdjacentHTML("beforeend", ICON_CHEVRON_RIGHT);
  return link;
}

// One dashboard panel: a titled header — the title a link to `href` with a
// chevron after it, when there's one — with at-a-glance figures on its right
// (`meta`: { text, title }, { el } when they're controls of their own, or
// null), over a body filled by `buildBody`,
// which is handed the panel itself, where its errors get shown (see
// showCardError).
function buildProjectPanel({ area, title, href, meta, buildBody }) {
  const panel = document.createElement("section");
  panel.className = `project-panel project-panel-${area}`;

  const header = document.createElement("div");
  header.className = "project-panel-header";
  const heading = document.createElement("h2");
  heading.className = "project-panel-title";
  heading.append(href ? buildTitleLink(title, href) : title);
  header.appendChild(heading);
  if (meta && meta.el) {
    header.appendChild(meta.el);
  } else if (meta) {
    const metaEl = document.createElement("span");
    metaEl.className = "project-panel-meta";
    metaEl.textContent = meta.text;
    if (meta.title) metaEl.title = meta.title;
    header.appendChild(metaEl);
  }
  panel.appendChild(header);

  const body = document.createElement("div");
  body.className = "project-panel-body";
  body.appendChild(buildBody(panel));
  panel.appendChild(body);
  return panel;
}

// What a panel shows in its list's place when there's nothing to list: an
// icon in a circle over a title, a line on why and what to do about it, and
// at most one button (`action`: { label, icon, onClick }). `tone: "error"`
// tints the icon red, for a load that failed (see buildLoadErrorEmpty).
function buildPanelEmpty({ icon, title, text, action = null, tone = null }) {
  const empty = document.createElement("div");
  empty.className = "panel-empty" + (tone ? ` ${tone}` : "");
  const iconEl = document.createElement("span");
  iconEl.className = "panel-empty-icon";
  iconEl.innerHTML = icon;
  const titleEl = document.createElement("div");
  titleEl.className = "panel-empty-title";
  titleEl.textContent = title;
  empty.append(iconEl, titleEl);
  if (text) {
    const textEl = document.createElement("div");
    textEl.className = "panel-empty-text";
    textEl.textContent = text;
    empty.appendChild(textEl);
  }
  if (action) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "panel-empty-action";
    btn.innerHTML = action.icon || "";
    btn.append(action.label);
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      action.onClick();
    });
    empty.appendChild(btn);
  }
  return empty;
}

// Where a panel's list goes while its data is on the way.
function buildPanelLoading() {
  const loading = document.createElement("div");
  loading.className = "panel-loading";
  loading.textContent = "Loading…";
  return loading;
}

// A panel whose data didn't load: what failed (`title`), why, and a Try
// again that asks for everything of the project's that failed, since one
// cause (the server being down) usually fails them all.
function buildLoadErrorEmpty(name, title, message) {
  return buildPanelEmpty({
    icon: ICON_WARNING,
    tone: "error",
    title,
    text: describeLoadError(message),
    action: { label: "Try again", icon: ICON_REFRESH, onClick: () => retryFailedLoads(name) },
  });
}

// fetch() rejects with a TypeError, worded by the browser ("NetworkError
// when attempting to fetch resource.", "Failed to fetch", "Load failed"),
// when nothing answers at all — this dashboard's own server is down or
// restarting. Anything else is the server's own message, shown as it is.
function describeLoadError(message) {
  return /NetworkError|Failed to fetch|Load failed/i.test(message)
    ? "The Dispatch server didn't answer. Make sure it's running, then try again."
    : message;
}

// Drops every cached load of `name`'s that failed, so the render() after it
// fetches them again. What loaded fine is kept.
function retryFailedLoads(name) {
  for (const cache of [taskCache, journalCache, historyCache, gitStatusCache, explorerCountsCache, projectPathInfo]) {
    if (cache[name] && cache[name].error) delete cache[name];
  }
  for (const cache of [fileTreeCache, explorerSearchCache]) {
    for (const key of Object.keys(cache)) {
      if (key.startsWith(`${name}::`) && cache[key].error) delete cache[key];
    }
  }
  render();
}

// "1 file", "3 files".
function countLabel(n, singular, plural = `${singular}s`) {
  return `${n} ${n === 1 ? singular : plural}`;
}

// The panels' header figures. Read from whatever's already cached — the
// panel's own render kicks off the fetch (the Explorer's counts, which its
// body doesn't need, are fetched from here), and the render() that follows
// it fills these in.
function explorerCountsMeta(name) {
  ensureExplorerCountsLoaded(name);
  const state = explorerCountsCache[name];
  if (!state || state.error) return null;
  return {
    text: `${countLabel(state.folders, "folder")} · ${countLabel(state.files, "file")}`,
    title: state.skipped.length > 0 ? `Not counting what's in ${state.skipped.join(", ")}` : null,
  };
}

function historyMeta(name) {
  const state = historyCache[name];
  if (!state || state.error || !state.isRepo) return null;
  const parts = [state.branch, countLabel(state.commitCount, "commit")];
  if (state.unpushedCount > 0) parts.push(`${state.unpushedCount} unpushed`);
  return {
    text: parts.join(" · "),
    title: state.unpushedCount > 0 ? `${countLabel(state.unpushedCount, "commit")} not on ${state.upstream} yet` : null,
  };
}

function taskCountsMeta(name) {
  const state = taskCache[name];
  if (!state || state.error) return null;
  const counts = { open: 0, done: 0, archived: 0 };
  for (const task of state.tasks) counts[taskStatus(task)]++;
  return { el: buildTaskStatusFilter(counts) };
}

// The Tasks header's figures, each a checkbox button for whether its tasks
// are listed (see tasksForStatusFilter). Checking or unchecking one shows
// the list from the top, same as picking a date range. A status with no
// tasks is disabled; it keeps its checked state for when it has some again.
function buildTaskStatusFilter(counts) {
  const group = document.createElement("div");
  group.className = "task-status-filter";
  group.setAttribute("role", "group");
  group.setAttribute("aria-label", "Show tasks by status");
  for (const status of TASK_STATUSES) {
    const checked = taskStatusFilter.has(status);
    const empty = counts[status] === 0;
    const label = document.createElement("label");
    label.className = "task-status-btn" + (checked ? " active" : "") + (empty ? " disabled" : "");
    if (empty) label.title = `No ${status} tasks`;
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = checked;
    checkbox.disabled = empty;
    checkbox.dataset.focusKey = `task-status-${status}`; // keeps keyboard focus on it through the render() below
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) taskStatusFilter.add(status);
      else taskStatusFilter.delete(status);
      render();
      const list = document.querySelector('[data-scroll-key="tasks"]');
      if (list) list.scrollTop = 0;
    });
    const text = document.createElement("span");
    text.textContent = `${counts[status]} ${status}`;
    label.append(decorateCheckbox(checkbox), text);
    group.appendChild(label);
  }
  return group;
}

function journalCountsMeta(name) {
  const state = journalCache[name];
  if (!state || state.error) return null;
  const entryCount = state.days.reduce((n, day) => n + day.entries.length, 0);
  return { text: `${countLabel(entryCount, "entry", "entries")} · ${countLabel(state.days.length, "day")}`, title: null };
}

// Puts `message` just above the element's own action row when it has one
// (a card), or at its foot otherwise (the project header, a panel).
function showCardError(card, message) {
  clearCardError(card);
  const err = document.createElement("div");
  err.className = "card-error";
  err.textContent = message;
  card.insertBefore(err, card.querySelector(":scope > .card-actions"));
}

function clearCardError(card) {
  const existing = card.querySelector(".card-error");
  if (existing) existing.remove();
}

// Scroll positions are restored by applyRoute itself (the dashboard's to
// where it was left, a project page's to the top), not by the browser.
history.scrollRestoration = "manual";
({ project: currentProjectName, section: currentProjectSection } = routeFromPath(location.pathname));
if (currentProjectName !== null) render(); // "Loading…" until the registry arrives
load();
setInterval(refreshPortLiveStatus, 5000);
setInterval(refreshProjectRunStatus, 5000);
setInterval(refreshStats, 5000);
</script>
</body>
</html>
